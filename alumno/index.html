<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#87863A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Método Semilla">
<link rel="manifest" href="/alumno/manifest.json">
<link rel="icon" type="image/png" href="/icono-192.png">
<link rel="apple-touch-icon" href="/icono-180.png">
<title>Tu seguimiento · Método Semilla</title>
<style>html,body{margin:0;height:100%;background:#F2EDE4}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="marco" title="Tu seguimiento"></iframe>
<script>
const a=new URLSearchParams(location.search).get('a')||'';
const marco=document.getElementById('marco');
function cargar(){ marco.src='https://semillaredes.com/alumno.html?a='+encodeURIComponent(a)+'&v='+Date.now(); }
cargar();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) cargar(); });
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }
</script>
</body>
</html>

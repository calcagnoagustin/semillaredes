<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1A2456">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Semilla">
<title>Tu panel · Método Semilla</title>
<link rel="manifest" href="/alumno-manifest.json">
<link rel="icon" href="/icono-192.png">
<link rel="apple-touch-icon" href="/icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--crema:#F2EDE4;--navy:#1A2456;--vino:#7A1F3A;--rosa:#E2767C;--oliva:#87863A;--tinta:#24242C;--mute:#6B6878;--linea:#DDD6C7}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--crema);color:var(--tinta);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:calc(36px + env(safe-area-inset-top,0px)) 20px calc(56px + env(safe-area-inset-bottom,0px))}
.kick{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--oliva);margin:0 0 10px}
.kick svg{flex:none}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:600;color:var(--navy);font-size:40px;line-height:1.1;margin:0 0 6px}
.quien{color:var(--mute);margin:0 0 26px}
h2{font-family:'Playfair Display',Georgia,serif;font-weight:600;color:var(--navy);font-size:26px;margin:44px 0 4px}
p.sub{color:var(--mute);font-size:15px;margin:0 0 16px}
.hoja{background:#fff;border-radius:16px;padding:22px}
.hoja h3{font-size:15px;font-weight:700;color:var(--navy);margin:0 0 12px}
.grilla{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 12px}
@media(min-width:620px){.grilla.cuatro{grid-template-columns:repeat(4,1fr)}}
label{display:block;font-size:13px;color:var(--mute);margin:0 0 5px}
input,textarea,select{width:100%;border:1px solid var(--linea);border-radius:10px;background:#fff;padding:11px 12px;font:inherit;font-size:16px;color:var(--tinta);min-width:0}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.bloque{border-top:1px solid #EEE8DC;margin-top:18px;padding-top:18px}
.fechas{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.toggles{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tg{border:1px dashed var(--navy);background:transparent;color:var(--navy);border-radius:999px;padding:9px 14px;font:600 14px Inter,system-ui,sans-serif;cursor:pointer}
.tg.on{border-style:solid;background:var(--navy);color:var(--crema)}
.btn{display:inline-block;background:var(--navy);color:var(--crema);border:0;border-radius:12px;padding:14px 22px;font:700 16px Inter,system-ui,sans-serif;cursor:pointer}
.btn.sec{background:transparent;color:var(--navy);border:1px solid var(--navy);padding:11px 16px;font-size:14px}
.acciones{display:flex;align-items:center;gap:14px;margin-top:20px;flex-wrap:wrap}
.ok{color:var(--oliva);font-weight:600;font-size:14px}
.tarj{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.tarj{grid-template-columns:repeat(3,1fr)}}
.card{background:#fff;border-radius:14px;padding:16px}
.card .lab{font-size:13px;color:var(--mute);margin:0 0 6px}
.card .val{font-family:'Playfair Display',Georgia,serif;font-size:27px;color:var(--navy);line-height:1.1}
.card .dif{font-size:12px;margin-top:6px;color:var(--mute)}
.card .dif.bien{color:var(--oliva)}.card .dif.mal{color:var(--vino)}
.card.dest{background:var(--navy)}.card.dest .lab,.card.dest .dif{color:#B9B4C4}.card.dest .val{color:var(--crema)}
.modulo{margin-top:22px}
.modulo h3{font-size:15px;color:var(--navy);margin:0 0 10px}
.graf{background:#fff;border-radius:14px;padding:16px 16px 8px;margin-top:12px}
.graf h4{margin:0 0 2px;font-size:15px;color:var(--navy)}
.graf p{margin:0 0 6px;font-size:13px;color:var(--mute)}
.graf svg{width:100%;height:auto;display:block}
.vacio{background:#fff;border-radius:14px;padding:18px;color:var(--mute)}
.lista{background:#fff;border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid #F0EBE1}
.item:first-child{border-top:0}
.item .tx{flex:1;min-width:0}
.lapiz{flex:none;border:0;background:transparent;color:#8C8699;cursor:pointer;padding:4px;line-height:0;border-radius:6px}
.lapiz:hover{color:var(--navy);background:#F0EBE1}
h1 .lapiz{vertical-align:middle;margin-left:6px}
.editor{display:grid;gap:8px;margin:6px 0 14px}
.editor .fila{display:flex;gap:8px;flex-wrap:wrap}
.ia{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--linea);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--navy);margin:0 0 12px}
.editando{outline:2px solid var(--rosa);outline-offset:2px}
.x{flex:none;border:0;background:transparent;color:#A9A2B3;font-size:20px;line-height:1;cursor:pointer;padding:4px}
.chk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--navy);background:transparent;cursor:pointer;padding:0}
.chk.curso{background:linear-gradient(90deg,var(--navy) 50%,transparent 50%)}
.chk.hecha{background:var(--navy)}
.item.hecha .tx{color:var(--mute);text-decoration:line-through}
.agregar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.hito .barra{height:8px;border-radius:999px;background:#EEE8DC;margin-top:8px;overflow:hidden}
.hito .barra i{display:block;height:100%;background:var(--oliva);border-radius:999px}
.hito .det{font-size:13px;color:var(--mute);margin-top:6px}
.hitoform{display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px;margin-top:10px}
@media(max-width:560px){.hitoform{grid-template-columns:1fr 1fr}.hitoform button{grid-column:1/-1}}
.nota{background:#fff;border-radius:14px;padding:14px 16px;margin-top:10px;position:relative}
.nota .f{font-size:12px;color:var(--mute);margin-bottom:4px}
.nota .t{padding-right:56px}
.nota .t{padding-right:24px;white-space:pre-wrap}
.consejo{background:#fff;border-radius:14px;padding:16px;margin-top:10px;border-left:4px solid var(--rosa)}
.consejo b{display:block;color:var(--navy);margin-bottom:4px}
.consejo span{color:var(--tinta);font-size:15px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:14px}
th,td{padding:10px 12px;text-align:right;border-top:1px solid #F0EBE1;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--mute);font-weight:600;border-top:0}
.tabla{overflow-x:auto;border-radius:14px}
footer{margin-top:52px;display:flex;justify-content:center;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:3px;color:var(--navy)}
/* acceso con PIN */
.puerta{max-width:380px;margin:12vh auto 0;text-align:center}
.puerta h1{font-size:32px}
.pin{letter-spacing:14px;text-align:center;font-size:26px;max-width:200px;margin:18px auto}
.error{color:var(--vino);font-size:14px;min-height:20px}
/* popup de instalacion */
.velo{position:fixed;inset:0;background:rgba(26,36,86,.45);display:none;align-items:flex-end;justify-content:center;z-index:40;padding:16px}
.velo.on{display:flex}
.pop{background:var(--crema);border-radius:20px;max-width:440px;width:100%;padding:24px 22px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 10px 40px rgba(26,36,86,.25)}
@media(min-width:600px){.velo{align-items:center}}
.pop .cab{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.pop .cab img{width:56px;height:56px;border-radius:14px}
.pop h3{font-family:'Playfair Display',Georgia,serif;font-weight:600;color:var(--navy);font-size:23px;margin:0;line-height:1.15}
.pop p{margin:6px 0 16px;color:var(--tinta)}
.pop ol{margin:0 0 18px;padding-left:22px}
.pop li{margin:8px 0}
.pop .fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ico-comp{display:inline-block;vertical-align:-4px}
.btn-inst{display:none;align-items:center;gap:8px;background:var(--navy);color:var(--crema);border:0;border-radius:999px;padding:9px 16px;font:700 14px Inter,system-ui,sans-serif;cursor:pointer;margin:0 0 20px}
.btn-inst.on{display:inline-flex}
@media(prefers-reduced-motion:no-preference){.pop{animation:sube .35s ease-out}@keyframes sube{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<main id="app"><p class="quien" style="padding-top:20vh;text-align:center">Cargando…</p></main>

<div class="velo" id="velo" role="dialog" aria-modal="true" aria-labelledby="popTit">
  <div class="pop">
    <div class="cab"><img src="/icono-192.png" alt=""><h3 id="popTit">Tené tu panel en el celular</h3></div>
    <p id="popTxt">Con la app instalada cargás tus números en un toque, sin buscar el link.</p>
    <div id="popPasos"></div>
    <div class="fila"><button class="btn" id="popSi">Instalar</button><button class="btn sec" id="popNo">Ahora no</button></div>
  </div>
</div>

<script>
const SB='https://fdrxsjphlvvwwknnrjtx.supabase.co', KEY='sb_publishable_kT7McM9Dt7xP44IlFotsLA_8-b8q_17';
const rpc=(fn,a)=>fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(a)}).then(r=>r.json());
const $=id=>document.getElementById(id);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const q=new URLSearchParams(location.search);
let SLUG=(q.get('p')||ls.get('al_ultimo')||'').toLowerCase();
let TOK=SLUG?ls.get('al_'+SLUG):null;
let D=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=(v,d=0)=>v==null||isNaN(v)?'—':Number(v).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
let MONEDA='ARS';
const din=(v,d=0)=>v==null||isNaN(v)?'—':(MONEDA==='USD'?'USD ':'$ ')+nf(v,d);
const hoyISO=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const sumar=(iso,n)=>{const d=new Date(iso+'T12:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const ddmm=iso=>{const p=String(iso).slice(0,10).split('-');return p[2]+'/'+p[1]};
const num=v=>{v=String(v??'').trim();if(!v)return null;v=v.includes(',')?v.replace(/\./g,'').replace(',','.'):(/^\d{1,3}(\.\d{3})+$/.test(v)?v.replace(/\./g,''):v);const n=parseFloat(v);return isNaN(n)?null:n};
const div=(a,b)=>a!=null&&b?a/b:null;
const LAPIZ=`<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
const lapiz=(attrs,lab)=>`<button class="lapiz" ${attrs} aria-label="${lab}">${LAPIZ}</button>`;
let EDIT_ID=null, EDIT_DESDE=null;
const ico=`<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 C18 7 18 17 12 21 C6 17 6 7 12 3 Z" fill="#87863A"/></svg>`;

// ---------- calculos por periodo ----------
function calc(m){
  m=m||{}; const o={...m};
  o.ig_costo=div(m.ig_inversion,m.ig_nuevos); o.ig_conv=m.ig_visitas?(m.ig_nuevos||0)/m.ig_visitas*100:null;
  o.msj_costo=div(m.msj_inversion,m.msj_mensajes); o.msj_costo_venta=div(m.msj_inversion,m.msj_ventas); o.msj_roas=div(m.msj_facturacion,m.msj_inversion);
  o.vta_costo=div(m.vta_inversion,m.vta_ventas); o.vta_roas=div(m.vta_facturacion,m.vta_inversion);
  o.facturacion=(m.msj_facturacion||0)+(m.vta_facturacion||0)||null;
  o.sp_sl=div(m.sp_streams,m.sp_listeners); o.sp_costo=div(m.sp_inversion,m.sp_streams);
  return o;
}
const METRICAS={sp_monthly:'Oyentes mensuales en Spotify',sp_streams:'Streams en un período',yt_subs:'Suscriptores en YouTube',yt_views:'Visualizaciones en YouTube en un período',ig_total:'Seguidores',ig_nuevos:'Seguidores nuevos en un período',msj_mensajes:'Mensajes en un período',msj_ventas:'Ventas por mensajes en un período',vta_ventas:'Ventas online en un período',facturacion:'Facturación en un período'};

// ---------- tarjeta con comparacion ----------
function card(lab,val,act,ant,{dest=false,menosEsMejor=false}={}){
  let dif='';
  if(act!=null&&ant!=null&&ant!==0){ const p=(act-ant)/Math.abs(ant)*100; const bien=menosEsMejor?p<0:p>0;
    dif=`<div class="dif ${Math.abs(p)<1?'':(bien?'bien':'mal')}">${Math.abs(p)<1?'Igual que el período anterior':(p>0?'▲':'▼')+' '+nf(Math.abs(p))+'% vs período anterior'}</div>`; }
  return `<div class="card${dest?' dest':''}"><p class="lab">${lab}</p><div class="val">${val}</div>${dif}</div>`;
}

// ---------- grafico de linea simple ----------
function linea(tit,sub,serie,color,fmt=v=>nf(v)){
  const pts=serie.filter(p=>p.v!=null); if(pts.length<2) return '';
  const W=640,H=180,px=34,py=26, vs=pts.map(p=>p.v), mn=Math.min(...vs), mx=Math.max(...vs), rg=(mx-mn)||1;
  const X=i=>px+i*(W-2*px)/(pts.length-1), Y=v=>H-py-(v-mn)/rg*(H-2*py);
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const et=pts.map((p,i)=>`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="12" fill="#6B6878">${ddmm(p.f)}</text>`).join('');
  const va=pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="4" fill="${color}"/><text x="${X(i)}" y="${Y(p.v)-10}" text-anchor="middle" font-size="12" fill="#24242C">${fmt(p.v)}</text>`).join('');
  return `<div class="graf"><h4>${tit}</h4><p>${sub}</p><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${tit}"><path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${va}${et}</svg></div>`;
}

// ---------- pantallas ----------
function puerta(nombre){
  $('app').innerHTML=`<div class="puerta"><p class="kick" style="justify-content:center">${ico}Método Semilla</p>
    <h1>${esc(nombre||'Tu panel')}</h1><p class="quien">Poné tu PIN de 4 números para entrar. Te lo pide una sola vez en este celular.</p>
    <input id="pin" class="pin" inputmode="numeric" maxlength="4" autocomplete="one-time-code" aria-label="PIN de 4 números">
    <p class="error" id="err"></p><button class="btn" id="entrar">Entrar</button>
    <p class="quien" style="margin-top:22px;font-size:14px">¿No tenés panel todavía? <a href="/alumnos/" style="color:var(--vino)">Creá el tuyo</a>.</p></div>`;
  const go=async()=>{ const p=$('pin').value.trim(); if(!/^\d{4}$/.test(p)){ $('err').textContent='El PIN tiene 4 números.'; return; }
    const r=await rpc('al_entrar',{p_slug:SLUG,p_pin:p});
    if(r&&r.ok){ TOK=r.token; ls.set('al_'+SLUG,TOK); ls.set('al_ultimo',SLUG); cargar(); } else $('err').textContent='Ese PIN no coincide. Si no te lo acordás, pedile a Agus que lo resetee.'; };
  $('entrar').onclick=go; $('pin').onkeydown=e=>{ if(e.key==='Enter') go(); }; $('pin').focus();
}

async function cargar(){
  if(!SLUG){ location.replace('/alumnos/'); return; }
  if(!TOK){ const e=await rpc('al_existe',{p_slug:SLUG}); if(!e||!e.existe){ location.replace('/alumnos/?no='+encodeURIComponent(SLUG)); return; } if(e.slug&&e.slug!==SLUG){ SLUG=e.slug; TOK=ls.get('al_'+SLUG); if(TOK) return cargar(); } puerta(e.proyecto); return; }
  const d=await rpc('al_get',{p_slug:SLUG,p_k:TOK});
  if(!d||d.error){ ls.del('al_'+SLUG); TOK=null; return cargar(); }
  D=d; ls.set('al_ultimo',SLUG); pintar(); instalar();
}

function pintar(){
  const A=D.alumno, R=(D.reportes||[]).map(r=>({...r,c:calc(r.metricas)})), u=R[R.length-1]||null, a=R.length>1?R[R.length-2]:null;
  const M=A.modulos||{}; MONEDA=A.moneda||'ARS';
  document.title=A.proyecto+' · Método Semilla';
  const desde=u?u.hasta:sumar(hoyISO(),-7), hasta=hoyISO();
  const yaCargado=u&&u.hasta>=hoyISO();
  let h=`<p class="kick">${ico}Método Semilla</p><button class="btn-inst" id="btnInst" type="button"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Instalar la app en tu celular</button><div id="cab"><h1>${esc(A.proyecto)}${lapiz('id="edPerfil"','Editar nombre del proyecto')}</h1>
    ${A.email?'':`<div class="hoja" style="margin:0 0 18px;border-left:4px solid var(--rosa)"><b style="color:var(--navy)">Sumá tu correo</b><p class="sub" style="margin:4px 0 10px">Lo usamos para mandarte novedades del programa.</p><div class="agregar"><input id="av_mail" type="email" inputmode="email" placeholder="nombre@correo.com"><button class="btn sec" id="av_ok">Guardar</button></div></div>`}
    <p class="quien">${esc(A.nombre)}${u?` · Último período cargado: del ${ddmm(u.desde)} al ${ddmm(u.hasta)}`:''}</p></div>`;

  // --- cargar numeros ---
  h+=`<h2>Cargá tus números</h2><p class="sub">Una vez cada 7 días, con lo que ves en Instagram y en tus campañas. Lo que no tengas, dejalo vacío.</p>
  <div class="hoja" id="form">
    <div class="fechas"><div><label for="f_desde">Desde</label><input type="date" id="f_desde" value="${yaCargado?u.desde:desde}"></div>
      <div><label for="f_hasta">Hasta</label><input type="date" id="f_hasta" value="${yaCargado?u.hasta:hasta}"></div></div>
    <h3>Seguidores</h3>
    <div class="grilla cuatro">
      ${campo('ig_total','Seguidores totales')}${campo('ig_nuevos','Seguidores nuevos')}${campo('ig_visitas','Visitas al perfil')}${campo('ig_inversion','Invertido en seguidores')}
    </div>
    <div class="bloque" id="b_msj" ${M.mensajes?'':'hidden'}><h3>Campaña de mensajes</h3>
      <div class="grilla cuatro">${campo('msj_mensajes','Mensajes recibidos')}${campo('msj_inversion','Invertido')}${campo('msj_ventas','Ventas cerradas')}${campo('msj_facturacion','Facturación')}</div></div>
    <div class="bloque" id="b_vta" ${M.ventas?'':'hidden'}><h3>Ventas online</h3>
      <div class="grilla cuatro">${campo('vta_ventas','Ventas')}${campo('vta_facturacion','Facturación')}${campo('vta_inversion','Invertido')}</div></div>
    <div class="bloque" id="b_sp" ${M.spotify?'':'hidden'}><h3>Spotify</h3>
      <p class="sub" style="margin:-6px 0 12px">De Spotify for Artists, con el mismo rango de fechas de arriba.</p>
      <div class="grilla cuatro">${campo('sp_listeners','Oyentes')}${campo('sp_monthly','Oyentes mensuales')}${campo('sp_streams','Streams')}${campo('sp_guardados','Guardados')}${campo('sp_playlists','Agregados a playlists')}${campo('sp_followers','Seguidores')}${campo('sp_inversion','Invertido en pauta a Spotify')}</div></div>
    <div class="bloque" id="b_yt" ${M.youtube?'':'hidden'}><h3>YouTube</h3>
      <p class="sub" style="margin:-6px 0 12px">De YouTube Studio → Estadísticas, con el mismo rango de fechas de arriba.</p>
      <div class="grilla cuatro">${campo('yt_views','Visualizaciones')}${campo('yt_horas','Horas de visualización')}${campo('yt_unicos','Usuarios únicos')}${campo('yt_subs','Suscriptores totales')}${campo('yt_subs_nuevos','Suscriptores nuevos')}</div></div>
    <div class="toggles">
      <button class="tg${M.mensajes?' on':''}" data-mod="mensajes" aria-pressed="${!!M.mensajes}">${M.mensajes?'✓ ':'+ '}Tengo campaña de mensajes</button>

    if(M.spotify||c.sp_streams!=null) h+=`<div class="modulo"><h3>Spotify</h3><div class="tarj">${card('Oyentes mensuales',nf(c.sp_monthly),c.sp_monthly,p.sp_monthly,{dest:true})}${card('Oyentes',nf(c.sp_listeners),c.sp_listeners,p.sp_listeners)}${card('Streams',nf(c.sp_streams),c.sp_streams,p.sp_streams)}${card('Streams por oyente',nf(c.sp_sl,1),c.sp_sl,p.sp_sl)}${card('Guardados',nf(c.sp_guardados),c.sp_guardados,p.sp_guardados)}${card('Agregados a playlists',nf(c.sp_playlists),c.sp_playlists,p.sp_playlists)}${card('Seguidores',nf(c.sp_followers),c.sp_followers,p.sp_followers)}${c.sp_costo!=null?card('Costo por stream',din(c.sp_costo,2),c.sp_costo,p.sp_costo,{menosEsMejor:true}):''}</div></div>`;
    if(M.youtube||c.yt_views!=null) h+=`<div class="modulo"><h3>YouTube</h3><div class="tarj">${card('Visualizaciones',nf(c.yt_views),c.yt_views,p.yt_views,{dest:true})}${card('Horas de visualización',nf(c.yt_horas,1),c.yt_horas,p.yt_horas)}${card('Usuarios únicos',nf(c.yt_unicos),c.yt_unicos,p.yt_unicos)}${card('Suscriptores',nf(c.yt_subs),c.yt_subs,p.yt_subs)}${card('Suscriptores nuevos',nf(c.yt_subs_nuevos),c.yt_subs_nuevos,p.yt_subs_nuevos)}</div></div>`;
    const S=k=>R.map(r=>({f:r.hasta,v:r.c[k]??null}));
    h+=linea('Seguidores','Cómo viene creciendo tu cuenta.',S('ig_total'),'#1A2456');
    h+=linea('Costo por seguidor','Mientras más baja la línea, mejor.',S('ig_costo'),'#87863A',v=>'$'+nf(v));
    if(M.mensajes) h+=linea('Mensajes','Cuánta gente te escribió en cada período.',S('msj_mensajes'),'#7A1F3A');
    if(M.spotify){ h+=linea('Oyentes mensuales','Cómo viene tu Spotify.',S('sp_monthly'),'#87863A'); h+=linea('Streams','Cuántas veces se escucharon tus temas en cada período.',S('sp_streams'),'#1A2456'); }

  }

  // --- hitos ---
  h+=`<h2>Tus metas</h2><p class="sub">Ponete un número a alcanzar y seguilo acá.</p>`;
  const HI=D.hitos||[];
  h+= HI.length?HI.map(x=>{ const act=u?u.c[x.metrica]:null; const pct=act!=null?Math.min(100,act/x.objetivo*100):0;
      return `<div class="hoja hito" style="margin-top:10px"><div style="display:flex;justify-content:space-between;gap:10px"><b style="color:var(--navy)">${esc(x.titulo||METRICAS[x.metrica]+': '+nf(x.objetivo))}</b><span>${lapiz(`data-edhito="${x.id}"`,'Editar meta')}<button class="x" data-delhito="${x.id}" aria-label="Borrar meta">×</button></span></div>

  h+=`<div class="hitoform"><select id="h_met" aria-label="Qué querés medir">${Object.entries(METRICAS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><input id="h_obj" inputmode="numeric" placeholder="Número a alcanzar" aria-label="Número a alcanzar"><button class="btn sec" id="h_add">Agregar meta</button></div>`;

  h+=`<div class="agregar"><input id="t_txt" placeholder="Agregar una tarea"><button class="btn sec" id="t_add">Agregar</button></div>`;

  // --- notas ---

  // --- recomendaciones personales (IA, cada domingo) ---
  const RC=(D.recomendaciones&&D.recomendaciones.recomendaciones)||[];
  if(RC.length){
    h+=`<h2>Recomendaciones para vos</h2><p class="sub">Salen de tus números, tus metas y tus tareas. Se renuevan cada domingo${D.recomendaciones.fecha?` · Últimas: ${new Date(D.recomendaciones.fecha).toLocaleDateString('es-AR',{day:'numeric',month:'long'})}`:''}.</p><p class="ia">${ico}Procesado con IA, entrenada en el Método Semilla</p>`;
    h+=RC.map(c=>`<div class="consejo" style="border-left-color:var(--oliva)"><b>${esc(c.titulo)}</b><span>${esc(c.texto)}</span></div>`).join('');
  }

  // --- consejos de la comunidad ---
  if((D.consejos||[]).length){
    h+=`<h2>Consejos de la comunidad</h2><p class="sub">Salen de lo que aprendimos con los proyectos que acompañamos en Semilla Redes.</p><p class="ia">${ico}Procesado con IA, entrenada en el Método Semilla</p>`;
    h+=D.consejos.map(c=>`<div class="consejo"><b>${esc(c.titulo)}</b><span>${esc(c.texto)}</span></div>`).join('');
  }

  // --- historial ---
  if(R.length){
    h+=`<h2>Historial</h2><p class="sub">Todos tus períodos. Con el lápiz lo corregís; la × lo borra.</p><div class="tabla"><table>
      <tr><th>Período</th><th>Seguidores</th><th>Nuevos</th><th>Costo x seg.</th>${M.mensajes?'<th>Mensajes</th>':''}${M.mensajes||M.ventas?'<th>Facturación</th>':''}<th></th></tr>
      ${[...R].reverse().map(r=>`<tr><td>${ddmm(r.desde)} al ${ddmm(r.hasta)}</td><td>${nf(r.c.ig_total)}</td><td>${nf(r.c.ig_nuevos)}</td><td>${din(r.c.ig_costo,2)}</td>${M.mensajes?`<td>${nf(r.c.msj_mensajes)}</td>`:''}${M.mensajes||M.ventas?`<td>${din(r.c.facturacion)}</td>`:''}<td>${lapiz(`data-edrep="${r.id}"`,'Editar período')}<button class="x" data-delrep="${r.id}" aria-label="Borrar período">×</button></td></tr>`).join('')}
    </table></div>`;
  }
  h+=`<p style="text-align:center;margin-top:40px"><button class="btn sec" id="salir">Salir de este panel</button></p><footer>${ico}SEMILLA REDES</footer>`;
  $('app').innerHTML=h;

  // precargar el formulario si el periodo ya existe
  if(yaCargado) for(const [k,v] of Object.entries(u.metricas||{})){ const el=$('m_'+k); if(el&&v!=null) el.value=String(v).replace('.',','); }
  eventos(M);
  editores();
}
function campo(k,l){ return `<div><label for="m_${k}">${l}</label><input id="m_${k}" inputmode="decimal"></div>`; }

function eventos(M){
  document.querySelectorAll('[data-mod]').forEach(b=>b.onclick=async()=>{
    const k=b.dataset.mod; M[k]=!M[k]; await rpc('al_modulos',{p_slug:SLUG,p_k:TOK,p_m:M});
    b.classList.toggle('on',!!M[k]); b.setAttribute('aria-pressed',!!M[k]); b.textContent=(M[k]?'✓ ':'+ ')+({mensajes:'Tengo campaña de mensajes',ventas:'Vendo online',spotify:'Tengo Spotify',youtube:'Tengo YouTube'}[k]);

    const r=await rpc('al_reporte_guardar',{p_slug:SLUG,p_k:TOK,p_desde:$('f_desde').value,p_hasta:$('f_hasta').value,p_m:m});
    if(r&&r.ok){ if(EDIT_ID&&EDIT_DESDE&&EDIT_DESDE!==$('f_desde').value) await rpc('al_reporte_borrar',{p_slug:SLUG,p_k:TOK,p_id:EDIT_ID}); EDIT_ID=null; EDIT_DESDE=null; await recargar(); $('msgOk')&&($('msgOk').textContent='Guardado.'); } else { b.disabled=false; b.textContent='Guardar mis números'; $('msgOk').textContent=r&&r.error==='fechas'?'Revisá las fechas.':'No se pudo guardar. Probá de nuevo.'; }

  document.querySelectorAll('[data-delhito]').forEach(b=>b.onclick=async()=>{ if(!confirm('¿Borrar esta meta?'))return; await rpc('al_hito',{p_slug:SLUG,p_k:TOK,p_borrar:b.dataset.delhito}); recargar(); });
  $('t_add').onclick=async()=>{ const t=$('t_txt').value.trim(); if(!t) return; await rpc('al_tarea',{p_slug:SLUG,p_k:TOK,p_titulo:t}); recargar(); };
  $('t_txt').onkeydown=e=>{ if(e.key==='Enter') $('t_add').click(); };
  document.querySelectorAll('[data-tarea]').forEach(b=>b.onclick=async()=>{ const sig={pendiente:'en_curso',en_curso:'hecha',hecha:'pendiente'}[b.dataset.est]||'en_curso'; await rpc('al_tarea',{p_slug:SLUG,p_k:TOK,p_id:b.dataset.tarea,p_estado:sig}); recargar(); });
  document.querySelectorAll('[data-deltarea]').forEach(b=>b.onclick=async()=>{ if(!confirm('¿Borrar esta tarea?'))return; await rpc('al_tarea',{p_slug:SLUG,p_k:TOK,p_id:b.dataset.deltarea,p_borrar:true}); recargar(); });
  $('n_add').onclick=async()=>{ const t=$('n_txt').value.trim(); if(!t) return; await rpc('al_nota',{p_slug:SLUG,p_k:TOK,p_texto:t}); recargar(); };
  document.querySelectorAll('[data-delnota]').forEach(b=>b.onclick=async()=>{ if(!confirm('¿Borrar esta nota?'))return; await rpc('al_nota',{p_slug:SLUG,p_k:TOK,p_texto:null,p_borrar:b.dataset.delnota}); recargar(); });
  document.querySelectorAll('[data-delrep]').forEach(b=>b.onclick=async()=>{ if(!confirm('¿Borrar este período?'))return; await rpc('al_reporte_borrar',{p_slug:SLUG,p_k:TOK,p_id:b.dataset.delrep}); recargar(); });

function cambiarSlug(nuevo){
  if(!nuevo||nuevo===SLUG) return;
  ls.set('al_'+nuevo,TOK); ls.del('al_'+SLUG); ls.set('al_ultimo',nuevo); SLUG=nuevo;
  try{ history.replaceState(null,'','/alumno.html?p='+nuevo); }catch(e){}
}

      if(r&&r.ok){ cambiarSlug(r.slug); recargar(); } else if(r&&r.error==='email') alert('Revisá el correo.'); else if(r&&r.error==='nombre_corto') alert('Usá un nombre de proyecto un poco más largo.'); };

    const r=(D.reportes||[]).find(z=>z.id===b.dataset.edrep); if(!r) return;

    if(Object.keys(m).some(k=>k.startsWith('yt_'))&&!M.youtube) $('b_yt').hidden=false;

    $('form').classList.add('editando'); $('form').scrollIntoView({behavior:'smooth',block:'start'});
  });

// ---------- popup para instalar la app ----------
let evInst=null;
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); evInst=e; });
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
function instalar(){
  const ua=navigator.userAgent, ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1), android=/android/i.test(ua);
  const inst=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(inst||(!ios&&!android)) return;                       // ya instalada o en computadora: nada
  const inAppAndroid=android&&/Instagram|FBAN|FBAV|FB_IAB|Line\/|; wv\)/i.test(ua);
  const inAppIOS=ios&&/Instagram|FBAN|FBAV|FB_IAB|Line\//i.test(ua);
  const cerrar=()=>{ try{sessionStorage.setItem('al_pop_no','1')}catch(e){} $('velo').classList.remove('on'); };
  function abrir(){
    const pasos=$('popPasos'), si=$('popSi');
    if(inAppAndroid){
      $('popTxt').textContent='Para instalarla, primero abrí tu panel en Chrome.';
      pasos.innerHTML=''; si.textContent='Abrir en Chrome';
      si.onclick=()=>{ location.href='intent://'+location.host+'/alumno.html?p='+SLUG+'#Intent;scheme=https;package=com.android.chrome;end'; };
    } else if(ios){
      $('popTxt').textContent='Con la app instalada cargás tus números en un toque, sin buscar el link.';
      pasos.innerHTML=(inAppIOS?`<ol><li>Tocá los tres puntitos o el ícono de la brújula y elegí <b>Abrir en Safari</b>.</li><li>Seguí estos mismos pasos desde Safari.</li></ol>`:'')+
        `<ol${inAppIOS?' style="display:none"':''}><li>Tocá <b>Compartir</b> <svg class="ico-comp" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 12v8h14v-8" fill="none" stroke="#1A2456" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> en la barra de Safari.</li><li>Bajá y tocá <b>Agregar a inicio</b>.</li><li>Tocá <b>Agregar</b>. Queda el ícono de Semilla en tu pantalla.</li></ol>
        <p style="font-size:13px;color:#6B6878;margin:-6px 0 16px">¿No ves "Agregar a inicio"? Lo abriste desde WhatsApp: tocá el ícono de Safari abajo a la derecha y repetí los pasos.</p>`;
      si.textContent='Listo, entendido'; si.onclick=cerrar;
    } else {
      $('popTxt').textContent='Con la app instalada cargás tus números en un toque, sin buscar el link.';
      pasos.innerHTML=''; si.textContent='Instalar';
      si.onclick=async()=>{
        if(evInst){ evInst.prompt(); const r=await evInst.userChoice; if(r.outcome==='accepted'){ $('velo').classList.remove('on'); $('btnInst')&&$('btnInst').classList.remove('on'); } return; }
        pasos.innerHTML='<ol><li>Tocá los tres puntitos de arriba a la derecha.</li><li>Elegí <b>Instalar app</b> o <b>Agregar a la pantalla principal</b>.</li></ol>';
        si.textContent='Listo, entendido'; si.onclick=cerrar;
      };
    }
    $('velo').classList.add('on');
  }
  const b=$('btnInst'); if(b){ b.classList.add('on'); b.onclick=abrir; }
  $('popNo').onclick=cerrar;
  addEventListener('appinstalled',()=>{ $('velo').classList.remove('on'); b&&b.classList.remove('on'); });
  let visto=false; try{ visto=sessionStorage.getItem('al_pop_no')==='1'; }catch(e){}
  if(!visto) setTimeout(abrir,1500);                        // sale en cada visita hasta que la instalen
}

cargar();
</script>
<script>
// tirar para abajo para actualizar (como en las redes), en la app y en el celular
(function(){
  if(!('ontouchstart' in window)) return;
  var st=document.createElement('style');
  st.textContent='#ptr{position:fixed;left:0;right:0;top:0;height:0;z-index:9999;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;overflow:hidden;font:600 13px system-ui,-apple-system,sans-serif;color:#6F6B7C}'+
    '#ptr .sp{position:relative;width:28px;height:28px;margin-bottom:6px}'+
    '#ptr .sp i{position:absolute;left:12.5px;top:1px;width:3px;height:8px;border-radius:2px;background:#6F6B7C;transform-origin:1.5px 13px;opacity:0;transition:opacity .08s}'+
    '#ptr .tx{margin-bottom:10px;white-space:nowrap}'+
    '#ptr.gira .sp{animation:ptrg .9s steps(12) infinite}@keyframes ptrg{to{transform:rotate(360deg)}}'+
    'body.ptr-mov{transition:none}body.ptr-vuelve{transition:transform .25s ease}';
  document.head.appendChild(st);
  var ind=document.createElement('div'); ind.id='ptr'; var sp='<div class="sp">';
  for(var i=0;i<12;i++) sp+='<i style="transform:rotate('+(i*30)+'deg)"></i>';
  ind.innerHTML=sp+'</div><div class="tx">Tirá para actualizar</div>'; document.documentElement.appendChild(ind);
  var palos=ind.querySelectorAll('.sp i'), tx=ind.querySelector('.tx');
  var y0=null, d=0, UMBRAL=80, MAX=110, cargando=false;
  var arriba=function(){ return (window.scrollY||document.documentElement.scrollTop||0)<=0; };
  function pintar(h){ ind.style.height=h+'px'; document.body.style.transform=h?'translateY('+h+'px)':''; var k=Math.min(1,h/UMBRAL), n=Math.round(k*12);
    palos.forEach(function(p,i){ p.style.opacity=cargando?(0.25+0.75*((12-i)%12)/12):(i<n?0.25+0.75*(i/12):0); });
    tx.textContent=cargando?'Actualizando…':(h>=UMBRAL?'Soltá para actualizar':'Tirá para actualizar'); }
  window.addEventListener('touchstart',function(e){ if(!cargando&&arriba()&&e.touches.length===1&&!e.target.closest('input,textarea,select,[contenteditable],.repFondo:not(.oculto)')){ y0=e.touches[0].clientY; d=0; document.body.classList.remove('ptr-vuelve'); } else y0=null; },{passive:true});
  window.addEventListener('touchmove',function(e){ if(y0==null) return; d=e.touches[0].clientY-y0; if(d<=0||!arriba()){ pintar(0); return; }
    pintar(Math.min(MAX, d*0.55)); },{passive:true});
  window.addEventListener('touchend',function(){ if(y0==null) return; y0=null; var h=Math.min(MAX,d*0.55); d=0; document.body.classList.add('ptr-vuelve');
    if(h>=UMBRAL){ cargando=true; ind.classList.add('gira'); pintar(64);
      setTimeout(function(){ location.reload(); },500); }
    else { pintar(0); setTimeout(function(){ document.body.classList.remove('ptr-vuelve'); },260); } });
})();
</script>
</body>

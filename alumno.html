<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#87863A">
<link rel="icon" type="image/png" href="/icono-192.png">
<title>Tu seguimiento · Método Semilla</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--crema:#F2EDE4;--navy:#1A2456;--vino:#7A1F3A;--rosa:#E2767C;--oliva:#87863A;--tinta:#24242C;--mute:#8A8697;--linea:#E5DFD2}
*{box-sizing:border-box}
body{margin:0;background:var(--crema);color:var(--tinta);font-family:Inter,system-ui,sans-serif;line-height:1.55}
.wrap{max-width:880px;margin:0 auto;padding:0 20px 100px}
.cab{background:var(--oliva);margin:0 -20px 26px;padding:26px 20px 22px;color:#fff}
.cab .inner{max-width:840px;margin:0 auto;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.cab img{width:140px;filter:brightness(0) invert(1)}
.cab .eti{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;font-weight:700;border:1px solid rgba(255,255,255,.7);border-radius:99px;padding:3px 10px}
h1{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(28px,5.2vw,38px);line-height:1.1;color:var(--navy);margin:0 0 3px}
.sub1{font-size:14.5px;color:var(--mute);margin:0 0 26px}
h2{font-family:'Playfair Display',serif;font-size:23px;color:var(--navy);margin:34px 0 3px}
.sub{font-size:13.5px;color:var(--mute);margin:0 0 14px}

.tarj{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.t{background:#fff;border:1px solid var(--linea);border-radius:13px;padding:16px}
.t .lab{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--oliva);font-weight:700}
.t .val{font-family:'Playfair Display',serif;font-size:30px;color:var(--navy);line-height:1.1;margin-top:5px}
.t .delta{font-size:12.5px;margin-top:3px;color:var(--mute)}
.up{color:var(--oliva);font-weight:600}.down{color:var(--vino);font-weight:600}
.t.destacada{background:var(--navy);border-color:var(--navy)}
.t.destacada .lab{color:var(--rosa)}.t.destacada .val{color:var(--crema)}.t.destacada .delta{color:#B9B4C4}

.graf{background:#fff;border:1px solid var(--linea);border-radius:13px;padding:18px;margin-top:12px}
.graf h3{font-size:14px;color:var(--navy);margin:0 0 2px}
.graf .leyenda{font-size:12.5px;color:var(--mute);margin:0 0 10px}
svg.linea{width:100%;height:170px;display:block;overflow:visible}
.aviso{background:#F6F2E9;border:1px dashed #D8CFBB;border-radius:11px;padding:14px 16px;font-size:13.5px;color:#5B5766;margin-top:12px}

.carga{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:20px;margin-top:12px}
.carga h3{font-size:15px;color:var(--navy);margin:0 0 4px}
.carga .ay{font-size:13px;color:var(--mute);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
label{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--oliva);font-weight:700;display:block;margin-bottom:4px}
input,textarea{width:100%;border:1px solid #DDD6C7;border-radius:9px;background:#FDFCF9;padding:10px 12px;font:inherit;font-size:14.5px;color:var(--tinta)}
textarea{min-height:80px;resize:vertical}
.plat{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--vino);font-weight:700;margin:18px 0 8px}
button{border:0;background:var(--vino);color:#fff;font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:12px 20px;cursor:pointer}
button.sec{background:var(--oliva)}
button:disabled{opacity:.6}
.ok{color:var(--oliva);font-size:13.5px;font-weight:600;margin-top:10px}

table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;border:1px solid var(--linea);border-radius:13px;overflow:hidden}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--linea)}
th:first-child,td:first-child{text-align:left}
th{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--oliva);background:#FBF8F2}
.x{border:0;background:transparent;color:#C9C3B4;font-size:17px;cursor:pointer;padding:0 5px}
.x:hover{color:var(--vino)}
.nota{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:14px 16px;margin-top:10px;position:relative}
.nota .cuando{font-size:12px;color:var(--mute);margin-top:6px}
.nota .x{position:absolute;top:10px;right:12px}
.err{background:#FDF0F0;border:1px solid var(--rosa);color:var(--vino);border-radius:12px;padding:18px;margin-top:26px}
.oculto{display:none}
.pie{font-size:12.5px;color:var(--mute);margin-top:40px}
details.hist{background:#fff;border:1px solid var(--linea);border-radius:13px;overflow:hidden;margin-top:12px}
details.hist summary{list-style:none;cursor:pointer;padding:15px 18px;font-size:15px;font-weight:600;color:var(--navy)}
details.hist summary::-webkit-details-marker{display:none}
details.hist table{border:0;border-radius:0}
</style>
</head>
<body>
<div class="cab"><div class="inner">
  <img src="https://raw.githubusercontent.com/calcagnoagustin/semillaredes/main/assets/semilla-logo-horizontal.png" alt="Semilla Redes">
  <span class="eti">Alumnos</span>
</div></div>
<div class="wrap">
  <div id="cargando">Cargando…</div>
  <div id="app" class="oculto"></div>
  <div id="error" class="err oculto"></div>
</div>

<script>
const API='https://fdrxsjphlvvwwknnrjtx.supabase.co';
const KEY='sb_publishable_kT7McM9Dt7xP44IlFotsLA_8-b8q_17';
const tok=new URLSearchParams(location.search).get('a')||'';
const $=id=>document.getElementById(id);
const rpc=(fn,a)=>fetch(`${API}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(a)}).then(r=>r.json());
const fmt=(n,d=0)=>n==null||n===''?'—':Number(n).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fecha=s=>{const p=s.split('-');return `${p[2]}/${p[1]}`;};

const CAMPOS=[
  ['Instagram', [['ig_followers_total','Seguidores'],['ig_followers_nuevos','Nuevos'],['ig_visitas','Visitas al perfil'],
                 ['ig_inversion','Invertido'],['ig_costo_follower','Costo por seguidor']]],
  ['Consultas y ventas', [['msj_mensajes','Consultas'],['msj_costo_mensaje','Costo por consulta'],
                 ['msj_conversiones','Ventas'],['msj_ingreso','Ingreso'],['msj_roas','ROAS']]]
];

function delta(act,ant,inv){
  if(ant==null||act==null||!ant) return '';
  const d=act-ant; if(Math.abs(d)<0.0001) return '<span class="delta">igual que antes</span>';
  const pct=Math.round(d/ant*100), bien = inv ? d<0 : d>0;
  return `<span class="delta ${bien?'up':'down'}">${d>0?'▲':'▼'} ${Math.abs(pct)}% vs período anterior</span>`;
}
function card(lab,val,ant,inv,dest){
  return `<div class="t ${dest?'destacada':''}"><div class="lab">${lab}</div><div class="val">${val}</div>${delta(ant&&ant[0],ant&&ant[1],inv)}</div>`;
}
function linea(datos,et,color,titulo,leyenda){
  const vals=datos.filter(x=>x!=null);
  if(vals.length<2) return `<div class="graf"><h3>${titulo}</h3><p class="leyenda">${leyenda}</p><div class="aviso">Con un solo período cargado todavía no hay línea. A partir del segundo vas a ver cómo evoluciona.</div></div>`;
  const W=560,H=160,P=28;
  const min=Math.min(...vals), max=Math.max(...vals), rango=(max-min)||1;
  const x=i=>P+(i*(W-P*2)/Math.max(1,datos.length-1));
  const y=v=>H-P-((v-min)/rango)*(H-P*2);
  let d='',pts='';
  datos.forEach((v,i)=>{ if(v==null)return; d+=(d?' L ':'M ')+x(i)+' '+y(v); pts+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${color}"/><text x="${x(i)}" y="${y(v)-11}" font-size="11" font-weight="700" fill="${color}" text-anchor="middle">${v}</text>`; });
  const labs=et.map((e,i)=>`<text x="${x(i)}" y="${H-6}" font-size="10" fill="#8A8697" text-anchor="middle">${e}</text>`).join('');
  return `<div class="graf"><h3>${titulo}</h3><p class="leyenda">${leyenda}</p><svg class="linea" viewBox="0 0 ${W} ${H}"><path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${pts}${labs}</svg></div>`;
}

function pintar(d){
  const R=d.reportes||[], N=d.notas||[];
  const u=R[R.length-1]||null, a=R.length>1?R[R.length-2]:null;
  const m=u?u.metricas:{}, ma=a?a.metricas:{};
  const et=R.map(r=>fecha(r.hasta));
  const hay=k=>R.some(r=>r.metricas[k]!=null);

  let h=`<h1>${d.alumno.proyecto||d.alumno.nombre}</h1>
    <p class="sub1">${u?`Último período: ${fecha(u.desde)} al ${fecha(u.hasta)}`:'Todavía no cargaste ningún período'}</p>`;

  if(R.length){
    if(hay('ig_followers_total')){
      h+=`<h2>Instagram</h2><p class="sub">Cómo viene tu cuenta.</p><div class="tarj">
        ${card('Seguidores',fmt(m.ig_followers_total),[m.ig_followers_total,ma.ig_followers_total])}
        ${card('Nuevos',fmt(m.ig_followers_nuevos),[m.ig_followers_nuevos,ma.ig_followers_nuevos])}
        ${card('Visitas al perfil',fmt(m.ig_visitas),[m.ig_visitas,ma.ig_visitas])}
        ${hay('ig_costo_follower')?card('Costo por seguidor',fmt(m.ig_costo_follower,2),[m.ig_costo_follower,ma.ig_costo_follower],true,true):''}
      </div>`;
      h+=linea(R.map(r=>r.metricas.ig_followers_total),et,'#7A1F3A','Seguidores','Cómo viene creciendo la cuenta.');
      if(hay('ig_costo_follower'))
        h+=linea(R.map(r=>r.metricas.ig_costo_follower),et,'#1A2456','Costo por seguidor','Mientras más baja la línea, mejor.');
    }
    if(hay('msj_mensajes')){
      h+=`<h2>Consultas y ventas</h2><p class="sub">Lo que tus campañas están generando.</p><div class="tarj">
        ${card('Consultas',fmt(m.msj_mensajes),[m.msj_mensajes,ma.msj_mensajes],false,true)}
        ${hay('msj_costo_mensaje')?card('Costo por consulta',fmt(m.msj_costo_mensaje,2),[m.msj_costo_mensaje,ma.msj_costo_mensaje],true):''}
        ${hay('msj_conversiones')?card('Ventas',fmt(m.msj_conversiones),[m.msj_conversiones,ma.msj_conversiones]):''}
        ${hay('msj_ingreso')?card('Ingreso',fmt(m.msj_ingreso),[m.msj_ingreso,ma.msj_ingreso]):''}
        ${hay('msj_roas')?card('ROAS',fmt(m.msj_roas,2),[m.msj_roas,ma.msj_roas]):''}
      </div>`;
      h+=linea(R.map(r=>r.metricas.msj_mensajes),et,'#87863A','Consultas','Cuánta gente te escribió.');
    }
    if(R.length>1){
      h+=`<h2>Historial</h2><p class="sub">Todos tus períodos.</p>
        <details class="hist"><summary>▶ Ver los ${R.length} períodos</summary><table>
        <tr><th>Período</th><th>Seguidores</th><th>Nuevos</th><th>Consultas</th><th>Invertido</th><th></th></tr>
        ${R.slice().reverse().map(r=>{const x=r.metricas;return `<tr><td>${fecha(r.desde)} al ${fecha(r.hasta)}</td>
          <td>${fmt(x.ig_followers_total)}</td><td>${fmt(x.ig_followers_nuevos)}</td><td>${fmt(x.msj_mensajes)}</td>
          <td>${fmt(x.ig_inversion,2)}</td><td><button class="x" data-delr="${r.id}" title="Borrar">×</button></td></tr>`}).join('')}
        </table></details>`;
    }
  }

  // --- carga de datos ---
  h+=`<h2>Cargar un período</h2><p class="sub">Anotá tus números cada semana o cada quincena. Con dos períodos ya vas a ver tendencias.</p>
    <div class="carga">
      <div class="grid">
        <div><label>Desde</label><input type="date" id="f_desde"></div>
        <div><label>Hasta</label><input type="date" id="f_hasta"></div>
      </div>`;
  CAMPOS.forEach(([titulo,campos])=>{
    h+=`<div class="plat">${titulo}</div><div class="grid">`;
    campos.forEach(([k,l])=>{ h+=`<div><label>${l}</label><input type="text" inputmode="decimal" id="m_${k}"></div>`; });
    h+=`</div>`;
  });
  h+=`<div style="margin-top:16px"><button id="guardar">Guardar período</button></div><div id="out"></div></div>`;

  h+=`<h2>Tus notas</h2><p class="sub">Anotá lo que observás para tenerlo a mano en la próxima clase.</p>
    <div class="carga"><textarea id="nota_txt" placeholder="Escribí acá…"></textarea>
    <div style="margin-top:10px"><button class="sec" id="nota_btn">Guardar nota</button></div>
    ${N.map(n=>`<div class="nota">${n.texto}<div class="cuando">${new Date(n.fecha).toLocaleDateString('es-AR',{day:'numeric',month:'long'})}</div><button class="x" data-deln="${n.id}">×</button></div>`).join('')}
    </div>`;

  h+=`<p class="pie">Este panel es parte de tu suscripción al Método Semilla. Los números los cargás vos.</p>`;
  $('app').innerHTML=h;
  $('cargando').classList.add('oculto'); $('app').classList.remove('oculto');

  $('guardar').onclick=async()=>{
    const desde=$('f_desde').value, hasta=$('f_hasta').value;
    if(!desde||!hasta){ $('out').innerHTML='<p class="ok" style="color:#7A1F3A">Faltan las fechas</p>'; return; }
    const met={};
    CAMPOS.flatMap(c=>c[1]).forEach(([k])=>{
      let v=$('m_'+k).value.trim(); if(v==='') return;
      v=v.replace(/\s/g,'').replace(/[^\d.,-]/g,'');
      if(v.includes(',')&&v.includes('.')) v = v.lastIndexOf(',')>v.lastIndexOf('.') ? v.replace(/\./g,'').replace(',','.') : v.replace(/,/g,'');
      else if(v.includes(',')) v = /,\d{3}(?!\d)/.test(v) ? v.replace(/,/g,'') : v.replace(',','.');
      const n=parseFloat(v); if(!isNaN(n)) met[k]=n;
    });
    if(!Object.keys(met).length){ $('out').innerHTML='<p class="ok" style="color:#7A1F3A">Cargá al menos un número</p>'; return; }
    $('guardar').disabled=true; $('guardar').textContent='Guardando…';
    const r=await rpc('alu_reporte_guardar',{p_token:tok,p_desde:desde,p_hasta:hasta,p_metricas:met});
    if(r.ok) recargar(); else { $('guardar').disabled=false; $('guardar').textContent='Guardar período'; $('out').innerHTML='<p class="ok" style="color:#7A1F3A">No se pudo guardar</p>'; }
  };
  $('nota_btn').onclick=async()=>{
    const t=$('nota_txt').value.trim(); if(!t) return;
    const r=await rpc('alu_nota_alta',{p_token:tok,p_texto:t});
    if(r.ok) recargar();
  };
  document.querySelectorAll('[data-delr]').forEach(b=>b.onclick=async()=>{
    if(!confirm('¿Borrar este período?')) return;
    const r=await rpc('alu_reporte_borrar',{p_token:tok,p_id:b.dataset.delr}); if(r.ok) recargar();
  });
  document.querySelectorAll('[data-deln]').forEach(b=>b.onclick=async()=>{
    if(!confirm('¿Borrar esta nota?')) return;
    const r=await rpc('alu_nota_borrar',{p_token:tok,p_id:b.dataset.deln}); if(r.ok) recargar();
  });
}

function recargar(){ rpc('alu_get',{p_token:tok}).then(ver); }
function ver(d){
  if(d.error==='suscripcion_inactiva'){
    $('cargando').classList.add('oculto');
    $('error').classList.remove('oculto');
    $('error').innerHTML=`<b>Tu suscripción no está activa</b><br>Cuando la renueves, este panel vuelve a estar disponible con todo lo que cargaste. Escribinos si creés que es un error.`;
    return;
  }
  if(d.error){
    $('cargando').classList.add('oculto');
    $('error').classList.remove('oculto');
    $('error').innerHTML='Este link no es válido. Pedí uno nuevo desde tu curso.';
    return;
  }
  pintar(d);
}
if(!tok){ $('cargando').classList.add('oculto'); $('error').classList.remove('oculto'); $('error').textContent='Falta el link de acceso.'; }
else recargar();
</script>
</body>
</html>

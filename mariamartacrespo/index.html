<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1A2456">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Semilla IA">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icono-192.png">
<link rel="apple-touch-icon" href="/icono-180.png">
<title>María Marta Crespo · Semilla IA</title>
<style>
html,body{margin:0;height:100%;background:#F2EDE4;overflow:hidden}
iframe{border:0;width:100%;height:100%;display:block}
#instalar{position:fixed;left:14px;right:14px;bottom:14px;background:#1A2456;color:#F2EDE4;border-radius:14px;padding:15px 18px;display:none;align-items:center;gap:12px;font-family:system-ui,sans-serif;box-shadow:0 8px 28px rgba(0,0,0,.25);z-index:99}
#instalar img{width:42px;height:42px;border-radius:10px;flex:none}
#instalar .tx{flex:1;font-size:14px;line-height:1.4}
#instalar .tx b{display:block;font-size:15px;margin-bottom:2px}
#instalar button{border:0;background:#7A1F3A;color:#fff;font:inherit;font-weight:600;font-size:14px;border-radius:9px;padding:10px 15px;cursor:pointer}
#instalar .x{background:transparent;color:#8A8697;padding:6px 4px;font-size:19px}
</style>
</head>
<body>
<iframe src="https://semillaredes.com/cliente.html?c=maria-marta-crespo&k=fb535e704d39" title="María Marta Crespo"></iframe>

<div id="instalar">
  <img src="/icono-192.png" alt="">
  <span class="tx"><b>Tenelo a mano</b><span id="msj">Agregalo a tu pantalla de inicio y entrá con un toque.</span></span>
  <button id="btn">Agregar</button>
  <button class="x" id="cerrar">×</button>
</div>

<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }

const caja=document.getElementById('instalar');
const yaInstalada = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
const oculto = localStorage.getItem('sr_install_off');
const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
let evento=null;

function mostrar(){ if(!yaInstalada && !oculto) caja.style.display='flex'; }

window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); evento=e; mostrar(); });

if(esIOS && !yaInstalada && !oculto){
  document.getElementById('msj').textContent='Tocá el botón Compartir de Safari y elegí "Agregar a pantalla de inicio".';
  document.getElementById('btn').style.display='none';
  setTimeout(mostrar, 2500);
}

document.getElementById('btn').onclick=async()=>{
  if(!evento) return;
  evento.prompt();
  await evento.userChoice;
  evento=null; caja.style.display='none';
};
document.getElementById('cerrar').onclick=()=>{
  caja.style.display='none';
  localStorage.setItem('sr_install_off','1');
};
</script>
</body>
</html>

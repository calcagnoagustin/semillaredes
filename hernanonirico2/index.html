<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1A2456">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Semilla IA">
<link rel="manifest" href="/hernanonirico2/manifest.json">
<link rel="icon" type="image/png" href="/icono-192.png">
<link rel="apple-touch-icon" href="/icono-180.png">
<title>Hernán Onírico 2 · Semilla IA</title>
<style>
html,body{margin:0;height:100%;background:#F2EDE4;overflow:hidden;overscroll-behavior:none}
iframe{border:0;width:100%;height:100%;display:block}
#instalar,#avisos{position:fixed;left:14px;right:14px;bottom:14px;background:#1A2456;color:#F2EDE4;border-radius:14px;padding:15px 18px;display:none;align-items:center;gap:12px;font-family:system-ui,sans-serif;box-shadow:0 8px 28px rgba(0,0,0,.25);z-index:99}
#instalar img,#avisos img{width:42px;height:42px;border-radius:10px;flex:none}
#popInst{position:fixed;inset:0;background:rgba(20,22,40,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:120;font-family:system-ui,-apple-system,sans-serif}
#popInst .caja{background:#fff;border-radius:22px;max-width:380px;width:100%;padding:28px 24px 22px;text-align:center;position:relative;box-shadow:0 18px 50px rgba(0,0,0,.3)}
#popInst .caja img{width:64px;height:64px;border-radius:16px}
#popInst h2{font-family:Georgia,serif;color:#1A2456;font-size:23px;margin:14px 0 8px}
#popInst p{color:#55525F;font-size:15px;line-height:1.5;margin:0 0 14px}
#popInst ol{text-align:left;margin:0 0 18px;padding-left:22px;color:#24242C;font-size:15px;line-height:1.55}
#popInst ol li{margin-bottom:6px}
#popInst .si{display:block;width:100%;border:0;background:#1A2456;color:#F2EDE4;font:inherit;font-weight:700;font-size:16px;border-radius:12px;padding:14px;cursor:pointer}
#popInst .no{display:block;width:100%;border:0;background:transparent;color:#8A8697;font:inherit;font-size:14px;padding:12px 0 0;cursor:pointer}
#instalar .tx,#avisos .tx{flex:1;font-size:14px;line-height:1.4}
#instalar .tx b,#avisos .tx b{display:block;font-size:15px;margin-bottom:2px}
#instalar button,#avisos button{border:0;background:#7A1F3A;color:#fff;font:inherit;font-weight:600;font-size:14px;border-radius:9px;padding:10px 15px;cursor:pointer}
#instalar .x,#avisos .x{background:transparent;color:#8A8697;padding:6px 4px;font-size:19px}
</style>
</head>
<body>
<iframe id="marco" title="Hernán Onírico 2"></iframe>

<div id="instalar">
  <img src="/icono-192.png" alt="">
  <span class="tx"><b>Tenelo a mano</b><span id="msj">Agregalo a tu pantalla de inicio y entrá con un toque.</span></span>
  <button id="btn">Agregar</button>
  <button class="x" id="cerrar">×</button>
</div>

<div id="popInst" role="dialog" aria-label="Instalá tu panel">
  <div class="caja">
    <img src="/icono-192.png" alt="">
    <h2>Instalá tu panel en el celular</h2>
    <p id="piTxt">Así lo tenés como una app, con tu reporte siempre a mano y los avisos cuando se actualiza.</p>
    <ol id="piPasos"></ol>
    <button class="si" id="piSi">Instalar</button>
    <button class="no" id="piNo">Ahora no</button>
  </div>
</div>

<div id="avisos">
  <img src="/icono-192.png" alt="">
  <span class="tx"><b>Enterate cuando esté tu reporte</b><span id="msjAv">Te avisamos acá mismo cada vez que actualizamos tu status.</span></span>
  <button id="btnAv">Activar</button>
  <button class="x" id="cerrarAv">×</button>
</div>

<script>
const BASE='https://semillaredes.com/cliente.html?c=hernan-onirico-2&k=0d240cb66a1d';
const marco=document.getElementById('marco');
try{ localStorage.setItem('sr_cliente_slug','hernanonirico2'); }catch(e){}
function cargar(){ marco.src = BASE + '&v=' + Date.now() + (location.hash||''); }
window.addEventListener('hashchange', cargar);
cargar();

// al volver a la app, traer lo último
// al volver a la app despues de un rato (5 min o mas en segundo plano), traer lo ultimo; nunca por simple foco
let oculta=0;
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) oculta=Date.now(); else if(oculta && Date.now()-oculta>5*60*1000) cargar(); });

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').then(reg=>{
    reg.update();
    setInterval(()=>reg.update(), 60*60*1000);
    reg.addEventListener('updatefound', ()=>{
      const nuevo=reg.installing;
      if(nuevo) nuevo.addEventListener('statechange', ()=>{ if(nuevo.state==='activated') cargar(); });
    });
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('message', e=>{ if(e.data==='recargar') cargar(); });
}

const caja=document.getElementById('instalar');
const yaInstalada = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
const CLAVE_INST='sr_install_off_hernanonirico2';
let oculto=null; try{ oculto = localStorage.getItem(CLAVE_INST); }catch(e){}
const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
let evento=null;

function mostrar(){ if(!yaInstalada && !oculto) caja.style.display='flex'; }

window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); evento=e; if(pop.style.display==='flex') abrirPop(); });

// popup de la primera vez: en cualquier celular, si todavia no la instalo
const esMovil=/android|iphone|ipad|ipod|mobile/i.test(navigator.userAgent);
const enApp=/instagram|fban|fbav|whatsapp|line\/|tiktok/i.test(navigator.userAgent);
const pop=document.getElementById('popInst'), pasos=document.getElementById('piPasos'), piSi=document.getElementById('piSi');
function abrirPop(){
  if(yaInstalada || oculto || !esMovil) return;
  if(enApp){
    document.getElementById('piTxt').textContent='Para instalarlo, primero abrí este link en el navegador del celular.';
    pasos.innerHTML='<li>Tocá los tres puntitos (o el ícono de compartir) arriba a la derecha.</li><li>Elegí <b>Abrir en el navegador</b> (Safari o Chrome).</li><li>Ahí te va a aparecer este mismo cartel para instalarlo.</li>';
    piSi.textContent='Entendido';
  } else if(esIOS){
    pasos.innerHTML='<li>Tocá el botón <b>Compartir</b> de Safari (el cuadrado con la flecha hacia arriba).</li><li>Elegí <b>Agregar a pantalla de inicio</b>.</li><li>Tocá <b>Agregar</b>. Listo: queda el ícono de Semilla IA.</li>';
    piSi.textContent='Entendido';
  } else if(evento){
    pasos.innerHTML='';
    piSi.textContent='Instalar';
  } else {
    pasos.innerHTML='<li>Tocá los <b>tres puntitos</b> de Chrome, arriba a la derecha.</li><li>Elegí <b>Agregar a la pantalla principal</b> (o <b>Instalar app</b>).</li><li>Confirmá. Listo: queda el ícono de Semilla IA.</li>';
    piSi.textContent='Entendido';
  }
  pop.style.display='flex';
}
piSi.onclick=async()=>{
  if(evento && !esIOS && !enApp){ evento.prompt(); await evento.userChoice; evento=null; }
  pop.style.display='none';
};
document.getElementById('piNo').onclick=()=>{ pop.style.display='none'; try{ localStorage.setItem(CLAVE_INST,'1'); }catch(e){} };
setTimeout(abrirPop, 2000);

document.getElementById('btn').onclick=async()=>{
  if(!evento) return;
  evento.prompt();
  await evento.userChoice;
  evento=null; caja.style.display='none';
};
document.getElementById('cerrar').onclick=()=>{
  caja.style.display='none';
  try{ localStorage.setItem(CLAVE_INST,'1'); }catch(e){}
};

// --- avisos push: se guardan por cliente, asi cada aviso le llega solo a el ---
const VAPID='BMEkI5u9yPV48NpVPbC2svp3QnMUCcmUALIQceMBf7LnHZqHguiYU8hUzL6VgfZ2KhtymINg2reReO3kgPO1ynU';
const cajaAv=document.getElementById('avisos');
function b64u(t){ const p='='.repeat((4-t.length%4)%4); const r=atob((t+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...r].map(ch=>ch.charCodeAt(0))); }
async function suscribir(){
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u(VAPID)});
  await fetch('https://fdrxsjphlvvwwknnrjtx.supabase.co/rest/v1/rpc/sub_push_alta',{method:'POST',
    headers:{'apikey':'sb_publishable_kT7McM9Dt7xP44IlFotsLA_8-b8q_17','Content-Type':'application/json'},
    body:JSON.stringify({p_slug:'hernan-onirico-2',p_k:'0d240cb66a1d',p_sub:sub.toJSON(),p_ua:navigator.userAgent})});
}
const pushOK=('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window);
if(pushOK){
  if(Notification.permission==='granted') suscribir().catch(()=>{});   // vuelve a registrar el celular por si cambio
  else if(Notification.permission==='default' && !localStorage.getItem('sr_push_off') && (yaInstalada || !esIOS)){
    setTimeout(()=>{ if(caja.style.display!=='flex' && pop.style.display!=='flex') cajaAv.style.display='flex'; }, 3000);
  }
}
document.getElementById('btnAv').onclick=async()=>{
  try{
    const p=await Notification.requestPermission();
    if(p==='granted'){ await suscribir(); document.getElementById('msjAv').textContent='Listo. Te vamos a avisar cuando esté tu reporte.'; document.getElementById('btnAv').style.display='none'; setTimeout(()=>cajaAv.style.display='none',2500); }
    else cajaAv.style.display='none';
  }catch(e){ cajaAv.style.display='none'; }
};
document.getElementById('cerrarAv').onclick=()=>{ cajaAv.style.display='none'; localStorage.setItem('sr_push_off','1'); };
</script>
</body>
</html>

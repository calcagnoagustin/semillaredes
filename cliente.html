<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, max-snippet:0, max-image-preview:none">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot-news" content="noindex">
<meta name="bingbot" content="noindex, nofollow, noarchive">
<meta name="AdsBot-Google" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/calcagnoagustin/semillaredes/main/assets/semillita-oliva.png">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/calcagnoagustin/semillaredes/main/assets/semillita-oliva.png">
<title>Tu proyecto · Semilla Redes</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--crema:#F2EDE4;--navy:#1A2456;--vino:#7A1F3A;--rosa:#E2767C;--oliva:#87863A;--tinta:#24242C;--mute:#8A8697;--linea:#E5DFD2}
*{box-sizing:border-box}
body{margin:0;background:var(--crema);color:var(--tinta);font-family:Inter,system-ui,sans-serif;line-height:1.55}
.wrap{max-width:880px;margin:0 auto;padding:30px 20px 100px}
.logo{width:150px;display:block;margin-bottom:20px}
h1{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(30px,5.4vw,42px);line-height:1.08;color:var(--navy);margin:0 0 4px}
.periodo{font-size:14px;color:var(--mute);margin:0 0 26px}
h2{font-family:'Playfair Display',serif;font-size:23px;color:var(--navy);margin:36px 0 3px}
.sub{font-size:13.5px;color:var(--mute);margin:0 0 14px}

.tarj{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}
.t{background:#fff;border:1px solid var(--linea);border-radius:13px;padding:16px}
.t .lab{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--oliva);font-weight:700}
.t .val{font-family:'Playfair Display',serif;font-size:31px;color:var(--navy);line-height:1.1;margin-top:5px}
.t .delta{font-size:12.5px;margin-top:3px;color:var(--mute)}
.up{color:var(--oliva);font-weight:600}.down{color:var(--vino);font-weight:600}
.t.destacada{background:var(--navy);border-color:var(--navy)}
.t.destacada .lab{color:var(--rosa)}
.t.destacada .val{color:var(--crema)}
.t.destacada .delta{color:#B9B4C4}

.graf{background:#fff;border:1px solid var(--linea);border-radius:13px;padding:18px;margin-top:12px}
.graf h3{font-size:14px;color:var(--navy);margin:0 0 2px}
.graf .leyenda{font-size:12.5px;color:var(--mute);margin:0 0 10px}
svg.linea{width:100%;height:170px;display:block;overflow:visible}
.aviso{background:#F6F2E9;border:1px dashed #D8CFBB;border-radius:11px;padding:14px 16px;font-size:13.5px;color:#5B5766;margin-top:12px}

.tar{background:#fff;border:1px solid var(--linea);border-radius:13px;overflow:hidden}
.tar .it{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--linea)}
.tar .it:last-child{border-bottom:0}
.mark{flex:none;width:19px;height:19px;border-radius:50%;border:2px solid #DDD6C7;margin-top:2px;position:relative}
.mark.hecha{background:var(--oliva);border-color:var(--oliva)}
.mark.hecha:after{content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.mark.en_curso{border-color:var(--rosa);background:repeating-linear-gradient(45deg,var(--rosa),var(--rosa) 3px,#fff 3px,#fff 6px)}
.it .tx{flex:1}
.it .tt{font-size:15.5px;font-weight:600;color:var(--navy)}
.it.hecha .tt{color:var(--mute);text-decoration:line-through}
.it .de{font-size:13px;color:var(--mute)}

.act{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.a{background:#fff;border:1px solid var(--linea);border-radius:13px;padding:16px;display:block;text-decoration:none;color:inherit}
.a:hover{border-color:var(--oliva)}
.a .tt{font-size:15.5px;font-weight:600;color:var(--navy)}
.a .de{font-size:13px;color:var(--mute);margin-top:2px}
.a .go{font-size:12.5px;color:var(--vino);font-weight:600;margin-top:8px}
.a.sinlink .go{color:var(--mute);font-weight:400}
.a{position:relative}
.a .x{position:absolute;top:9px;right:10px;border:0;background:transparent;color:#C9C3B4;font-size:17px;cursor:pointer;line-height:1;padding:2px 5px}
.a .x:hover{color:var(--vino)}
.nuevoAct{background:#fff;border:1px dashed #D8CFBB;border-radius:13px;padding:16px;margin-top:12px}
.nuevoAct input{width:100%;border:1px solid #DDD6C7;border-radius:9px;background:#FDFCF9;padding:10px 12px;font:inherit;font-size:14.5px;margin-bottom:8px}
.nuevoAct button{border:0;background:var(--oliva);color:#fff;font:inherit;font-weight:600;border-radius:9px;padding:10px 18px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;border:1px solid var(--linea);border-radius:13px;overflow:hidden}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--linea)}
th:first-child,td:first-child{text-align:left}
th{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--oliva);background:#FBF8F2}
.err{background:#FDF0F0;border:1px solid var(--rosa);color:var(--vino);border-radius:12px;padding:16px;margin-top:26px}
.oculto{display:none}
.reco{background:var(--navy);border-radius:15px;padding:24px 26px;margin-top:12px}
.reco .cab{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.reco h3{font-family:'Playfair Display',serif;font-size:22px;color:var(--crema);margin:0}
.reco .cuando{font-size:12px;color:#B9B4C4}
.reco .items{margin-top:16px}
.reco .it2{display:flex;gap:14px;padding:15px 0;border-top:1px solid #2E3970}
.reco .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--rosa);color:var(--navy);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.reco .tt{font-size:16px;font-weight:600;color:var(--crema);margin-bottom:3px}
.reco .tx{font-size:14.5px;color:#DDD8CC;line-height:1.6}
.reco .pie2{font-size:12.5px;color:#8A8697;margin-top:16px}
.camp{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:18px 20px;margin-bottom:12px}
.camp h3{font-family:'Playfair Display',serif;font-size:20px;color:var(--navy);margin:0 0 2px}
.camp .que{font-size:13px;color:var(--mute);margin:0 0 12px}
.camp .nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.camp .n{border-left:2px solid var(--linea);padding-left:11px}
.camp .n .l{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--oliva);font-weight:700}
.camp .n .v{font-family:'Playfair Display',serif;font-size:26px;color:var(--navy);line-height:1.15}
.camp .n .d{font-size:12px;color:var(--mute)}
.camp.destacada{background:var(--navy);border-color:var(--navy)}
.camp.destacada h3,.camp.destacada .n .v{color:var(--crema)}
.camp.destacada .que,.camp.destacada .n .d{color:#B9B4C4}
.camp.destacada .n{border-left-color:#2E3970}
.zona{display:flex;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--linea);font-size:13.5px;color:#6E6A78}
.zona b{color:var(--navy);font-weight:700}
.camp.destacada .zona{border-top-color:#2E3970;color:#B9B4C4}
.camp.destacada .zona b{color:var(--crema)}
details.hist{background:#fff;border:1px solid var(--linea);border-radius:13px;overflow:hidden}
details.hist summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--navy)}
details.hist summary::-webkit-details-marker{display:none}
details.hist summary .flecha{transition:transform .2s;color:var(--oliva);font-size:13px}
details.hist[open] summary .flecha{transform:rotate(90deg)}
details.hist table{border:0;border-radius:0}
.hito{background:#fff;border:1px solid var(--linea);border-radius:13px;padding:16px 18px;margin-bottom:10px}
.hito .tt{font-size:15.5px;font-weight:600;color:var(--navy)}
.hito .num{font-size:13px;color:var(--mute);margin-top:2px}
.hito .barra{height:9px;background:#E2DCCF;border-radius:99px;overflow:hidden;margin-top:9px}
.hito .barra i{display:block;height:100%;border-radius:99px;background:var(--oliva)}
.hito.logrado .barra i{background:var(--vino)}
.hito .falta{font-size:12.5px;color:var(--oliva);font-weight:600;margin-top:6px}
.hito.logrado .falta{color:var(--vino)}
.it .x,.nota .x{flex:none;border:0;background:transparent;color:#C9C3B4;font-size:17px;cursor:pointer;padding:0 4px;line-height:1}
.it .x:hover,.nota .x:hover{color:var(--vino)}
.nota{position:relative}
.nota .x{position:absolute;top:10px;right:12px}
.agregarT{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.agregarT input{border:1px solid #DDD6C7;border-radius:10px;background:#fff;padding:11px 13px;font:inherit;font-size:15px}
.agregarT button{border:0;background:var(--oliva);color:#fff;font:inherit;font-weight:600;border-radius:10px;padding:11px 18px;cursor:pointer}
.tar .it{cursor:pointer;transition:background .15s}
.tar .it:hover{background:#FBF8F2}
.mark{transition:all .15s}
.pista{font-size:12.5px;color:var(--mute);margin:8px 0 0}
.notas textarea{width:100%;min-height:96px;border:1px solid #DDD6C7;border-radius:11px;background:#fff;padding:12px 13px;font:inherit;font-size:15px;color:var(--tinta);resize:vertical}
.notas textarea:focus{outline:2px solid var(--oliva);border-color:transparent}
.notas button{border:0;background:var(--vino);color:#fff;font:inherit;font-weight:600;border-radius:10px;padding:11px 20px;cursor:pointer;margin-top:9px}
.nota{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:14px 16px;margin-top:10px}
.nota .quien{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--oliva);font-weight:700}
.nota .quien.semilla{color:var(--vino)}
.nota .txt{font-size:14.5px;margin-top:5px;white-space:pre-wrap}
.nota .cuando{font-size:12px;color:var(--mute);margin-top:6px}
.pie{font-size:12.5px;color:var(--mute);margin-top:40px}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="https://raw.githubusercontent.com/calcagnoagustin/semillaredes/main/assets/semilla-logo-horizontal.png" alt="Semilla Redes">
  <div id="cargando">Cargando…</div>
  <div id="app" class="oculto"></div>
  <div id="error" class="err oculto">Este link no es válido. Pedile uno nuevo a Agus.</div>
</div>

<script>
const API='https://fdrxsjphlvvwwknnrjtx.supabase.co';
const KEY='sb_publishable_kT7McM9Dt7xP44IlFotsLA_8-b8q_17';
const qs=new URLSearchParams(location.search);
const slug=qs.get('c')||'', tok=qs.get('k')||'';
const $=id=>document.getElementById(id);
const rpc=(fn,a)=>fetch(`${API}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(a)}).then(r=>r.json());

let MON='USD';
const mon=(n,d=2)=>n==null?'—':(MON==='ARS'?'$ '+Number(n).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:0}):'USD '+Number(n).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d}));
const fmt=(n,d=0)=>n==null?'—':Number(n).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fecha=s=>{const [a,m,d]=s.split('-');return `${d}/${m}`;};

function delta(act,ant,invertido){
  if(ant==null||act==null) return '';
  const d=act-ant; if(!ant||Math.abs(d)<0.0001) return '<span class="delta">igual que el período anterior</span>';
  const pct=Math.round(d/ant*100);
  const bien = invertido ? d<0 : d>0;
  const flecha = d>0?'▲':'▼';
  return `<span class="delta ${bien?'up':'down'}">${flecha} ${Math.abs(pct)}% vs período anterior</span>`;
}

function linea(datos, etiquetas, color, invertido){
  if(datos.filter(x=>x!=null).length<2) return null;
  const W=560,H=150,P=26;
  const vals=datos.filter(x=>x!=null);
  const min=Math.min(...vals), max=Math.max(...vals);
  const rango=(max-min)||1;
  const x=i=>P+(i*(W-P*2)/Math.max(1,datos.length-1));
  const y=v=>H-P-((v-min)/rango)*(H-P*2);
  let d='',pts='';
  datos.forEach((v,i)=>{ if(v==null)return; d+=(d?' L ':'M ')+x(i)+' '+y(v); pts+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${color}"/>`; });
  const labs=etiquetas.map((e,i)=>`<text x="${x(i)}" y="${H-6}" font-size="10" fill="#8A8697" text-anchor="middle">${e}</text>`).join('');
  const valsTxt=datos.map((v,i)=>v==null?'':`<text x="${x(i)}" y="${y(v)-11}" font-size="11" font-weight="700" fill="${color}" text-anchor="middle">${v}</text>`).join('');
  return `<svg class="linea" viewBox="0 0 ${W} ${H}"><path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${pts}${valsTxt}${labs}</svg>`;
}

function multi(R){
  const series=[
    {k:'ig_followers_total',lab:'Instagram',color:'#7A1F3A'},
    {k:'sp_monthly',lab:'Spotify',color:'#87863A'},
    {k:'yt_views',lab:'YouTube',color:'#E2767C'}
  ].map(x=>{
    const vals=R.map(r=>r.metricas[x.k]??null);
    const base=vals.find(v=>v!=null);
    return {...x, vals, base, idx: base?vals.map(v=>v==null?null:Math.round(v/base*100)):[]};
  }).filter(x=>x.base && x.idx.filter(v=>v!=null).length>1);

  if(!series.length) return `<div class="graf"><h3>Curva de crecimiento</h3><p class="leyenda">Instagram, Spotify y YouTube en un mismo gráfico.</p>
    <div class="aviso">Hace falta al menos dos semanas cargadas para dibujar la curva. Con una sola todavía no hay de dónde medir el crecimiento.</div></div>`;

  const W=560,H=170,P=30;
  const todos=series.flatMap(s=>s.idx).filter(v=>v!=null);
  const min=Math.min(100,...todos), max=Math.max(...todos), rango=(max-min)||1;
  const n=R.length;
  const x=i=>P+(i*(W-P*2)/Math.max(1,n-1));
  const y=v=>H-P-((v-min)/rango)*(H-P*2);
  let cuerpo=`<line x1="${P}" y1="${y(100)}" x2="${W-P}" y2="${y(100)}" stroke="#E5DFD2" stroke-width="1" stroke-dasharray="3 3"/>`;
  series.forEach(s=>{
    let d='';
    s.idx.forEach((v,i)=>{ if(v==null)return; d+=(d?' L ':'M ')+x(i)+' '+y(v); });
    cuerpo+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
    s.idx.forEach((v,i)=>{ if(v!=null) cuerpo+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${s.color}"/>`; });
    const ultimo=[...s.idx].reverse().find(v=>v!=null);
    cuerpo+=`<text x="${W-P+5}" y="${y(ultimo)+4}" font-size="11" font-weight="700" fill="${s.color}">${ultimo}</text>`;
  });
  cuerpo+=R.map((r,i)=>`<text x="${x(i)}" y="${H-8}" font-size="10" fill="#8A8697" text-anchor="middle">${fecha(r.hasta)}</text>`).join('');
  const ley=series.map(s=>`<span style="display:inline-flex;align-items:center;gap:6px;margin-right:14px"><span style="width:10px;height:10px;border-radius:50%;background:${s.color};display:inline-block"></span>${s.lab} <b style="color:${s.color}">${s.vals.filter(v=>v!=null).slice(-1)[0]}</b></span>`).join('');
  return `<div class="graf"><h3>Curva de crecimiento</h3>
    <p class="leyenda">Las tres plataformas arrancan en 100 la primera semana, así se ve cuál crece más rápido sin que los números grandes tapen a los chicos.</p>
    <div style="font-size:12.5px;margin-bottom:8px">${ley}</div>
    <svg class="linea" viewBox="0 0 ${W} ${H}">${cuerpo}</svg></div>`;
}

function grafico(titulo, leyenda, datos, etiquetas, color, invertido){
  const svg=linea(datos,etiquetas,color,invertido);
  return `<div class="graf"><h3>${titulo}</h3><p class="leyenda">${leyenda}</p>
    ${svg||`<div class="aviso">Con una sola semana cargada todavía no hay línea de tendencia. A partir del segundo reporte vas a ver cómo evoluciona.</div>`}</div>`;
}

const card=(lab,val,ant,dec,dest,inv)=>`<div class="t ${dest?'destacada':''}"><div class="lab">${lab}</div><div class="val">${val}</div>${delta(ant?.[0],ant?.[1],inv)}</div>`;

const CAMPS=[
  {p:'ej', tit:'Reservas Ejecutivo', que:'Campaña para el público ejecutivo.'},
  {p:'cal', tit:'Reservas Calificadas', que:'La campaña principal.', dest:true},
  {p:'esp', tit:'Campaña especial', que:'Acción puntual por fecha.'}
];

function multiCamp(R,et){
  const series=[{k:'ej_mensajes',lab:'Ejecutivo',color:'#7A1F3A'},{k:'cal_mensajes',lab:'Calificadas',color:'#87863A'}]
    .map(x=>({...x, vals:R.map(r=>r.metricas[x.k]??null)}))
    .filter(x=>x.vals.filter(v=>v!=null).length>1);
  if(!series.length) return '';
  const W=560,H=175,P=30;
  const todos=series.flatMap(s=>s.vals).filter(v=>v!=null);
  const min=Math.min(...todos), max=Math.max(...todos), rango=(max-min)||1;
  const x=i=>P+(i*(W-P*2)/Math.max(1,R.length-1));
  const y=v=>H-P-((v-min)/rango)*(H-P*2);
  let cuerpo='';
  series.forEach(s=>{
    let d2='';
    s.vals.forEach((v,i)=>{ if(v==null)return; d2+=(d2?' L ':'M ')+x(i)+' '+y(v); });
    cuerpo+=`<path d="${d2}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
    s.vals.forEach((v,i)=>{ if(v!=null) cuerpo+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${s.color}"/><text x="${x(i)}" y="${y(v)-10}" font-size="10.5" font-weight="700" fill="${s.color}" text-anchor="middle">${v}</text>`; });
  });
  cuerpo+=R.map((r,i)=>`<text x="${x(i)}" y="${H-8}" font-size="10" fill="#8A8697" text-anchor="middle">${et[i]}</text>`).join('');
  const ley=series.map(s=>`<span style="display:inline-flex;align-items:center;gap:6px;margin-right:16px"><span style="width:10px;height:10px;border-radius:50%;background:${s.color};display:inline-block"></span>${s.lab}</span>`).join('');
  return `<div class="graf"><h3>Mensajes por campaña</h3>
    <p class="leyenda">Cuánta gente escribió para reservar en cada campaña.</p>
    <div style="font-size:12.5px;margin-bottom:8px">${ley}</div>
    <svg class="linea" viewBox="0 0 ${W} ${H}">${cuerpo}</svg></div>`;
}

function pintarMixto(d){
  MON=(d.cliente.moneda||'USD');
  const R=d.reportes||[];
  const u=R[R.length-1]||null, a=R.length>1?R[R.length-2]:null;
  const ultimo=(k)=>{ for(let i=R.length-1;i>=0;i--){ const x=R[i].metricas[k]; if(x!=null) return x; } return null; };
  const previo=(k)=>{ let visto=false; for(let i=R.length-1;i>=0;i--){ const x=R[i].metricas[k]; if(x!=null){ if(visto) return x; visto=true; } } return null; };
  const m=new Proxy({},{get:(_,k)=>ultimo(k)}), ma=new Proxy({},{get:(_,k)=>previo(k)});
  const et=R.map(r=>fecha(r.hasta));

  let h=`<h1>${d.cliente.nombre}</h1>
    <p class="periodo">${u?`${fecha(u.desde)} al ${fecha(u.hasta)}`:'Sin reportes cargados'}</p>`;

  h+=`<h2>Instagram</h2><p class="sub">Crecimiento de la cuenta.</p><div class="tarj">
    ${card('Seguidores', fmt(m.ig_followers_total), [m.ig_followers_total, ma.ig_followers_total])}
    ${card('Nuevos en el período', fmt(m.ig_followers_nuevos), [m.ig_followers_nuevos, ma.ig_followers_nuevos])}
    ${card('Visitas al perfil', fmt(m.ig_visitas), [m.ig_visitas, ma.ig_visitas])}
    ${card('Costo por seguidor', mon(m.ig_costo_follower,2), [m.ig_costo_follower, ma.ig_costo_follower],2,true,true)}
  </div>`;

function pintarMensajes(d){
  MON=(d.cliente.moneda||'USD');
  const R=d.reportes||[];
  const u=R[R.length-1]||null, a=R.length>1?R[R.length-2]:null;
  const ultimo=(k)=>{ for(let i=R.length-1;i>=0;i--){ const x=R[i].metricas[k]; if(x!=null) return x; } return null; };
  const previo=(k)=>{ let visto=false; for(let i=R.length-1;i>=0;i--){ const x=R[i].metricas[k]; if(x!=null){ if(visto) return x; visto=true; } } return null; };
  const m=new Proxy({},{get:(_,k)=>ultimo(k)}), ma=new Proxy({},{get:(_,k)=>previo(k)});
  const et=R.map(r=>fecha(r.hasta));
  const tot=x=>(Number(x.ej_mensajes||0)+Number(x.cal_mensajes||0)+Number(x.esp_mensajes||0));

  let h=`<h1>${d.cliente.nombre}</h1>
    <p class="periodo">${u?`${fecha(u.desde)} al ${fecha(u.hasta)}`:'Sin reportes cargados'}</p>`;

  h+=`<h2>El período</h2><p class="sub">Lo que trajeron las campañas.</p><div class="tarj">
    ${card('Mensajes totales', fmt(tot(m)), [tot(m), a?tot(ma):null],0,true)}
    ${card('Invertido', mon(inv(m),2), [inv(m), a?inv(ma):null],2)}
    ${card('Costo por mensaje', mon(inv(m)/(tot(m)||1),2), [inv(m)/(tot(m)||1), a?inv(ma)/(tot(ma)||1):null],2,false,true)}
    ${card('Personas alcanzadas', fmt(Number(m.ej_alcance||0)+Number(m.cal_alcance||0)+Number(m.esp_alcance||0)), null)}
  </div>`;

  h+=multiCamp(R,et);
  h+=grafico('Costo por mensaje','Cuánto cuesta cada consulta. Mientras más baja la línea, mejor.',R.map(r=>{const x=r.metricas;return Math.round(inv(x)/(tot(x)||1)*100)/100;}),et,'#87863A',true);

  h+=`<h2>Cada campaña</h2><p class="sub">Cómo rindió cada una en este período.</p>`;
  CAMPS.forEach(c=>{
    const men=m[c.p+'_mensajes'], costo=m[c.p+'_costo_mensaje'], alc=m[c.p+'_alcance'], invc=m[c.p+'_inversion'];
    if(men==null && invc==null) return;
    const titulo = (c.p==='esp' && m.esp_nombre) ? m.esp_nombre : c.tit;
    h+=`<div class="camp ${c.dest?'destacada':''}"><h3>${titulo}</h3><p class="que">${c.que}</p>
      <div class="nums">
        <div class="n"><div class="l">Mensajes</div><div class="v">${fmt(men)}</div><div class="d">${delta(men, ma[c.p+'_mensajes'])||''}</div></div>
        <div class="n"><div class="l">Costo x mensaje</div><div class="v">${fmt(costo,2)}</div><div class="d">USD</div></div>
        <div class="n"><div class="l">Alcance</div><div class="v">${fmt(alc)}</div><div class="d">personas</div></div>
        <div class="n"><div class="l">Invertido</div><div class="v">${fmt(invc,0)}</div><div class="d">USD · ${fmt(m[c.p+'_inv_diaria'])} por día</div></div>
      </div>
      <div class="zona"><span>PBA <b>${fmt(m[c.p+'_pba'])}</b></span><span>·</span><span>CABA <b>${fmt(m[c.p+'_caba'])}</b></span></div>
    </div>`;
  });

  if(R.length>1){
    h+=`<h2>Historial</h2><p class="sub">Todos los reportes.</p>
      <details class="hist"><summary><span class="flecha">▶</span> Ver los ${R.length} reportes</summary><table>
      <tr><th>Período</th><th>Ejecutivo</th><th>Calificadas</th><th>Total</th><th>Costo x mje.</th><th>Inversión</th></tr>
      ${R.slice().reverse().map(r=>{const x=r.metricas;return `<tr><td>${fecha(r.desde)} al ${fecha(r.hasta)}</td>
        <td>${fmt(x.ej_mensajes)}</td><td>${fmt(x.cal_mensajes)}</td>
        <td><b>${fmt(tot(x))}</b></td><td>${fmt(inv(x)/(tot(x)||1),2)}</td><td>${fmt(inv(x),2)}</td></tr>`}).join('')}
      </table></details>`;
  }
  return h;
}

function pintarResto(d,h){
  const R=d.reportes||[]; const u=R[R.length-1]||null; const m=u?u.metricas:{};
  const HI=d.hitos||[];
  if(HI.length){
    h+=`<h2>Hitos</h2><p class="sub">Las metas que nos pusimos para este proyecto.</p>`;
    HI.forEach(x=>{
      const obj=Number(x.objetivo)||1;
      // valor actual: si es un total calculado, lo sumamos
      let act;
      if(x.metrica==='total_mensajes') act=Number(m.ej_mensajes||0)+Number(m.cal_mensajes||0)+Number(m.esp_mensajes||0);
      else act=Number(m[x.metrica]||0);
      const menosEsMejor=/costo|cac/i.test(x.metrica);
      const dec = /costo/i.test(x.metrica) ? 2 : 0;
      if(menosEsMejor){
        const listo = act>0 && act<=obj;
        const pct = act>0 ? Math.min(100, Math.round(obj/act*100)) : 0;
        h+=`<div class="hito ${listo?'logrado':''}"><div class="tt">${x.titulo||x.metrica}</div>
          <div class="num">${act>0?`Hoy estás en ${fmt(act,dec)} · la meta es ${fmt(obj,dec)} o menos`:'Todavía sin datos'}</div>
          <div class="barra"><i style="width:${pct}%"></i></div>
          <div class="falta">${listo?'¡Logrado!':(act>0?`Te falta bajar ${fmt(act-obj,dec)}`:'')}</div></div>`;
      } else {
        const listo=act>=obj;
        const pct=Math.min(100,Math.round(act/obj*100));
        h+=`<div class="hito ${listo?'logrado':''}"><div class="tt">${x.titulo||x.metrica}</div>
          <div class="num">${fmt(act,dec)} de ${fmt(obj,dec)}</div>
          <div class="barra"><i style="width:${pct}%"></i></div>
          <div class="falta">${listo?'¡Logrado!':`${pct}% · faltan ${fmt(obj-act,dec)}`}</div></div>`;
      }
    });
  }

  const T=d.tareas||[];
  if(T.length){
    h+=`<h2>En qué estamos</h2><p class="sub">Lo que ya está hecho y lo que sigue.</p><div class="tar">
      ${T.map(t=>`<div class="it ${t.estado}"><span class="mark ${t.estado}" data-tid="${t.id}" data-est="${t.estado}"></span><span class="tx" data-tid2="${t.id}" data-est2="${t.estado}"><span class="tt">${t.titulo}</span>${t.detalle?`<span class="de">${t.detalle}</span>`:''}</span><button class="x" data-delt="${t.id}" title="Borrar">×</button></div>`).join('')}
    </div>
    <div class="agregarT"><input id="t_nueva" placeholder="Agregar algo que quieras hacer o pedirnos"><button id="t_add">Agregar</button></div>
    <p class="pista">Tocá una tarea para cambiarle el estado: pendiente, en curso o hecha. La × la borra.</p>`;
  }

  const A=d.activos||[];
  if(A.length){
    h+=`<h2>Tus activos</h2><p class="sub">Todo lo que vamos construyendo y queda tuyo. Podés sumar los tuyos.</p><div class="act">
      ${A.map(x=>x.url?`<a class="a" href="${x.url}" target="_blank"><span class="tt">${x.titulo}</span><div class="de">${x.descripcion||''}</div><div class="go">Abrir →</div><button class="x" data-dela="${x.id}" title="Borrar">×</button></a>`
        :`<div class="a sinlink"><span class="tt">${x.titulo}</span><div class="de">${x.descripcion||''}</div><div class="go">En preparación</div><button class="x" data-dela="${x.id}" title="Borrar">×</button></div>`).join('')}
    </div>

      <input id="a_tit" placeholder="Nombre del activo. Por ejemplo: Mi carpeta de fotos">

      <button id="a_add">Agregar activo</button>
    </div>`;
  }

  const N=d.notas||[];

    <div class="notas"><textarea id="nota_txt" placeholder="Escribí acá…"></textarea><br><button id="nota_btn">Guardar nota</button><div id="nota_out"></div>
    ${N.map(n=>`<div class="nota"><div class="quien ${n.autor==='semilla'?'semilla':''}">${n.autor==='semilla'?'Semilla Redes':'Vos'}</div><div class="txt">${n.texto}</div><div class="cuando">${new Date(n.fecha).toLocaleDateString('es-AR',{day:'numeric',month:'long'})}</div>${n.autor!=='semilla'?`<button class="x" data-deln="${n.id}" title="Borrar nota">×</button>`:''}</div>`).join('')}
    </div>`;

  const RC=d.recomendaciones&&d.recomendaciones.recomendaciones;
  if(RC&&RC.length){
    h+=`<h2>Recomendaciones</h2><p class="sub">Lo que vemos en tus números y qué haríamos ahora.</p>

  h+=`<p class="pie">Cualquier duda sobre estos números, escribile a Agus. Actualizamos todas las semanas.</p>`;
  $('app').innerHTML=h;
  $('cargando').classList.add('oculto'); $('app').classList.remove('oculto');

    aa.disabled=true; aa.textContent='…';

    ta.disabled=true; ta.textContent='…';
    const r=await rpc('sub_tarea_cliente_alta',{p_slug:slug,p_k:tok,p_titulo:t});
    if(r.ok) recargar(); else { ta.disabled=false; ta.textContent='Agregar'; }

  const nb=$('nota_btn');
  if(nb) nb.onclick=async()=>{
    const t=$('nota_txt').value.trim(); if(!t) return;
    nb.disabled=true; nb.textContent='Guardando…';
    const r=await rpc('sub_nota_alta',{p_slug:slug,p_k:tok,p_texto:t});
    if(r.ok){ $('nota_txt').value=''; recargar(); }
    else { $('nota_out').innerHTML='<p class="pista">No se pudo guardar, probá de nuevo.</p>'; nb.disabled=false; nb.textContent='Guardar nota'; }
  };
}

function recargar(){ rpc('sub_get',{p_slug:slug,p_k:tok}).then(pintar); }

rpc('sub_get',{p_slug:slug,p_k:tok}).then(d=>{
  if(d.error){ $('cargando').classList.add('oculto'); $('error').classList.remove('oculto'); return; }
  pintar(d);
}).catch(()=>{ $('cargando').classList.add('oculto'); $('error').classList.remove('oculto'); });
</script>
</body>
</html>

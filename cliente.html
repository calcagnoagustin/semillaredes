<style>

*{box-sizing:border-box}
html{background:#F2EDE4}
body{margin:0;background:var(--crema);color:var(--tinta);font-family:Inter,system-ui,sans-serif;line-height:1.55}
.wrap{max-width:880px;margin:0 auto;padding:30px 20px 100px}
.cabLogo{display:flex;align-items:center;gap:9px;margin-bottom:20px}
.logo{width:150px;display:block}
.beta{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;font-weight:700;color:var(--vino);border:1px solid var(--vino);border-radius:99px;padding:3px 9px;line-height:1}

.sub{font-size:13.5px;color:var(--mute);margin:0 0 14px}

.tarj{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}
.t{background:#fff;border:1px solid var(--linea);border-radius:13px;padding:16px}
.t .lab{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--oliva);font-weight:700}

.t .delta{font-size:12.5px;margin-top:3px;color:var(--mute)}
.up{color:var(--oliva);font-weight:600}.down{color:var(--vino);font-weight:600}
.t.destacada{background:var(--navy);border-color:var(--navy)}
.t.destacada .lab{color:var(--rosa)}
.t.destacada .val{color:var(--crema)}

.graf{background:#fff;border:1px solid var(--linea);border-radius:13px;padding:18px;margin-top:12px}
.graf h3{font-size:14px;color:var(--navy);margin:0 0 2px}

svg.linea{width:100%;height:170px;display:block;overflow:visible}
.aviso{background:#F6F2E9;border:1px dashed #D8CFBB;border-radius:11px;padding:14px 16px;font-size:13.5px;color:#5B5766;margin-top:12px}

.tar{background:#fff;border:1px solid var(--linea);border-radius:13px;overflow:hidden}
.tar .it{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--linea)}
.tar .it:last-child{border-bottom:0}
.mark{flex:none;width:19px;height:19px;border-radius:50%;border:2px solid #DDD6C7;margin-top:2px;position:relative}
.mark.hecha{background:var(--oliva);border-color:var(--oliva)}
.mark.hecha:after{content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.mark.en_curso{border-color:var(--rosa);background:repeating-linear-gradient(45deg,var(--rosa),var(--rosa) 3px,#fff 3px,#fff 6px)}
.it .tx{flex:1}
.it .tt{font-size:15.5px;font-weight:600;color:var(--navy)}
.it.hecha .tt{color:var(--mute);text-decoration:line-through}
.it .de{font-size:13px;color:var(--mute)}

.act{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.a{background:#fff;border:1px solid var(--linea);border-radius:13px;padding:16px;display:block;text-decoration:none;color:inherit}
.a:hover{border-color:var(--oliva)}
.a .tt{font-size:15.5px;font-weight:600;color:var(--navy)}
.a .de{font-size:13px;color:var(--mute);margin-top:2px}
.a .go{font-size:12.5px;color:var(--vino);font-weight:600;margin-top:8px}

.alerta{background:#fff;border:1px solid #E8C9CE;border-left:5px solid var(--vino);border-radius:13px;padding:17px 19px;margin-bottom:11px}

.camp{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:18px 20px;margin-bottom:12px}

.zona{display:flex;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--linea);font-size:13.5px;color:#6E6A78}

.camp.dentro{margin-left:18px;border-left:3px solid var(--oliva);background:#FBF8F2}

details.hist{background:#fff;border:1px solid var(--linea);border-radius:13px;overflow:hidden}

.hito{background:#fff;border:1px solid var(--linea);border-radius:13px;padding:16px 18px;margin-bottom:10px}

.nuevoHito{background:#fff;border:1px dashed #D8CFBB;border-radius:13px;padding:16px;margin-top:12px}

<script>
const API='https://fdrxsjphlvvwwknnrjtx.supabase.co';
const KEY='sb_publishable_kT7McM9Dt7xP44IlFotsLA_8-b8q_17';
const qs=new URLSearchParams(location.search);
// la marca se aplica de entrada, para que no haya un parpadeo de color
(function(){
  try{
    const mk=new URLSearchParams(location.search).get('marca');
    if(mk==='sadhana'){
      document.documentElement.style.background='#F4F7F9';
      const ic=document.querySelector('link[rel="icon"]');
      if(ic) ic.href='https://sadhanacomunicacion.com/icono-sadhana-64.png';
      document.addEventListener('DOMContentLoaded',()=>document.body.classList.add('sadhana'));
      if(document.body) document.body.classList.add('sadhana');
    }
  }catch(e){}
})();
const slug=qs.get('c')||'', tok=qs.get('k')||'';
const $=id=>document.getElementById(id);
const rpc=(fn,a)=>fetch(`${API}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(a)}).then(r=>r.json());

let MON='USD';
const mon=(n,d=2)=>n==null?'—':(MON==='ARS'?'$ '+Number(n).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:0}):'USD '+Number(n).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d}));
const fmt=(n,d=0)=>n==null?'—':Number(n).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fecha=s=>{const [a,m,d]=s.split('-');return `${d}/${m}`;};

function delta(act,ant,invertido){
  if(ant==null||act==null) return '';
  const d=act-ant; if(!ant||Math.abs(d)<0.0001) return '<span class="delta">igual que el período anterior</span>';
  const pct=Math.round(d/ant*100);
  const bien = invertido ? d<0 : d>0;
  const flecha = d>0?'▲':'▼';
  return `<span class="delta ${bien?'up':'down'}">${flecha} ${Math.abs(pct)}% vs período anterior</span>`;
}

function linea(datos, etiquetas, color, invertido){
  if(datos.filter(x=>x!=null).length<2) return null;
  const W=560,H=150,P=26;
  const vals=datos.filter(x=>x!=null);
  const min=Math.min(...vals), max=Math.max(...vals);
  const rango=(max-min)||1;
  const x=i=>P+(i*(W-P*2)/Math.max(1,datos.length-1));
  const y=v=>H-P-((v-min)/rango)*(H-P*2);
  let d='',pts='';
  datos.forEach((v,i)=>{ if(v==null)return; d+=(d?' L ':'M ')+x(i)+' '+y(v); pts+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${color}"/>`; });
  const labs=etiquetas.map((e,i)=>`<text x="${x(i)}" y="${H-6}" font-size="13" fill="#8A8697" text-anchor="middle">${e}</text>`).join('');
  const valsTxt=datos.map((v,i)=>v==null?'':`<text x="${x(i)}" y="${y(v)-13}" font-size="15" font-weight="700" fill="${color}" text-anchor="middle">${v}</text>`).join('');
  return `<svg class="linea" viewBox="0 0 ${W} ${H}"><path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${pts}${valsTxt}${labs}</svg>`;
}

function multi(R){
  const series=[
    {k:'ig_followers_total',lab:'Instagram',color:'#7A1F3A'},
    {k:(R.filter(r=>r.metricas.sp_oyentes_perfil!=null).length>1?'sp_oyentes_perfil':'sp_monthly'),lab:'Spotify',color:'#87863A'},
    {k:'yt_views',lab:'YouTube',color:'#E2767C'}
  ].map(x=>{
    const vals=R.map(r=>r.metricas[x.k]??null);
    const base=vals.find(v=>v!=null);
    return {...x, vals, base, idx: base?vals.map(v=>v==null?null:Math.round(v/base*100)):[]};
  }).filter(x=>x.base && x.idx.filter(v=>v!=null).length>1);

  if(!series.length) return `<div class="graf"><h3>Curva de crecimiento</h3><p class="leyenda">Instagram, Spotify y YouTube en un mismo gráfico.</p>
    <div class="aviso">Hace falta al menos dos períodos cargados para dibujar la curva. Con uno solo todavía no hay de dónde medir el crecimiento.</div></div>`;

  const W=560,H=170,P=30;
  const todos=series.flatMap(s=>s.idx).filter(v=>v!=null);
  const min=Math.min(100,...todos), max=Math.max(...todos), rango=(max-min)||1;
  const n=R.length;
  const x=i=>P+(i*(W-P*2)/Math.max(1,n-1));
  const y=v=>H-P-((v-min)/rango)*(H-P*2);
  let cuerpo=`<line x1="${P}" y1="${y(100)}" x2="${W-P}" y2="${y(100)}" stroke="#E5DFD2" stroke-width="1" stroke-dasharray="3 3"/>`;
  series.forEach(s=>{
    let d='';
    s.idx.forEach((v,i)=>{ if(v==null)return; d+=(d?' L ':'M ')+x(i)+' '+y(v); });
    cuerpo+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
    s.idx.forEach((v,i)=>{ if(v!=null) cuerpo+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${s.color}"/>`; });
    const ultimo=[...s.idx].reverse().find(v=>v!=null);
    cuerpo+=`<text x="${W-P+5}" y="${y(ultimo)+4}" font-size="15" font-weight="700" fill="${s.color}">${ultimo}</text>`;
  });
  cuerpo+=R.map((r,i)=>`<text x="${x(i)}" y="${H-8}" font-size="13" fill="#8A8697" text-anchor="middle">${fecha(r.hasta)}</text>`).join('');
  const ley=series.map(s=>`<span style="display:inline-flex;align-items:center;gap:6px;margin-right:14px"><span style="width:10px;height:10px;border-radius:50%;background:${s.color};display:inline-block"></span>${s.lab} <b style="color:${s.color}">${s.vals.filter(v=>v!=null).slice(-1)[0]}</b></span>`).join('');
  return `<div class="graf"><h3>Curva de crecimiento</h3>
    <p class="leyenda">Las tres plataformas arrancan en 100 en el primer período, así se ve cuál crece más rápido sin que los números grandes tapen a los chicos.</p>
    <div style="font-size:12.5px;margin-bottom:8px">${ley}</div>
    <svg class="linea" viewBox="0 0 ${W} ${H}">${cuerpo}</svg></div>`;
}

function grafico(titulo, leyenda, datos, etiquetas, color, invertido){
  const svg=linea(datos,etiquetas,color,invertido);
  return `<div class="graf"><h3>${titulo}</h3><p class="leyenda">${leyenda}</p>
    ${svg||`<div class="aviso">Con un solo período cargado todavía no hay línea de tendencia. A partir del segundo reporte vas a ver cómo evoluciona.</div>`}</div>`;
}

// tasa de conversion visita -> seguidor, siempre con nuevos y visitas del mismo reporte
const convIG=(R)=>{ const L=(R||[]).filter(r=>Number(r.metricas.ig_visitas)>0&&r.metricas.ig_followers_nuevos!=null);
  if(!L.length) return '';
  const f=r=>Number(r.metricas.ig_followers_nuevos)/Number(r.metricas.ig_visitas)*100;
  const c=f(L[L.length-1]), p=L.length>1?f(L[L.length-2]):null;
  return card('Conversión de visitas', fmt(c,1)+'%', [c,p],1); };
// conjuntos de la campaña de seguidores (igc1..igc4) del ultimo reporte
const conjIG=(u)=>{ if(!u) return ''; const x=u.metricas, L=[]; // igcN_visitas = visitas al perfil (resultado de la campaña)
  for(let i=1;i<=6;i++){ const n=x['igc'+i+'_nombre']; if(!n) continue;
    const inv=Number(x['igc'+i+'_inversion']), s=Number(x['igc'+i+'_visitas']);
    L.push({n, s:isNaN(s)?null:s, c:(!isNaN(inv)&&s>0)?inv/s:null}); }
  if(!L.length) return '';
  const es=t=>String(t).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  return `<div class="desglose"><h3>Conjuntos de anuncios de seguidores</h3>
    <p class="leyenda">Del ${fecha(u.desde)} al ${fecha(u.hasta)}: cuántas visitas al perfil trajo cada conjunto y cuánto costó cada una. Es el resultado que busca la campaña.</p>
    <div class="fila2 cab2 conj"><span>Conjunto</span><span style="text-align:right">Visitas al perfil</span><span style="text-align:right">Costo c/u</span></div>
    ${L.map(z=>`<div class="fila2 conj"><span class="nom">${es(z.n)}</span><span class="v">${z.s!=null?fmt(z.s):''}</span><span class="c">${z.c!=null?mon(z.c,2):''}</span></div>`).join('')}
  </div>`; };
const card=(lab,val,ant,dec,dest,inv)=>`<div class="t ${dest?'destacada':''}"><div class="lab">${lab}</div><div class="val">${val}</div>${delta(ant?.[0],ant?.[1],inv)}</div>`;

const CAMPS=[
  {p:'ej', tit:'Reservas Ejecutivo', que:'Campaña para el público ejecutivo.'},
  {p:'cal', tit:'Reservas Calificadas', que:'La campaña principal: incluye famosos y general.', dest:true},
  {p:'fam', tit:'Famosos', que:'Va adentro de Calificadas. Se muestra aparte para verlo solo.', dentro:true},
  {p:'esp', tit:'Campaña especial', que:'Acción puntual por fecha.'}
];

function multiCamp(R,et){
  const series=[{k:'ej_mensajes',lab:'Ejecutivo',color:'#7A1F3A'},{k:'cal_mensajes',lab:'Calificadas',color:'#87863A'},{k:'fam_mensajes',lab:'Famosos (dentro de Calificadas)',color:'#E2767C'}]
    .map(x=>({...x, vals:R.map(r=>r.metricas[x.k]??null)}))
    .filter(x=>x.vals.filter(v=>v!=null).length>1);
  if(!series.length) return '';
  const W=560,H=175,P=30;
  const todos=series.flatMap(s=>s.vals).filter(v=>v!=null);
  const min=Math.min(...todos), max=Math.max(...todos), rango=(max-min)||1;
  const x=i=>P+(i*(W-P*2)/Math.max(1,R.length-1));
  const y=v=>H-P-((v-min)/rango)*(H-P*2);
  let cuerpo='';
  series.forEach(s=>{
    let d2='';
    s.vals.forEach((v,i)=>{ if(v==null)return; d2+=(d2?' L ':'M ')+x(i)+' '+y(v); });
    cuerpo+=`<path d="${d2}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
    s.vals.forEach((v,i)=>{ if(v!=null) cuerpo+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${s.color}"/><text x="${x(i)}" y="${y(v)-10}" font-size="10.5" font-weight="700" fill="${s.color}" text-anchor="middle">${v}</text>`; });
  });
  cuerpo+=R.map((r,i)=>`<text x="${x(i)}" y="${H-8}" font-size="13" fill="#8A8697" text-anchor="middle">${et[i]}</text>`).join('');
  const ley=series.map(s=>`<span style="display:inline-flex;align-items:center;gap:6px;margin-right:16px"><span style="width:10px;height:10px;border-radius:50%;background:${s.color};display:inline-block"></span>${s.lab}</span>`).join('');
  return `<div class="graf"><h3>Mensajes por campaña</h3>
    <p class="leyenda">Cuánta gente escribió para reservar en cada campaña.</p>
    <div style="font-size:12.5px;margin-bottom:8px">${ley}</div>
    <svg class="linea" viewBox="0 0 ${W} ${H}">${cuerpo}</svg></div>`;
}

function aplicarMarca(marca){
  if(marca==='sadhana'){
    document.body.classList.add('sadhana');
    const img=document.querySelector('.logo');
    if(img){ img.src='https://raw.githubusercontent.com/calcagnoagustin/semillaredes/main/assets/sadhana-logo.png'; img.alt='Sadhana Comunicación'; }
    document.title=document.title.replace('Semilla Redes','Sadhana Comunicación');
  }
}

function pintarTrafico(d){
  MON=(d.cliente.moneda||'USD');
  aplicarMarca(d.cliente.marca);
  const R=d.reportes||[];
  const u=R[R.length-1]||null, a=R.length>1?R[R.length-2]:null;
  const ultimo=(k)=>{ for(let i=R.length-1;i>=0;i--){ const x=R[i].metricas[k]; if(x!=null) return x; } return null; };
  const previo=(k)=>{ let visto=false; for(let i=R.length-1;i>=0;i--){ const x=R[i].metricas[k]; if(x!=null){ if(visto) return x; visto=true; } } return null; };
  const m=new Proxy({},{get:(_,k)=>ultimo(k)}), ma=new Proxy({},{get:(_,k)=>previo(k)});
  const et=R.map(r=>fecha(r.hasta));
  const hay=(k)=>R.some(r=>r.metricas[k]!=null);

  const AUD=[
    {p:'a1', tit:'1. Decisores institucionales', sub:'Estados Unidos', color:'#518BAF'},
    {p:'a2', tit:'2. Profesionales MD/DO, PA, NP', sub:'Estados Unidos', color:'#F15C32'},
    {p:'a3', tit:'3. Estudiantes y trainees de salud', sub:'Estados Unidos', color:'#27435A'}
  ];

  let h=`<h1>${d.cliente.nombre}</h1>
    <p class="periodo">${u?`${fecha(u.desde)} al ${fecha(u.hasta)}`:'Sin reportes cargados'}</p>
    <div class="avisoActualiza">
      <div class="tit">Este informe se actualiza todos los jueves.</div>
      <p class="sub">Los números que ves no son en vivo: corresponden al último período cerrado.</p>
    </div>`;

  // ===== 1. TRAFICO =====
  if(hay('tr_visitas')||hay('a1_visitas')||hay('a2_visitas')||hay('a3_visitas')){
    h+=`<h2>Tráfico a la página</h2><p class="sub">Gente que llegó al sitio desde la campaña.</p><div class="tarj">
      ${card('Visitas totales', fmt(m.tr_visitas), [m.tr_visitas, ma.tr_visitas],0,true)}
      ${hay('tr_costo_visita')?card('Costo por visita', mon(m.tr_costo_visita,2), [m.tr_costo_visita, ma.tr_costo_visita],2,false,true):''}
      ${hay('tr_inversion')?card('Invertido', mon(m.tr_inversion,2), [m.tr_inversion, ma.tr_inversion],2):''}
      ${hay('tr_alcance')?card('Personas alcanzadas', fmt(m.tr_alcance), [m.tr_alcance, ma.tr_alcance]):''}
    </div>`;
    if(R.filter(r=>r.metricas.tr_visitas!=null).length>1){
      h+=grafico('Visitas','Cuánta gente llegó al sitio en cada período.',R.map(r=>r.metricas.tr_visitas),et,'#518BAF');
      h+=grafico('Costo por visita','Cuánto cuesta cada visita. Mientras más baja la línea, mejor.',R.map(r=>r.metricas.tr_costo_visita),et,'#F15C32',true);
    }

    const conDatos=AUD.filter(x=>hay(x.p+'_visitas'));
    if(conDatos.length){
      h+=`<h2>Los tres públicos</h2><p class="sub">Cómo rindió cada uno en este período.</p>`;
      conDatos.forEach(x=>{
        const vis=m[x.p+'_visitas'], cos=m[x.p+'_costo'], inv=m[x.p+'_inversion'], alc=m[x.p+'_alcance'];
        h+=`<div class="camp"><h3>${x.tit}</h3><p class="que">${x.sub}</p>
          <div class="nums">
            <div class="n"><div class="l">Visitas</div><div class="v">${fmt(vis)}</div><div class="d">${delta(vis, ma[x.p+'_visitas'])||''}</div></div>
            <div class="n"><div class="l">Costo por visita</div><div class="v">${fmt(cos,2)}</div><div class="d">${MON}</div></div>
            ${inv!=null?`<div class="n"><div class="l">Invertido</div><div class="v">${fmt(inv,0)}</div><div class="d">${MON}</div></div>`:''}
            ${alc!=null?`<div class="n"><div class="l">Alcance</div><div class="v">${fmt(alc)}</div><div class="d">personas</div></div>`:''}
          </div></div>`;
      });

      const series=conDatos.map(x=>({lab:x.tit.split('.')[0], color:x.color, vals:R.map(r=>r.metricas[x.p+'_visitas']??null)}))
        .filter(x=>x.vals.filter(v=>v!=null).length>1);
      if(series.length){
        const W=560,H=175,P=30;
        const todos=series.flatMap(z=>z.vals).filter(v=>v!=null);
        const min=Math.min(...todos), max=Math.max(...todos), rango=(max-min)||1;
        const X=i=>P+(i*(W-P*2)/Math.max(1,R.length-1));
        const Y=v=>H-P-((v-min)/rango)*(H-P*2);
        let cuerpo='';
        series.forEach(z=>{ let dd='';
          z.vals.forEach((v,i)=>{ if(v==null)return; dd+=(dd?' L ':'M ')+X(i)+' '+Y(v); });
          cuerpo+=`<path d="${dd}" fill="none" stroke="${z.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
          z.vals.forEach((v,i)=>{ if(v!=null) cuerpo+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="${z.color}"/>`; });
        });
        cuerpo+=R.map((r,i)=>`<text x="${X(i)}" y="${H-8}" font-size="13" fill="#6E8598" text-anchor="middle">${et[i]}</text>`).join('');
        const ley=series.map(z=>`<span style="display:inline-flex;align-items:center;gap:6px;margin-right:14px"><span style="width:10px;height:10px;border-radius:50%;background:${z.color};display:inline-block"></span>Público ${z.lab}</span>`).join('');
        h+=`<div class="graf"><h3>Visitas por público</h3><p class="leyenda">Los tres públicos comparados.</p>
          <div style="font-size:12.5px;margin-bottom:8px">${ley}</div>
          <svg class="linea" viewBox="0 0 ${W} ${H}">${cuerpo}</svg></div>`;
      }
    }
  }

  // ===== 2. SEGUIDORES =====
  if(hay('ig_followers_total')||hay('ig_followers_nuevos')){
    h+=`<h2>Seguidores</h2><p class="sub">Crecimiento de la cuenta.</p><div class="tarj">
      ${card('Seguidores', fmt(m.ig_followers_total), [m.ig_followers_total, ma.ig_followers_total])}
      ${card('Nuevos en el período', fmt(m.ig_followers_nuevos), [m.ig_followers_nuevos, ma.ig_followers_nuevos])}
      ${hay('ig_visitas')?card('Visitas al perfil', fmt(m.ig_visitas), [m.ig_visitas, ma.ig_visitas]):''}
      ${convIG(R)}
      ${hay('ig_costo_follower')?card('Costo por seguidor', mon(m.ig_costo_follower,2), [m.ig_costo_follower, ma.ig_costo_follower],2,true,true):''}
      ${hay('ig_inversion')?card('Invertido', mon(m.ig_inversion,2), [m.ig_inversion, ma.ig_inversion],2):''}
    </div>`;
    if(R.filter(r=>r.metricas.ig_followers_total!=null).length>1){
      h+=conjIG(u);
      h+=grafico('Seguidores','Cómo viene creciendo la cuenta.',R.map(r=>r.metricas.ig_followers_total),et,'#518BAF');
      if(hay('ig_costo_follower'))
        h+=grafico('Costo por seguidor','Cuánto cuesta cada seguidor nuevo. Mientras más baja la línea, mejor.',R.map(r=>r.metricas.ig_costo_follower),et,'#F15C32',true);
    }
  }

  // ===== inversion =====
  if(hay('ig_inversion')&&hay('tr_inversion')){
    h+=`<h2>Inversión</h2><p class="sub">Lo que se puso en pauta en este período.</p><div class="tarj">
      ${card('En tráfico',mon(m.tr_inversion,2),[m.tr_inversion,ma.tr_inversion],2)}
      ${card('En seguidores',mon(m.ig_inversion,2),[m.ig_inversion,ma.ig_inversion],2)}
      ${card('Total',mon(Number(m.ig_inversion||0)+Number(m.tr_inversion||0),2),null,2,true)}
    </div>`;
  }

  if(R.length>1){
    h+=`<h2>Historial</h2><p class="sub">Todos los reportes.</p>
      <details class="hist"><summary><span class="flecha">▶</span> Ver los ${R.length} reportes</summary><table>
      <tr><th>Período</th><th>Visitas</th><th>Costo x visita</th>${hay('ig_followers_total')?'<th>Seguidores</th><th>Nuevos</th>':''}<th>Inversión</th></tr>
      ${R.slice().reverse().map(r=>{const x=r.metricas;return `<tr><td>${fecha(r.desde)} al ${fecha(r.hasta)}</td>
        <td><b>${fmt(x.tr_visitas)}</b></td><td>${fmt(x.tr_costo_visita,2)}</td>
        ${hay('ig_followers_total')?`<td>${fmt(x.ig_followers_total)}</td><td>${fmt(x.ig_followers_nuevos)}</td>`:''}
        <td>${fmt(Number(x.ig_inversion||0)+Number(x.tr_inversion||0),2)}</td></tr>`}).join('')}
      </table></details>`;
  }
  return h;
}

function pintarSemilla(d){
  MON=(d.cliente.moneda||'USD');
  const R=d.reportes||[];
  const u=R[R.length-1]||null;
  const ultimo=(k)=>{ for(let i=R.length-1;i>=0;i--){ const x=R[i].metricas[k]; if(x!=null) return x; } return null; };
  const previo=(k)=>{ let v=false; for(let i=R.length-1;i>=0;i--){ const x=R[i].metricas[k]; if(x!=null){ if(v) return x; v=true; } } return null; };
  const m=new Proxy({},{get:(_,k)=>ultimo(k)}), ma=new Proxy({},{get:(_,k)=>previo(k)});
  const et=R.map(r=>fecha(r.hasta));
  const hay=(k)=>R.some(r=>r.metricas[k]!=null);

  let h=`<h1>${d.cliente.nombre}</h1>
    <p class="periodo">${u?`${fecha(u.desde)} al ${fecha(u.hasta)}`:'Sin reportes cargados'}</p>`;

  // ===== SEGUIDORES =====
  if(hay('ig_inversion')||hay('ig_followers_total')){
    h+=`<h2>Seguidores</h2><p class="sub">La campaña de crecimiento de la cuenta, desde el 1 del mes.</p><div class="tarj">
      ${hay('ig_followers_total')?card('Seguidores', fmt(m.ig_followers_total), [m.ig_followers_total, ma.ig_followers_total],0,true):''}
      ${hay('ig_followers_nuevos')?card('Nuevos en el mes', fmt(m.ig_followers_nuevos), [m.ig_followers_nuevos, ma.ig_followers_nuevos]):''}
      ${hay('ig_costo_follower')?card('Costo por seguidor', mon(m.ig_costo_follower,3), [m.ig_costo_follower, ma.ig_costo_follower],3,false,true):''}
      ${card('Invertido', mon(m.ig_inversion,2), [m.ig_inversion, ma.ig_inversion],2)}
      ${hay('ig_alcance')?card('Personas alcanzadas', fmt(m.ig_alcance), [m.ig_alcance, ma.ig_alcance]):''}
    </div>`;
    {
      const DI=(u&&u.metricas&&u.metricas.dias)||[];
      if(DI.length>1) h+=graficoDia(DI,'ig','Inversión día por día','Lo que se gastó cada día en la campaña de seguidores.','#87863A',true);
    }
    if(R.filter(r=>r.metricas.ig_costo_follower!=null).length>1)
      h+=grafico('Costo por seguidor','Cuánto costó cada seguidor nuevo mes a mes. Mientras más baja la línea, mejor.',R.map(r=>r.metricas.ig_costo_follower??null),et,'#1A2456',true);
    if(R.filter(r=>r.metricas.ig_inversion!=null).length>1)
      h+=grafico('Inversión en seguidores','Lo que se puso en la campaña cada mes.',R.map(r=>r.metricas.ig_inversion),et,'#87863A');
  }

  // ===== FORMACION =====
  if(hay('frm_inversion')){
    h+=`<h2>Formación</h2><p class="sub">Todo lo que empuja la Formación Semilla, sumando sus campañas.</p><div class="tarj">

      ${hay('frm_clics')?card('Clics', fmt(m.frm_clics), [m.frm_clics, ma.frm_clics]):''}
      ${hay('ftr_visitas')?card('Visitas a la página', fmt(m.ftr_visitas), [m.ftr_visitas, ma.ftr_visitas]):''}
      ${hay('ftr_costo_visita')?card('Costo por visita', mon(m.ftr_costo_visita,3), [m.ftr_costo_visita, ma.ftr_costo_visita],3,false,true):''}
    </div>`;
    const DIAS=(u&&u.metricas&&u.metricas.dias)||[];
    if(DIAS.length>1){
      h+=graficoDia(DIAS,'frm','Inversión día por día','Lo que se gastó cada día en la Formación.','#7A1F3A',true);
      h+=graficoDia(DIAS,'vis','Visitas día por día','Cuánta gente llegó a la página cada día.','#1A2456');
      h+=graficoDia(DIAS,'msj','Mensajes día por día','Consultas que entraron cada día.','#E2767C');
    }
    if(R.filter(r=>r.metricas.frm_visitas!=null).length>1)
      h+=grafico('Visitas a la página','Gente que llegó a la página de la Formación mes a mes.',R.map(r=>r.metricas.frm_visitas??null),et,'#1A2456');
    if(R.filter(r=>r.metricas.frm_mensajes!=null).length>1)
      h+=grafico('Mensajes','Consultas que llegaron por la Formación.',R.map(r=>r.metricas.frm_mensajes??null),et,'#E2767C');

    const bloques=[
      {p:'ftr', t:'Tráfico a la página', q:'Gente que llega a la landing de la Formación.',
        n:[['ftr_visitas','Visitas',0],['ftr_costo_visita','Costo por visita',3],['ftr_inversion','Invertido',2],['ftr_alcance','Alcance',0]]},
      {p:'fmsj', t:'Mensajes', q:'Consultas que llegan por mensaje.',
        n:[['fmsj_mensajes','Mensajes',0],['fmsj_costo_mensaje','Costo por mensaje',2],['fmsj_inversion','Invertido',2],['fmsj_alcance','Alcance',0]]},
      {p:'fvta', t:'Ventas', q:'La campaña orientada a la inscripción.',
        n:[['fvta_ventas','Ventas',0],['fvta_costo_venta','Costo por venta',2],['fvta_visitas','Visitas',0],['fvta_inversion','Invertido',2]]},
      {p:'fpub', t:'Publicaciones promocionadas', q:'Posteos de la Formación con pauta.',
        n:[['fpub_visitas','Visitas',0],['fpub_inversion','Invertido',2],['fpub_alcance','Alcance',0]]}
    ];
    bloques.forEach(b=>{
      if(!hay(b.p+'_inversion')) return;
      const nums=b.n.filter(([k])=>m[k]!=null).map(([k,l,dec])=>{
        const esPlata=k.includes('inversion')||k.includes('costo');
        return `<div class="n"><div class="l">${l}</div><div class="v">${fmt(m[k],dec)}</div><div class="d">${esPlata?MON:(delta(m[k],ma[k])||'')}</div></div>`;
      }).join('');
      h+=`<div class="camp"><h3>${b.t}</h3><p class="que">${b.q}</p><div class="nums">${nums}</div></div>`;
    });

    if(R.filter(r=>r.metricas.frm_inversion!=null).length>1)
      h+=grafico('Inversión en Formación','Cómo creció la pauta de la Formación.',R.map(r=>r.metricas.frm_inversion??null),et,'#7A1F3A');
    if(R.filter(r=>r.metricas.ftr_visitas!=null).length>1)
      h+=grafico('Visitas a la página','Gente que llegó a la landing en cada período.',R.map(r=>r.metricas.ftr_visitas??null),et,'#1A2456');
  }

  // ===== INVERSION TOTAL =====
  if(hay('ig_inversion')&&hay('frm_inversion')){
    h+=`<h2>Inversión</h2><p class="sub">El reparto de la pauta en este período.</p><div class="tarj">
      ${card('En seguidores',mon(m.ig_inversion,2),[m.ig_inversion,ma.ig_inversion],2)}
      ${card('En Formación',mon(m.frm_inversion,2),[m.frm_inversion,ma.frm_inversion],2)}
      ${card('Total',mon(Number(m.ig_inversion||0)+Number(m.frm_inversion||0),2),null,2,true)}
    </div>`;
  }

  // presupuesto que esta corriendo hoy
  if(hay('pres_diario')){
    const dias=new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
    h+=`<h2>Presupuesto</h2><p class="sub">Lo que hay cargado hoy en las campañas activas.</p><div class="tarj">
      ${card('Presupuesto diario', mon(m.pres_diario,2), [m.pres_diario, ma.pres_diario],2,true)}
      ${card('Estimado del mes', mon(Number(m.pres_diario||0)*dias,0), null,0)}
      ${hay('pres_gastado')?card('Gastado hasta hoy', mon(m.pres_gastado,2), [m.pres_gastado, ma.pres_gastado],2):''}
    </div>
    <p class="sub" style="margin-top:9px">Cuenta solo las campañas que están corriendo de verdad. El estimado supone que ese presupuesto se mantiene los ${dias} días del mes.</p>`;
  }

  if(R.length>1){
    h+=`<h2>Historial</h2><p class="sub">Todos los reportes.</p>
      <details class="hist"><summary><span class="flecha">▶</span> Ver los ${R.length} reportes</summary><table>
      <tr><th>Mes</th><th>Seguidores</th><th>Nuevos</th><th>Costo x seg.</th><th>Inv. seguidores</th><th>Mensajes</th><th>Visitas Formación</th><th>Inv. Formación</th></tr>
      ${R.slice().reverse().map(r=>{const x=r.metricas;return `<tr><td>${fecha(r.desde)} al ${fecha(r.hasta)}</td>
        <td>${fmt(x.ig_followers_total)}</td><td>${fmt(x.ig_followers_nuevos)}</td><td>${fmt(x.ig_costo_follower,3)}</td><td>${fmt(x.ig_inversion,2)}</td>
        <td>${fmt(x.frm_mensajes)}</td><td><b>${fmt(x.frm_visitas)}</b></td><td>${fmt(x.frm_inversion,2)}</td></tr>`}).join('')}
      </table></details>`;
  }
  return h;
}

function pintarVentas(d){
  MON=(d.cliente.moneda||'USD');
  const R=d.reportes||[];
  const u=R[R.length-1]||null, a=R.length>1?R[R.length-2]:null;
  const ultimo=(k)=>{ for(let i=R.length-1;i>=0;i--){ const x=R[i].metricas[k]; if(x!=null) return x; } return null; };
  const previo=(k)=>{ let visto=false; for(let i=R.length-1;i>=0;i--){ const x=R[i].metricas[k]; if(x!=null){ if(visto) return x; visto=true; } } return null; };
  const m=new Proxy({},{get:(_,k)=>ultimo(k)}), ma=new Proxy({},{get:(_,k)=>previo(k)});
  const et=R.map(r=>fecha(r.hasta));
  const hay=(k)=>R.some(r=>r.metricas[k]!=null);

  let h=`<h1>${d.cliente.nombre}</h1>
    <p class="periodo">${u?`${fecha(u.desde)} al ${fecha(u.hasta)}`:'Sin reportes cargados'}</p>`;

  // --- Seguidores primero (pedido de Agus) ---
  if(hay('ig_followers_total')){
    h+=`<h2>Instagram</h2><p class="sub">Crecimiento de la cuenta.</p><div class="tarj">
      ${card('Seguidores', fmt(m.ig_followers_total), [m.ig_followers_total, ma.ig_followers_total])}
      ${card('Nuevos en el período', fmt(m.ig_followers_nuevos), [m.ig_followers_nuevos, ma.ig_followers_nuevos])}
      ${card('Visitas al perfil', fmt(m.ig_visitas), [m.ig_visitas, ma.ig_visitas])}
      ${convIG(R)}
      ${card('Costo por seguidor', mon(m.ig_costo_follower,3), [m.ig_costo_follower, ma.ig_costo_follower],3,true,true)}
    </div>`;
    h+=conjIG(u);
    h+=grafico('Seguidores','Cómo viene creciendo la cuenta.',R.map(r=>r.metricas.ig_followers_total),et,'#7A1F3A');
    h+=grafico('Costo por seguidor','Cuánto cuesta cada seguidor nuevo. Mientras más baja la línea, mejor.',R.map(r=>r.metricas.ig_costo_follower),et,'#1A2456',true);
  }

  // --- despues, las ventas ---
  h+=`<h2>Ventas</h2><p class="sub">Lo que generó la campaña en este período.</p><div class="tarj">
    ${card('Ventas', fmt(m.vta_ventas), [m.vta_ventas, ma.vta_ventas],0,true)}
    ${hay('vta_ingreso')?card('Facturación', mon(m.vta_ingreso,0), [m.vta_ingreso, ma.vta_ingreso],0):''}
    ${hay('vta_ganancia')?card('Ganancia neta', mon(m.vta_ganancia,0), [m.vta_ganancia, ma.vta_ganancia],0):''}
    ${hay('vta_costo_venta')?card('Costo por venta', mon(m.vta_costo_venta,2), [m.vta_costo_venta, ma.vta_costo_venta],2,false,true):''}
    ${hay('vta_roas')?card('ROAS', fmt(m.vta_roas,2), [m.vta_roas, ma.vta_roas],2):''}
    ${hay('vta_roi')?card('ROI', fmt(m.vta_roi)+'%', [m.vta_roi, ma.vta_roi]):''}
    ${hay('vta_inversion')?card('Invertido', mon(m.vta_inversion,2), [m.vta_inversion, ma.vta_inversion],2):''}
    ${hay('vta_inversion_diaria')?card('Por día', mon(m.vta_inversion_diaria,0), [m.vta_inversion_diaria, ma.vta_inversion_diaria],0):''}
  </div>`;
  if(m.vta_atribuidas!=null)
    h+=`<p class="sub" style="margin-top:9px">De las ${fmt(m.vta_ventas)} ventas, ${fmt(m.vta_atribuidas)} se atribuyen al pixel.</p>`;
  // --- el mes del reporte, aparte (prorratea por dias los periodos que cruzan meses) ---
  if(u){
    const D=x=>new Date(x+'T00:00:00Z'), dia=86400000;
    const fin=D(u.hasta), ini=new Date(Date.UTC(fin.getUTCFullYear(),fin.getUTCMonth(),1));
    const sumaMes=k=>{ let t=0, hay1=false; R.forEach(r=>{ const x=r.metricas[k]; if(x==null||isNaN(Number(x))) return;
      const d0=D(r.desde), d1=D(r.hasta), tot=Math.max(1,(d1-d0)/dia);
      const dentro=Math.max(0,(Math.min(d1,fin)-Math.max(d0,ini))/dia);
      if(dentro>0){ t+=Number(x)*dentro/tot; hay1=true; } }); return hay1?t:null; };
    const vM=sumaMes('vta_ventas'), fM=sumaMes('vta_ingreso'), gM=sumaMes('vta_ganancia'), iM=sumaMes('vta_inversion');
    if(vM!=null||fM!=null||gM!=null){
      const mes=ini.toLocaleDateString('es-AR',{month:'long',timeZone:'UTC'});
      h+=`<h2>${mes.charAt(0).toUpperCase()+mes.slice(1)}, hasta el ${fecha(u.hasta)}</h2>
      <p class="sub">La suma de todos los reportes del mes. Si un período cruza de un mes a otro, se reparte por días.</p><div class="tarj">
        ${vM!=null?card('Ventas del mes', fmt(Math.round(vM)), null,0,true):''}
        ${fM!=null?card('Facturación del mes', mon(Math.round(fM),0), null,0):''}
        ${gM!=null?card('Ganancia neta del mes', mon(Math.round(gM),0), null,0):''}
        ${iM!=null?card('Invertido en el mes', mon(iM,2), null,2):''}
      </div>`;
    }
  }
  if(hay('vta_roas'))
    h+=`<div class="graf"><h3>Qué es el ROAS</h3><p class="leyenda">Por cada dólar puesto en publicidad, cuántos volvieron en ventas. Un ROAS de 5 significa que cada dólar trajo cinco.</p></div>`;

  h+=bloqueVentas(d, m.vta_nombre||'Campaña de venta', R.reduce((t,r)=>t+Number(r.metricas.vta_inversion||0),0));

  if(R.filter(r=>r.metricas.vta_ventas!=null).length>1){
    h+=grafico('Ventas','Cuántas ventas trajo la campaña en cada período.',R.map(r=>r.metricas.vta_ventas),et,'#7A1F3A');
    if(R.filter(r=>r.metricas.vta_roas!=null).length>1)
      h+=grafico('ROAS','Cuánto vuelve por cada peso invertido. Cuanto más alta la línea, mejor.',R.map(r=>r.metricas.vta_roas),et,'#87863A');
  }

  // --- desglose por campaña ---
  const DG=(u&&u.metricas&&u.metricas.desglose)||null;
  if(DG&&DG.length){
    h+=`<div class="desglose"><h3>Campaña por campaña</h3>
      <p class="leyenda">Cómo rindió cada conjunto de anuncios en este período.</p>
      <div class="fila2 cab2"><span>Campaña</span><span style="text-align:right">Ventas</span><span style="text-align:right">Costo</span></div>
      ${DG.map(x=>`<div class="fila2"><span class="nom">${x.nombre}</span>
        <span class="v">${x.ventas!=null&&x.ventas!==0?fmt(x.ventas):'—'}</span>
        <span class="c">${x.costo!=null?mon(x.costo,2):'<span class="sin">sin ventas</span>'}</span></div>`).join('')}
    </div>`;
  }

  // --- visitas a la pagina, si las hay ---
  if(hay('vta_visitas')){
    h+=`<h2>Tráfico</h2><p class="sub">Gente que llegó a la página.</p><div class="tarj">
      ${card('Visitas a la página', fmt(m.vta_visitas), [m.vta_visitas, ma.vta_visitas],0,true)}
      ${hay('vta_costo_visita')?card('Costo por visita', mon(m.vta_costo_visita,3), [m.vta_costo_visita, ma.vta_costo_visita],3,false,true):''}
    </div>`;
    if(R.filter(r=>r.metricas.vta_visitas!=null).length>1)
      h+=grafico('Visitas a la página','Cuánta gente llegó a la página de venta.',R.map(r=>r.metricas.vta_visitas),et,'#E2767C');
  }

  // --- inversion, solo si hay mas de una fuente ---
  if(hay('ig_inversion')){
    h+=`<h2>Inversión</h2><p class="sub">Lo que se puso en pauta en este período.</p><div class="tarj">
      ${card('En seguidores',mon(m.ig_inversion,2),[m.ig_inversion,ma.ig_inversion],2)}
      ${card('En ventas',mon(m.vta_inversion,2),[m.vta_inversion,ma.vta_inversion],2)}
      ${card('Total',mon(Number(m.ig_inversion||0)+Number(m.vta_inversion||0),2),null,2,true)}
    </div>`;
  }

  if(R.length>1){
    const conIG=hay('ig_followers_total');
    h+=`<h2>Historial</h2><p class="sub">Todos los reportes.</p>
      <details class="hist"><summary><span class="flecha">▶</span> Ver los ${R.length} reportes</summary><table>
      <tr><th>Período</th>${conIG?'<th>Seguidores</th>':''}<th>Ventas</th>${hay('vta_ingreso')?'<th>Facturación</th>':''}<th>Costo x venta</th>${hay('vta_roas')?'<th>ROAS</th>':''}<th>Inversión</th></tr>
      ${R.slice().reverse().map(r=>{const x=r.metricas;return `<tr><td>${fecha(r.desde)} al ${fecha(r.hasta)}</td>
        ${conIG?`<td>${fmt(x.ig_followers_total)}</td>`:''}
        <td><b>${fmt(x.vta_ventas)}</b></td>
        ${hay('vta_ingreso')?`<td>${fmt(x.vta_ingreso)}</td>`:''}
        <td>${fmt(x.vta_costo_venta,2)}</td>
        ${hay('vta_roas')?`<td>${fmt(x.vta_roas,2)}</td>`:''}
        <td>${fmt(Number(x.ig_inversion||0)+Number(x.vta_inversion||0),2)}</td></tr>`}).join('')}
      </table></details>`;
  }
  return h;
}

function pintarMixto(d){

      h+=grafico('Visitas al canal','Gente que llegó a YouTube desde los anuncios.',R.map(r=>r.metricas.ytad_visitas??null),et,'#7A1F3A');
  }

  // --- segunda cuenta de Instagram del mismo cliente (prefijo ed_), agrupada con su campaña de mensajes ---

function pintarMensajes(d){
  MON=(d.cliente.moneda||'USD');
  const R=d.reportes||[];
  const u=R[R.length-1]||null, a=R.length>1?R[R.length-2]:null;
  const ultimo=(k)=>{ for(let i=R.length-1;i>=0;i--){ const x=R[i].metricas[k]; if(x!=null) return x; } return null; };
  const previo=(k)=>{ let visto=false; for(let i=R.length-1;i>=0;i--){ const x=R[i].metricas[k]; if(x!=null){ if(visto) return x; visto=true; } } return null; };
  const m=new Proxy({},{get:(_,k)=>ultimo(k)}), ma=new Proxy({},{get:(_,k)=>previo(k)});
  const et=R.map(r=>fecha(r.hasta));
  // Famosos esta dentro de Calificadas: no se suma para no contarlo dos veces
  const tot=x=>(Number(x.ej_mensajes||0)+Number(x.cal_mensajes||0)+Number(x.esp_mensajes||0));
  const inv=x=>(Number(x.ej_inversion||0)+Number(x.cal_inversion||0)+Number(x.esp_inversion||0));

  let h=`<h1>${d.cliente.nombre}</h1>
    <p class="periodo">${u?`${fecha(u.desde)} al ${fecha(u.hasta)}`:'Sin reportes cargados'}</p>`;

  h+=`<h2>El período</h2><p class="sub">Lo que trajeron las campañas.</p><div class="tarj">
    ${card('Mensajes totales', fmt(tot(m)), [tot(m), a?tot(ma):null],0,true)}
    ${card('Invertido', mon(inv(m),2), [inv(m), a?inv(ma):null],2)}
    ${card('Costo por mensaje', mon(inv(m)/(tot(m)||1),2), [inv(m)/(tot(m)||1), a?inv(ma)/(tot(ma)||1):null],2,false,true)}
    ${card('Personas alcanzadas', fmt(Number(m.ej_alcance||0)+Number(m.cal_alcance||0)+Number(m.esp_alcance||0)), null)}
  </div>`;

  h+=multiCamp(R,et);
  h+=grafico('Costo por mensaje','Cuánto cuesta cada consulta. Mientras más baja la línea, mejor.',R.map(r=>{const x=r.metricas;return Math.round(inv(x)/(tot(x)||1)*100)/100;}),et,'#87863A',true);

  h+=`<h2>Cada campaña</h2><p class="sub">Cómo rindió cada una en este período.</p>`;
  CAMPS.forEach(c=>{
    const men=m[c.p+'_mensajes'], costo=m[c.p+'_costo_mensaje'], alc=m[c.p+'_alcance'], invc=m[c.p+'_inversion'];
    if(men==null && invc==null) return;
    const titulo = (c.p==='esp' && m.esp_nombre) ? m.esp_nombre : c.tit;
    h+=`<div class="camp ${c.dest?'destacada':''} ${c.dentro?'dentro':''}"><h3>${titulo}</h3><p class="que">${c.que}</p>
      <div class="nums">
        <div class="n"><div class="l">Mensajes</div><div class="v">${fmt(men)}</div><div class="d">${delta(men, ma[c.p+'_mensajes'])||''}</div></div>
        <div class="n"><div class="l">Costo x mensaje</div><div class="v">${fmt(costo,2)}</div><div class="d">USD</div></div>
        <div class="n"><div class="l">Alcance</div><div class="v">${fmt(alc)}</div><div class="d">personas</div></div>
        <div class="n"><div class="l">Invertido</div><div class="v">${fmt(invc,0)}</div><div class="d">USD · ${fmt(m[c.p+'_inv_diaria'])} por día</div></div>
      </div>
      <div class="zona"><span>PBA <b>${fmt(m[c.p+'_pba'])}</b></span><span>·</span><span>CABA <b>${fmt(m[c.p+'_caba'])}</b></span></div>
    </div>`;
  });

  if(R.length>1){
    h+=`<h2>Historial</h2><p class="sub">Todos los reportes.</p>
      <details class="hist"><summary><span class="flecha">▶</span> Ver los ${R.length} reportes</summary><table>
      <tr><th>Período</th><th>Ejecutivo</th><th>Calificadas</th><th>de esas, Famosos</th><th>Total</th><th>Costo x mje.</th><th>Inversión</th></tr>
      ${R.slice().reverse().map(r=>{const x=r.metricas;return `<tr><td>${fecha(r.desde)} al ${fecha(r.hasta)}</td>
        <td>${fmt(x.ej_mensajes)}</td><td>${fmt(x.cal_mensajes)}</td><td>${fmt(x.fam_mensajes)}</td>
        <td><b>${fmt(tot(x))}</b></td><td>${fmt(inv(x)/(tot(x)||1),2)}</td><td>${fmt(inv(x),2)}</td></tr>`}).join('')}
      </table></details>`;
  }
  return h;
}

  h+=`<h2>Instagram</h2><p class="sub">Crecimiento y costo de la pauta.</p><div class="tarj">
    ${card('Seguidores', fmt(m.ig_followers_total), [m.ig_followers_total, ma.ig_followers_total])}
    ${card('Nuevos en el período', fmt(m.ig_followers_nuevos), [m.ig_followers_nuevos, ma.ig_followers_nuevos])}
    ${card('Visitas al perfil', fmt(m.ig_visitas), [m.ig_visitas, ma.ig_visitas])}
    ${convIG(R)}
    ${card('Costo por seguidor', mon(m.ig_costo_follower,2), [m.ig_costo_follower, ma.ig_costo_follower],2,true,true)}
  </div>`;
  h+=conjIG(u);
  h+=grafico('Seguidores','Cómo viene creciendo la cuenta.',R.map(r=>r.metricas.ig_followers_total),et,'#7A1F3A');
  h+=grafico('Costo por seguidor','Mientras más baja la línea, mejor: cada seguidor nuevo te sale menos.',R.map(r=>r.metricas.ig_costo_follower),et,'#1A2456',true);

  if(hay('sp_oyentes_perfil')||hay('sp_listeners')||hay('sp_monthly')||hay('sp_streams')||hay('sp_followers')){
    h+=`<h2>Spotify</h2><p class="sub">Los mismos números que ves en Spotify for Artists, últimos 7 días.</p>`;
    if(hay('sp_oyentes_perfil')) h+=`<div class="tarj">${card('Oyentes mensuales', fmt(m.sp_oyentes_perfil), [m.sp_oyentes_perfil, ma.sp_oyentes_perfil],0,true)}</div>
      <p class="sub" style="margin-top:9px">Es el número que aparece en tu perfil público de Spotify.</p>`;
    const tS=[
      hay('sp_listeners')?card('Oyentes', fmt(m.sp_listeners), [m.sp_listeners, ma.sp_listeners]):'',
      hay('sp_monthly')?card('Oyentes mensuales activos', fmt(m.sp_monthly), [m.sp_monthly, ma.sp_monthly]):'',
      hay('sp_superlisteners')?card('Superlisteners', fmt(m.sp_superlisteners), [m.sp_superlisteners, ma.sp_superlisteners]):'',
      hay('sp_streams')?card('Streams', fmt(m.sp_streams), [m.sp_streams, ma.sp_streams]):'',
      hay('sp_stream_listener')?card('Streams por oyente', fmt(m.sp_stream_listener,1), [m.sp_stream_listener, ma.sp_stream_listener],1):'',
      hay('sp_guardados')?card('Guardados', fmt(m.sp_guardados), [m.sp_guardados, ma.sp_guardados]):'',
      hay('sp_playlists')?card('Agregados a playlists', fmt(m.sp_playlists), [m.sp_playlists, ma.sp_playlists]):'',
      hay('sp_followers')?card('Seguidores', fmt(m.sp_followers), [m.sp_followers, ma.sp_followers]):''
    ].join('');
    if(tS) h+=`<div class="tarj">${tS}</div>`;
    if(hay('sp_oyentes_perfil'))
      h+=grafico('Oyentes mensuales','Los que muestra tu perfil público de Spotify. Es el número que mira la industria.',R.map(r=>r.metricas.sp_oyentes_perfil??null),et,'#87863A');
    if(R.filter(r=>r.metricas.sp_streams!=null).length>1)
      h+=grafico('Streams','Cuántas veces se escucharon tus temas en cada período.',R.map(r=>r.metricas.sp_streams??null),et,'#1A2456');
  }

  // campaña de Meta que lleva gente a Spotify
  if(hay('spad_inversion')){
    h+=`<h2>Campaña a Spotify</h2><p class="sub">Anuncios en Meta que llevan gente a escucharte.</p><div class="tarj">
      ${hay('spad_visitas')?card('Llegaron a Spotify', fmt(m.spad_visitas), [m.spad_visitas, ma.spad_visitas],0,true):''}
      ${hay('spad_costo_visita')?card('Costo por visita', mon(m.spad_costo_visita,2), [m.spad_costo_visita, ma.spad_costo_visita],2,false,true):''}
      ${card('Invertido', mon(m.spad_inversion,2), [m.spad_inversion, ma.spad_inversion],2)}
      ${hay('spad_alcance')?card('Personas alcanzadas', fmt(m.spad_alcance), [m.spad_alcance, ma.spad_alcance]):''}
    </div>`;
  }

  const escY=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  const uvY=[...R].reverse().find(r=>r.metricas.yt_v1_nombre);
  const vidsY=uvY?[1,2,3,4,5].map(i=>({n:uvY.metricas['yt_v'+i+'_nombre'],v:uvY.metricas['yt_v'+i+'_views']})).filter(x=>x.n):[];
  if(hay('yt_views')||hay('yt_subs')||hay('yt_horas')||vidsY.length){
    h+=`<h2>YouTube</h2><p class="sub">Tu canal: gente que llegó y se quedó.</p>`;
    const tY=[
      hay('yt_subs')?card('Suscriptores', fmt(m.yt_subs), [m.yt_subs, ma.yt_subs]):'',
      hay('yt_subs_nuevos')?card('Nuevos en el período', fmt(m.yt_subs_nuevos), [m.yt_subs_nuevos, ma.yt_subs_nuevos]):'',
      hay('yt_views')?card('Visualizaciones del canal', fmt(m.yt_views), [m.yt_views, ma.yt_views],0,true):'',
      hay('yt_horas')?card('Horas vistas', fmt(m.yt_horas), [m.yt_horas, ma.yt_horas]):''
    ].join('');
    if(tY) h+=`<div class="tarj">${tY}</div>`;
    if(vidsY.length){
      h+=`<div class="desglose"><h3>Principales videos</h3>
        <p class="leyenda">${uvY.metricas.yt_top_texto?escY(uvY.metricas.yt_top_texto):`Los videos más vistos del canal en el período ${fecha(uvY.desde)} al ${fecha(uvY.hasta)}.`}</p>
        <div class="fila2 cab2"><span>Video</span><span></span><span style="text-align:right">Views</span></div>
        ${vidsY.map(x=>`<div class="fila2"><span class="nom">${escY(x.n)}</span><span></span><span class="v">${x.v!=null?fmt(x.v):''}</span></div>`).join('')}
      </div>`;
    }
    if(R.filter(r=>r.metricas.yt_views!=null).length>1)
      h+=grafico('Visualizaciones','Cuántas veces se vieron tus videos.',R.map(r=>r.metricas.yt_views),et,'#E2767C');
  }
  if(hay('yt_views_ads')||hay('yt_inversion')){
    h+=`<h2>Campaña en YouTube Ads</h2><p class="sub">Anuncios dentro de YouTube. Son visualizaciones del anuncio, no del canal.</p><div class="tarj">
      ${hay('yt_views_ads')?card('Views del anuncio', fmt(m.yt_views_ads), [m.yt_views_ads, ma.yt_views_ads],0,true):''}
      ${hay('yt_costo_view')?card('Costo por view', mon(m.yt_costo_view,4), [m.yt_costo_view, ma.yt_costo_view],4,false,true):''}
      ${hay('yt_ads_impresiones')?card('Impresiones', fmt(m.yt_ads_impresiones), [m.yt_ads_impresiones, ma.yt_ads_impresiones]):''}
      ${hay('yt_inversion')?card('Invertido', mon(m.yt_inversion,2), [m.yt_inversion, ma.yt_inversion],2):''}
      ${hay('yt_ads_alcance')?card('Personas alcanzadas', fmt(m.yt_ads_alcance), [m.yt_ads_alcance, ma.yt_ads_alcance]):''}
      ${hay('yt_ads_subs')?card('Suscriptores que trajo', fmt(m.yt_ads_subs), [m.yt_ads_subs, ma.yt_ads_subs]):''}
    </div>`;
    if(R.filter(r=>r.metricas.yt_views_ads!=null).length>1)
      h+=grafico('Views del anuncio','Cuánta gente vio el anuncio en cada período.',R.map(r=>r.metricas.yt_views_ads),et,'#7A1F3A');
  }

  const hayLan = R.some(r=>r.metricas.lan_visitas!=null);
  if(hayLan){
    h+=`<h2>Lanzamiento</h2><p class="sub">La campaña que lleva gente a escuchar el tema.</p><div class="tarj">
      ${card('Visitas a la página', fmt(m.lan_visitas), [m.lan_visitas, ma.lan_visitas],0,true)}
      ${card('Costo por visita', mon(m.lan_costo_visita,2), [m.lan_costo_visita, ma.lan_costo_visita],2,false,true)}
      ${card('Invertido', mon(m.lan_inversion,2), [m.lan_inversion, ma.lan_inversion],2)}
      ${m.lan_hypeddit!=null?card('Visitas en Hypeddit', fmt(m.lan_hypeddit), [m.lan_hypeddit, ma.lan_hypeddit]):''}
      ${m.lan_hypeddit_clics!=null?card('Clics en Hypeddit', fmt(m.lan_hypeddit_clics), [m.lan_hypeddit_clics, ma.lan_hypeddit_clics]):''}
      ${m.lan_hypeddit_eng!=null?card('Interacción en Hypeddit', fmt(m.lan_hypeddit_eng,2)+'%', [m.lan_hypeddit_eng, ma.lan_hypeddit_eng],2):''}
      ${m.lan_clics!=null?card('Clics al link', fmt(m.lan_clics), [m.lan_clics, ma.lan_clics]):''}
    </div>`;
    h+=grafico('Visitas a la página del lanzamiento','Cuánta gente llegó a escuchar.',R.map(r=>r.metricas.lan_visitas),et,'#E2767C');
  }

  const plataformas=[hay('ig_followers_total'),hay('sp_monthly')||hay('sp_oyentes_perfil'),hay('yt_views')].filter(Boolean).length;
  if(plataformas>1) h+=`<h2>Crecimiento</h2><p class="sub">Las plataformas juntas.</p>`+multi(R);

  {
    const cu=u?u.metricas:{}, ca=a?a.metricas:{};
    const tot=Number(cu.ig_inversion||0)+Number(cu.sp_inversion||0)+Number(cu.yt_inversion||0);
    if(tot>0){
      h+=`<h2>Inversión</h2><p class="sub">Lo que se puso en pauta en este período.</p><div class="tarj">
        ${cu.ig_inversion!=null?card('En Instagram',mon(cu.ig_inversion,2),[cu.ig_inversion,ca.ig_inversion],2):''}
        ${cu.sp_inversion!=null?card('En Spotify',mon(cu.sp_inversion,2),[cu.sp_inversion,ca.sp_inversion],2):''}
        ${cu.yt_inversion!=null?card('En YouTube',mon(cu.yt_inversion,2),[cu.yt_inversion,ca.yt_inversion],2):''}
        ${cu.ig_inversion_diaria!=null?card('Por día en Instagram',mon(cu.ig_inversion_diaria,2),[cu.ig_inversion_diaria,ca.ig_inversion_diaria],2):''}
        ${card('Total del período',mon(tot,2),null,2,true)}
      </div>`;
    }
  }

  if(R.length>1){
    h+=`<h2>Historial</h2><p class="sub">Todos los reportes.</p>
      <details class="hist"><summary><span class="flecha">▶</span> Ver los ${R.length} reportes</summary><table>
      <tr><th>Período</th><th>Seguidores IG</th><th>Nuevos</th><th>Costo x seg.</th>${hay('sp_streams')?'<th>Streams</th>':''}${hay('sp_costo_stream')?'<th>Costo x stream</th>':''}<th>Inversión</th></tr>
      ${R.slice().reverse().map(r=>{const x=r.metricas;return `<tr><td>${fecha(r.desde)} al ${fecha(r.hasta)}</td>
        <td>${fmt(x.ig_followers_total)}</td><td>${fmt(x.ig_followers_nuevos)}</td><td>${fmt(x.ig_costo_follower,2)}</td>
        ${hay('sp_streams')?`<td>${fmt(x.sp_streams)}</td>`:''}${hay('sp_costo_stream')?`<td>${fmt(x.sp_costo_stream,3)}</td>`:''}<td>${fmt((x.ig_inversion||0)+(x.sp_inversion||0)+(x.yt_inversion||0),2)}</td></tr>`}).join('')}
    </table></details>`;
  }

  return pintarResto(d,h);
}

function pintarResto(d,h){
  const R=d.reportes||[]; const u=R[R.length-1]||null; const m=u?u.metricas:{};
  const NOMBRES={ig_followers_total:'Seguidores en Instagram',ig_followers_nuevos:'Seguidores nuevos por período',
    ig_visitas:'Visitas al perfil',sp_monthly:'Oyentes mensuales activos en Spotify',sp_oyentes_perfil:'Oyentes mensuales en Spotify (perfil)',sp_superlisteners:'Superlisteners en Spotify',sp_streams:'Streams',
    sp_followers:'Seguidores en Spotify',sp_playlists:'Playlists',yt_views:'Visualizaciones en YouTube',
    yt_subs:'Suscriptores en YouTube',msj_mensajes:'Consultas por período',msj_conversiones:'Ventas por período',
    msj_ingreso:'Ingreso por período',msj_roas:'ROAS',vta_ventas:'Ventas por período',
    tk_tickets:'Ventas de la obra',int_interacciones:'Interacciones',
    cal_mensajes:'Mensajes Calificadas',ej_mensajes:'Mensajes Ejecutivo',total_mensajes:'Mensajes totales'};
  const disponibles=[...new Set(R.flatMap(r=>Object.keys(r.metricas||{})))].filter(k=>NOMBRES[k]);

  const HI=d.hitos||[];
  {
    h+=`<h2>Hitos</h2><p class="sub">Las metas que nos pusimos para este proyecto. Podés sumar las tuyas.</p>`;
    HI.forEach(x=>{
      const obj=Number(x.objetivo)||1;
      // valor actual: si es un total calculado, lo sumamos
      let act;
      if(x.metrica==='total_mensajes') act=Number(m.ej_mensajes||0)+Number(m.cal_mensajes||0)+Number(m.esp_mensajes||0);
      else act=Number(m[x.metrica]||0);
      const menosEsMejor=/costo|cac/i.test(x.metrica);
      const dec = /costo/i.test(x.metrica) ? 2 : 0;
      if(menosEsMejor){
        const listo = act>0 && act<=obj;
        const pct = act>0 ? Math.min(100, Math.round(obj/act*100)) : 0;
        h+=`<div class="hito ${listo?'logrado':''}"><div class="tt">${x.titulo||x.metrica}</div>
          <div class="num">${act>0?`Hoy estás en ${fmt(act,dec)} · la meta es ${fmt(obj,dec)} o menos`:'Todavía sin datos'}</div>
          <div class="barra"><i style="width:${pct}%"></i></div>
          <div class="falta">${listo?'¡Logrado!':(act>0?`Te falta bajar ${fmt(act-obj,dec)}`:'')}</div>
          <button class="x" data-delh="${x.id}" title="Borrar">×</button></div>`;
      } else {
        const listo=act>=obj;
        const pct=Math.min(100,Math.round(act/obj*100));
        h+=`<div class="hito ${listo?'logrado':''}"><div class="tt">${x.titulo||x.metrica}</div>
          <div class="num">${fmt(act,dec)} de ${fmt(obj,dec)}</div>
          <div class="barra"><i style="width:${pct}%"></i></div>
          <div class="falta">${listo?'¡Logrado!':`${pct}% · faltan ${fmt(obj-act,dec)}`}</div>
          <button class="x" data-delh="${x.id}" title="Borrar">×</button></div>`;
      }
    });
    if(disponibles.length){
      h+=`<div class="nuevoHito">
        <select id="h_met2">${disponibles.map(k=>`<option value="${k}">${NOMBRES[k]}</option>`).join('')}</select>
        <input id="h_obj2" inputmode="decimal" placeholder="A qué número querés llegar">
        <input id="h_tit2" placeholder="Cómo querés llamarlo (opcional)">
        <button id="h_add2">Agregar hito</button>
      </div>`;
    }
  }

  const VL=d.ventas_log||[];
  if(d.cliente.ventas_log_on||VL.length){
    const escV=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
    const monV=v=>v==null?'':((d.cliente.moneda||'USD')==='ARS'?'$ ':'USD ')+Number(v).toLocaleString('es-AR',{maximumFractionDigits:2});
    const fV=f=>{const p=String(f).split('-');return p[2]+'/'+p[1];};
    const totV=VL.reduce((s,x)=>s+Number(x.monto||0),0);
    const hoyV=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
    h+=`<h2>Ventas</h2><p class="sub">Cada venta, anotada. Sumá las nuevas acá abajo.</p>
    ${VL.length?`<p class="vtot"><b>${VL.length}</b> ${VL.length===1?'venta':'ventas'}${totV?` · <b>${monV(totV)}</b>`:''}</p>
      <div class="tar">${VL.map(x=>`<div class="it vl"><span class="vf">${fV(x.fecha)}</span><span class="tx"><span class="tt">${escV(x.detalle||'Venta')}</span></span><span class="vm">${monV(x.monto)}</span><button class="x" data-delv="${x.id}" title="Borrar">×</button></div>`).join('')}</div>`
      :'<p class="pista">Todavía no hay ventas anotadas. Sumá la primera acá abajo.</p>'}
    <div class="agregarV"><input id="v_fecha" type="date" value="${hoyV}"><input id="v_det" placeholder="Qué se vendió (y a quién, si querés)"><input id="v_monto" inputmode="decimal" placeholder="Monto"><button id="v_add">Agregar</button></div>`;
  }

  const T=d.tareas||[];
  {
    h+=`<h2>Tarea para el hogar</h2><p class="sub">Lo que ya está hecho y lo que sigue.</p>
    ${T.length?'':'<p class="pista">Todavía no hay tareas. Sumá la primera acá abajo.</p>'}<div class="tar">
      ${T.map(t=>`<div class="it ${t.estado}"><span class="mark ${t.estado}" data-tid="${t.id}" data-est="${t.estado}"></span><span class="tx" data-tid2="${t.id}" data-est2="${t.estado}"><span class="tt">${t.titulo}</span>${t.detalle?`<span class="de">${t.detalle}</span>`:''}</span><button class="x" data-delt="${t.id}" title="Borrar">×</button></div>`).join('')}
    </div>
    <div class="agregarT"><input id="t_nueva" placeholder="Agregar algo que quieras hacer o pedirnos"><button id="t_add">Agregar</button></div>
    <p class="pista">Tocá una tarea para cambiarle el estado: pendiente, en curso o hecha. La × la borra.</p>`;
  }

  const A=d.activos||[];
  {
    h+=`<h2>Tus activos</h2><p class="sub">Tus enlaces a mano: carpetas, materiales, links importantes. Podés sumar los tuyos.</p>
    ${A.length?'':'<p class="pista">Todavía no hay enlaces. Pegá el primero acá abajo.</p>'}<div class="act">
      ${A.map(x=>x.url?`<a class="a" href="${x.url}" target="_blank"><span class="tt">${x.titulo}</span><div class="de">${x.descripcion||''}</div><div class="go">Abrir →</div><button class="x" data-dela="${x.id}" title="Borrar">×</button></a>`
        :`<div class="a sinlink"><span class="tt">${x.titulo}</span><div class="de">${x.descripcion||''}</div><div class="go">En preparación</div><button class="x" data-dela="${x.id}" title="Borrar">×</button></div>`).join('')}
    </div>
    <div class="nuevoAct">
      <input id="a_tit" placeholder="Nombre del activo. Por ejemplo: Mi carpeta de fotos">
      <input id="a_url" placeholder="Pegá el link (opcional)">
      <button id="a_add">Agregar activo</button>
    </div>`;
  }

  const N=d.notas||[];
  h+=`<h2>Tus notas</h2><p class="sub">Dejanos cualquier cosa que quieras que tengamos en cuenta: una idea, una duda, algo que haya pasado en estos días.</p>
    <div class="notas"><textarea id="nota_txt" placeholder="Escribí acá…"></textarea><br><button id="nota_btn">Guardar nota</button><div id="nota_out"></div>
    ${N.map(n=>`<div class="nota"><div class="quien ${n.autor==='semilla'?'semilla':''}">${n.autor==='semilla'?'Semilla Redes':'Vos'}</div><div class="txt">${n.texto}</div><div class="cuando">${new Date(n.fecha).toLocaleDateString('es-AR',{day:'numeric',month:'long'})}</div><button class="x" data-deln="${n.id}" title="Borrar nota">×</button></div>`).join('')}
    </div>`;

  const RC=d.recomendaciones&&d.recomendaciones.recomendaciones;
  if(RC&&RC.length){
    h+=`<h2>Consejos de la Inteligencia colectiva</h2><p class="sub">Surgen de la experiencia de otros artistas de la comunidad y los procesa una inteligencia artificial entrenada en el Método Semilla. Todos los domingos el bot te manda nuevas recomendaciones.</p>
      <div class="reco">
        <div class="cab"><h3>Tres cosas para arrancar</h3>
        ${d.recomendaciones_fecha?`<span class="cuando">${new Date(d.recomendaciones_fecha).toLocaleDateString('es-AR',{day:'numeric',month:'long'})}</span>`:''}</div>
        <div class="items">
          ${RC.slice(0,3).map((r,i)=>`<div class="it2"><span class="num">${i+1}</span>
            <span><span class="tt">${r.titulo||''}</span><span class="tx">${r.texto||''}</span></span></div>`).join('')}
        </div>
        <p class="pie2">Se actualiza todos los domingos. Cualquier duda, hablamos en la reunión.</p>
      </div>`;
  }

  h+=`<p class="pie">Cualquier duda sobre estos números, escribile a Agus.</p>`;
  // las alertas se ven solo en el panel de Agus, no en la pagina del cliente
  $('app').innerHTML=h;
  $('cargando').classList.add('oculto'); $('app').classList.remove('oculto');
  armarIndice();   // despues de mostrar la pagina: oculta, todo mide cero

  const ciclo={pendiente:'en_curso',en_curso:'hecha',hecha:'pendiente'};
  const cambiar=async(id,est,fila)=>{
    const nuevo=ciclo[est]||'pendiente';
    const r=await rpc('sub_tarea_cliente',{p_slug:slug,p_k:tok,p_id:id,p_estado:nuevo});
    if(r.ok) recargar();
  };
  document.querySelectorAll('[data-tid]').forEach(el=>el.onclick=e=>{e.stopPropagation();cambiar(el.dataset.tid,el.dataset.est);});
  document.querySelectorAll('[data-tid2]').forEach(el=>el.onclick=e=>{e.stopPropagation();cambiar(el.dataset.tid2,el.dataset.est2);});
  document.querySelectorAll('[data-delt]').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    if(!confirm('¿Borrar esta tarea?')) return;
    const r=await rpc('sub_tarea_borrar',{p_slug:slug,p_k:tok,p_id:b.dataset.delt}); if(r.ok) recargar();
  });
  document.querySelectorAll('[data-deln]').forEach(b=>b.onclick=async()=>{
    if(!confirm('¿Borrar esta nota?')) return;
    const r=await rpc('sub_nota_borrar',{p_slug:slug,p_k:tok,p_id:b.dataset.deln}); if(r.ok) recargar();
  });
  document.querySelectorAll('[data-delh]').forEach(b=>b.onclick=async e=>{
    e.preventDefault(); e.stopPropagation();
    if(!confirm('¿Borrar este hito?')) return;
    const r=await rpc('sub_hito_cliente_borrar',{p_slug:slug,p_k:tok,p_id:b.dataset.delh});
    if(r.ok) recargar();
  });
  const ha=$('h_add2');
  if(ha) ha.onclick=async()=>{
    const met=$('h_met2').value;
    const obj=parseFloat(($('h_obj2').value||'').replace(/[^\d.,]/g,'').replace(',','.'));
    if(!obj){ alert('Poné a qué número querés llegar'); return; }
    ha.disabled=true; ha.textContent='…';
    const r=await rpc('sub_hito_cliente_alta',{p_slug:slug,p_k:tok,p_metrica:met,p_objetivo:obj,p_titulo:$('h_tit2').value.trim()||null});
    if(r.ok) recargar(); else { ha.disabled=false; ha.textContent='Agregar hito'; alert(r.error==='demasiados'?'Ya tenés 8 hitos, borrá alguno primero.':'No se pudo agregar'); }
  };
  document.querySelectorAll('[data-dela]').forEach(b=>b.onclick=async e=>{
    e.preventDefault(); e.stopPropagation();
    if(!confirm('¿Borrar este activo?')) return;
    const r=await rpc('sub_activo_cliente_borrar',{p_slug:slug,p_k:tok,p_id:b.dataset.dela});
    if(r.ok) recargar();
  });
  const aa=$('a_add');
  if(aa) aa.onclick=async()=>{
    const t=$('a_tit').value.trim(); if(!t) return;
    aa.disabled=true; aa.textContent='…';
    const r=await rpc('sub_activo_cliente_alta',{p_slug:slug,p_k:tok,p_titulo:t,p_url:$('a_url').value.trim()||null});
    if(r.ok) recargar(); else { aa.disabled=false; aa.textContent='Agregar activo'; }
  };
  const va=$('v_add');
  if(va) va.onclick=async()=>{
    const det=$('v_det').value.trim(), mt=$('v_monto').value.trim().replace(/\./g,'').replace(',','.');
    if(!det&&!mt) return;
    va.disabled=true; va.textContent='…';
    const r=await rpc('sub_vlog_alta',{p_slug:slug,p_k:tok,p_fecha:$('v_fecha').value||null,p_detalle:det,p_monto:mt===''?null:Number(mt)});
    if(r.ok) recargar(); else { va.disabled=false; va.textContent='Agregar'; }
  };
  document.querySelectorAll('[data-delv]').forEach(b=>b.onclick=async()=>{
    if(!confirm('¿Borrar esta venta?')) return;
    const r=await rpc('sub_vlog_borrar',{p_slug:slug,p_k:tok,p_id:b.dataset.delv}); if(r.ok) recargar();
  });
  const ta=$('t_add');
  if(ta) ta.onclick=async()=>{
    const t=$('t_nueva').value.trim(); if(!t) return;
    ta.disabled=true; ta.textContent='…';
    const r=await rpc('sub_tarea_cliente_alta',{p_slug:slug,p_k:tok,p_titulo:t});
    if(r.ok) recargar(); else { ta.disabled=false; ta.textContent='Agregar'; }
  };
  const nb=$('nota_btn');
  if(nb) nb.onclick=async()=>{
    const t=$('nota_txt').value.trim(); if(!t) return;
    nb.disabled=true; nb.textContent='Guardando…';
    const r=await rpc('sub_nota_alta',{p_slug:slug,p_k:tok,p_texto:t});
    if(r.ok){ $('nota_txt').value=''; recargar(); }
    else { $('nota_out').innerHTML='<p class="pista">No se pudo guardar, probá de nuevo.</p>'; nb.disabled=false; nb.textContent='Guardar nota'; }
  };
}

function recargar(){ rpc('sub_get',{p_slug:slug,p_k:tok}).then(pintar); }

rpc('sub_get',{p_slug:slug,p_k:tok}).then(d=>{
  if(d.error){ $('cargando').classList.add('oculto'); $('error').classList.remove('oculto'); return; }
  pintar(d);
}).catch(()=>{ $('cargando').classList.add('oculto'); $('error').classList.remove('oculto'); });

function armarIndice(){
  const app=$('app'); if(!app) return;
  const viejo=app.querySelector('.indice'); if(viejo) viejo.remove();
  app.querySelectorAll('h2 .volver').forEach(x=>x.remove());
  const hs=[...app.querySelectorAll('h2')];
  if(hs.length<3) return;
  const corto={'Consejos de la Inteligencia colectiva':'Consejos','Tarea para el hogar':'Tareas','Ventas':'Ventas','Tus activos':'Activos','Tus notas':'Notas'};
  const nav=document.createElement('nav'); nav.className='indice'; nav.id='indice'; nav.setAttribute('aria-label','Secciones');
  nav.innerHTML='<div class="fila">'+hs.map((h,i)=>{
    const t=h.textContent.trim(); h.id='sec-'+i;
    return `<a href="#sec-${i}" data-i="${i}">${corto[t]||t}</a>`;
  }).join('')+'</div>';
  const primero=app.querySelector('.periodo')||app.querySelector('h1');
  const sig=primero && primero.nextElementSibling;
  const ancla=(sig && sig.classList.contains('avisoActualiza')) ? sig : primero;
  if(ancla) ancla.after(nav); else app.prepend(nav);
  nav.querySelectorAll('a').forEach(a=>a.onclick=e=>{
    e.preventDefault();
    const y=hs[+a.dataset.i].getBoundingClientRect().top+window.scrollY-14;
    window.scrollTo({top:Math.max(0,y),behavior:'smooth'});
  });
  // en cada seccion, un volver arriba
  hs.forEach(h=>{
    const v=document.createElement('a'); v.className='volver'; v.href='#indice'; v.textContent='↑ Arriba';
    v.onclick=e=>{ e.preventDefault(); window.scrollTo({top:0,behavior:'smooth'}); };
    h.appendChild(v);
  });
}

function bloqueVentas(d, campania, invTotal){
  const v=(d.cliente.ventas||{})[campania];
  const ing=v?Number(v.ingreso):null, nv=v?Number(v.ventas||0):null;
  const roas=(ing!=null&&invTotal>0)?ing/invTotal:null;
  const cpv=(nv&&invTotal>0)?invTotal/nv:null;
  const nums = v ? `<div class="nums">
      <div class="n"><div class="l">Facturado</div><div class="v">${fmt(ing,0)}</div><div class="d">${MON}</div></div>
      <div class="n"><div class="l">Ventas</div><div class="v">${fmt(nv,0)}</div><div class="d">&nbsp;</div></div>
      <div class="n"><div class="l">ROAS</div><div class="v roas ${roas>=1?'bien':'mal'}">${roas!=null?fmt(roas,2):'—'}</div><div class="d">por cada peso invertido</div></div>
      ${cpv?`<div class="n"><div class="l">Costo por venta</div><div class="v">${fmt(cpv,0)}</div><div class="d">${MON}</div></div>`:''}
      <div class="n"><div class="l">Invertido total</div><div class="v">${fmt(invTotal,0)}</div><div class="d">${MON}</div></div>
    </div>` : '';
  const fecha_act = v&&v.actualizado ? new Date(v.actualizado).toLocaleDateString('es-AR',{day:'numeric',month:'long'}) : '';
  return `<div class="camp ventaBox"><h3>Lo que facturó la campaña</h3>
    <p class="que">Cargá cuánto llevás vendido con esta campaña y el ROAS se calcula solo.</p>
    ${nums}
    ${fecha_act?`<div class="act">Última carga: ${fecha_act}</div>`:''}
    <div class="formv">
      <div><label>Facturado en ${MON}</label><input type="text" inputmode="decimal" data-vi="${campania}" placeholder="${ing!=null?fmt(ing,0):'Ej: 250.000'}"></div>
      <div><label>Ventas</label><input type="text" inputmode="numeric" data-vn="${campania}" placeholder="${nv!=null?nv:'Ej: 3'}" style="width:90px"></div>
      <button data-vguardar="${campania}">Guardar</button>
    </div>
  </div>`;
}
document.addEventListener('click', async e=>{
  const b=e.target.closest('[data-vguardar]'); if(!b) return;
  const camp=b.dataset.vguardar;
  const limpia=x=>{ x=(x||'').trim().replace(/[^\d.,]/g,''); if(!x) return null;
    if(x.includes(',')) x=x.replace(/\./g,'').replace(',','.'); else x=x.replace(/\./g,''); const n=parseFloat(x); return isNaN(n)?null:n; };
  const ing=limpia(document.querySelector(`[data-vi="${camp}"]`).value);
  const nv=limpia(document.querySelector(`[data-vn="${camp}"]`).value);
  if(ing==null){ alert('Poné cuánto facturaste'); return; }
  b.disabled=true; b.textContent='Guardando…';
  const r=await rpc('sub_venta_cliente',{p_slug:slug,p_k:tok,p_campania:camp,p_ingreso:ing,p_ventas:nv==null?0:Math.round(nv)});
  if(r&&r.ok) rpc('sub_get',{p_slug:slug,p_k:tok}).then(pintar);
  else { b.disabled=false; b.textContent='Guardar'; alert('No se pudo guardar'); }
});

function graficoDia(dias, campo, titulo, leyenda, color, esPlata){
  const vals=dias.map(d=>Number(d[campo]||0));
  if(vals.filter(v=>v>0).length<2) return '';
  const W=560,H=180,P=32;
  const max=Math.max(...vals), min=0, rango=(max-min)||1;
  const X=i=>P+(i*(W-P*2)/Math.max(1,vals.length-1));
  const Y=v=>H-P-((v-min)/rango)*(H-P*2);
  let d='', area='';
  vals.forEach((v,i)=>{ d+=(d?' L ':'M ')+X(i)+' '+Y(v); });
  area=`${d} L ${X(vals.length-1)} ${H-P} L ${X(0)} ${H-P} Z`;
  const pts=vals.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="2.5" fill="${color}"/>`).join('');
  // etiqueto el maximo y el ultimo
  const iMax=vals.indexOf(max), iUlt=vals.length-1;
  const et=[iMax,iUlt].filter((v,i,a)=>a.indexOf(v)===i).map(i=>
    `<text x="${X(i)}" y="${Y(vals[i])-12}" font-size="15" font-weight="700" fill="${color}" text-anchor="middle">${esPlata?fmt(vals[i],2):fmt(vals[i])}</text>`).join('');
  // fechas: primera, mitad y ultima
  const dias_et=[0,Math.floor(vals.length/2),vals.length-1].filter((v,i,a)=>a.indexOf(v)===i)
    .map(i=>`<text x="${X(i)}" y="${H-8}" font-size="13" fill="#8A8697" text-anchor="${i===0?'start':(i===vals.length-1?'end':'middle')}">${dias[i].f.slice(8)}/${dias[i].f.slice(5,7)}</text>`).join('');
  return `<div class="graf"><h3>${titulo}</h3><p class="leyenda">${leyenda}</p>
    <svg class="linea" viewBox="0 0 ${W} ${H}">
      <path d="${area}" fill="${color}" opacity=".08"/>
      <path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
      ${pts}${et}${dias_et}</svg></div>`;
}

<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Artistas a seguir · SemillaIA</title>
<link rel="icon" type="image/png" href="/assets/favicon-semillaia.png">
<link rel="apple-touch-icon" href="/assets/icono-semillaia-180.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{--crema:#F6F1EA;--card:#FDFBF8;--linea:#ECE5DA;--navy:#1E2350;--vino:#7A1F3A;--oliva:#87863A;--salvia:#E9EADB;--rosa:#F5E3E8;--tinta:#1E2350;--mute:#5F5D6B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--crema);color:var(--tinta);font-family:"DM Sans",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.w{max-width:560px;margin:0 auto;padding:22px 16px 60px}
.cab{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.cab img{width:36px;height:36px;border-radius:10px;display:block}
.cab span{font-weight:700;font-size:21px;letter-spacing:-.5px;line-height:1}.cab b{color:var(--oliva)}
h1{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:34px;line-height:1.1;letter-spacing:-.8px;margin:0 0 12px}
.lede{font-size:17px;line-height:25px;color:#3A3848;margin:0 0 20px}
.cont{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px;font-size:14px;color:var(--mute)}
.cont b{color:var(--vino)}
.lista{background:var(--card);border:1px solid var(--linea);border-radius:20px;overflow:hidden}
.fila{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-top:1px solid var(--linea);cursor:pointer;user-select:none}
.fila:first-child{border-top:0}
.ck{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid #C9C1B4;background:#fff;display:grid;place-items:center;margin-top:-1px;transition:.15s}
.ck svg{width:15px;height:15px;opacity:0}
.fila.on .ck{background:var(--navy);border-color:var(--navy)}
.fila.on .ck svg{opacity:1}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:16.5px;line-height:22px}
.tx small{display:block;font-size:14px;line-height:20px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{flex:none;text-align:right;font-size:14px;line-height:22px;font-weight:700;color:var(--tinta)}
.num small{display:block;font-weight:400;font-size:12px;line-height:18px;color:var(--mute)}
.x{flex:none;width:28px;height:22px;border:0;background:none;color:var(--mute);font-size:20px;line-height:22px;cursor:pointer;padding:0}
h3{font-family:"Playfair Display",Georgia,serif;font-size:24px;line-height:1.2;margin:32px 0 12px}
.form{background:var(--card);border:1px solid var(--linea);border-radius:20px;padding:16px}
label{display:block;font-size:14px;font-weight:700;margin:0 0 6px}
input{width:100%;height:48px;border:1px solid #DDD5C8;border-radius:12px;background:#fff;padding:0 14px;font:16px "DM Sans",sans-serif;color:var(--tinta);margin-bottom:14px}
input:focus{outline:2px solid var(--navy);outline-offset:-1px}
.bt{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;border:0;background:var(--navy);color:#fff;font:700 16px "DM Sans",sans-serif;cursor:pointer}
.bt[disabled]{opacity:.5}
.msg{font-size:14px;line-height:20px;margin-top:10px;color:var(--vino);min-height:20px}
.msg.ok{color:#2F6B3A}
.nota{font-size:14px;line-height:21px;color:var(--mute);margin:12px 2px 0}
.err{background:var(--rosa);color:var(--vino);border-radius:14px;padding:14px 16px;font-weight:700}
.pie{margin-top:30px;font-size:13px;color:var(--mute);text-align:center}
</style>
</head>
<body>
<div class="w">
  <div class="cab"><img src="/assets/icono-semillaia-192.png" alt=""><span>semilla<b>IA</b></span></div>
  <h1>Artistas a seguir</h1>
  <p class="lede" id="lede">Marcá los artistas con los que querés compararte. Seguimos su crecimiento en Instagram cada semana y los ponemos al lado de tus números.</p>
  <div id="app"><div class="nota">Cargando…</div></div>
  <div class="pie">Semilla Redes</div>
</div>
<script>
const SB='https://fdrxsjphlvvwwknnrjtx.supabase.co/rest/v1/rpc/', KEY='sb_publishable_kT7McM9Dt7xP44IlFotsLA_8-b8q_17';
const Q=new URLSearchParams(location.search), C=Q.get('c')||'', K=Q.get('k')||'';
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const nf=n=>n==null?'':(n>=1e6?(n/1e6).toLocaleString('es-AR',{maximumFractionDigits:1})+' M':n>=1e3?Math.round(n/1e3).toLocaleString('es-AR')+' mil':String(n));
const CHK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
async function rpc(fn,a){ const r=await fetch(SB+fn,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(Object.assign({p_slug:C,p_k:K},a||{}))}); return r.json(); }
let A=[];
function pintar(){
  const on=A.filter(a=>a.activo).length;
  app.innerHTML=`<div class="cont"><span>${A.length} artistas</span><span><b>${on}</b> marcados</span></div>
  <div class="lista">${A.map((a,i)=>`<div class="fila${a.activo?' on':''}" data-i="${i}"><span class="ck">${CHK}</span><span class="tx"><b>${esc(a.nombre)}</b><small>${a.instagram?'@'+esc(a.instagram):(a.spotify?'Spotify':'Sin Instagram')}</small></span>${a.seguidores?`<span class="num">${nf(a.seguidores)}<small>seguidores</small></span>`:''}${a.origen==='cliente'?`<button class="x" data-b="${a.id}" aria-label="Quitar">×</button>`:''}</div>`).join('')}</div>
  <h3>Sumar un artista</h3>
  <div class="form"><label for="n">Nombre</label><input id="n" maxlength="80" placeholder="Ej.: Conociendo Rusia" autocomplete="off">
  <label for="ig">Instagram</label><input id="ig" maxlength="80" placeholder="@usuario o link del perfil" autocomplete="off" autocapitalize="off">
  <label for="sp">Spotify (opcional)</label><input id="sp" maxlength="200" placeholder="Link del artista en Spotify" autocomplete="off" autocapitalize="off">
  <button class="bt" id="add">Sumar a la lista</button><div class="msg" id="msg"></div></div>
  <p class="nota">Los cambios se guardan solos. Para comparar en Instagram necesitamos que la cuenta sea profesional (de artista o empresa).</p>`;
  app.querySelectorAll('.fila').forEach(f=>f.addEventListener('click',async e=>{
    if(e.target.closest('.x')) return; const a=A[+f.dataset.i]; a.activo=!a.activo; f.classList.toggle('on',a.activo);
    app.querySelector('.cont b').textContent=A.filter(x=>x.activo).length;
    const r=await rpc('seg_set',{p_nombre:a.nombre,p_activo:a.activo}).catch(()=>null);
    if(!r||!r.ok){ a.activo=!a.activo; pintar(); alerta('No se pudo guardar. Probá de nuevo.'); }
  }));
  app.querySelectorAll('.x').forEach(b=>b.addEventListener('click',async e=>{ e.stopPropagation(); await rpc('seg_borrar',{p_id:+b.dataset.b}); cargar(); }));
  document.getElementById('add').addEventListener('click',sumar);
}
function alerta(t,ok){ const m=document.getElementById('msg'); if(m){ m.textContent=t; m.className='msg'+(ok?' ok':''); } }
async function sumar(){
  const n=document.getElementById('n').value.trim(), ig=document.getElementById('ig').value.trim(), sp=document.getElementById('sp').value.trim();
  if(!n){ alerta('Poné el nombre del artista.'); return; }
  if(!ig&&!sp){ alerta('Sumá el Instagram o el Spotify del artista.'); return; }
  const b=document.getElementById('add'); b.disabled=true;
  const r=await rpc('seg_set',{p_nombre:n,p_instagram:ig||null,p_spotify:sp||null,p_activo:true}).catch(()=>null);
  b.disabled=false;
  if(!r||!r.ok){ alerta(r&&r.error==='limite'?'Llegaste al máximo de 60 artistas.':'No se pudo guardar. Probá de nuevo.'); return; }
  await cargar(); alerta(n+' quedó sumado y marcado.',true);
}
async function cargar(){
  const d=await rpc('seg_get').catch(()=>null);
  if(!d||d.error){ app.innerHTML='<div class="err">Este link no es válido. Pedile uno nuevo a Semilla Redes.</div>'; return; }
  if(d.cliente) document.getElementById('lede').innerHTML=`Marcá los artistas con los que querés comparar a <b>${esc(d.cliente)}</b>. Seguimos su crecimiento en Instagram cada semana y los ponemos al lado de sus números.`;
  A=d.artistas||[]; pintar();
}
cargar();
</script>
</body>
</html>

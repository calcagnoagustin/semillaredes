<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#e6187a">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Internet">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Internet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#fff6fa; --fg:#2a1020; --muted:#8a5e74; --rosa:#e6187a; --rosa-soft:#f4a0c6;
  --panel:#ffffff; --line:#f1cfe0; --track:#f6dfeb; --ok:#2f9e5b; --mid:#d9a01a; --bad:#c7532b;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1a0a12; --fg:#fde9f2; --muted:#c48aa6; --panel:#2a1220; --line:#4a2238; --track:#3a1828;
  --ok:#4fc27a; --mid:#e8bb45; --bad:#ef7a52; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Sora',system-ui,sans-serif;
  padding-inline:18px;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:480px;margin:0 auto;display:grid;gap:18px}
header{display:flex;align-items:center;gap:12px}
a.back{color:var(--rosa);text-decoration:none;font-weight:700;font-size:17px}
h1{font-size:22px;margin:0;font-weight:700}

.gauge{position:relative;display:grid;place-items:center;padding-block:4px}
svg.g{width:min(78vw,300px);height:auto;max-width:100%}
.gv{position:absolute;top:52%;left:0;right:0;text-align:center;transform:translateY(-50%)}
.gv b{display:block;font-size:46px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.gv span{display:block;font-size:13px;color:var(--muted);margin-top:6px;letter-spacing:.06em;text-transform:uppercase}

button.run{font:inherit;font-size:19px;font-weight:700;background:var(--rosa);color:#fff;border:none;
  border-radius:16px;padding:18px;width:100%;min-height:62px}
button.run:disabled{opacity:.6}
button.run:active{transform:scale(.98)}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;min-width:0}
.card .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.card .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px;line-height:1.1}
.card .u{font-size:11px;color:var(--muted)}
.card.on{border-color:var(--rosa)}

.verdict{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:none}
.verdict.show{display:block}
.verdict .t{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.verdict .t i{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.verdict p{margin:8px 0 0;font-size:14px;color:var(--muted);line-height:1.5}
.hist{font-size:13px;color:var(--muted)}
.hist table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.hist th{text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding-bottom:6px}
.hist td{padding:6px 0;border-top:1px solid var(--line)}
.hist td:not(:first-child){text-align:right}
.note{font-size:12px;color:var(--muted);text-align:center}
</style></head><body>
<div class="wrap">
  <header><a class="back" href="./">‹ Casa</a><h1>Internet</h1></header>

  <div class="gauge">
    <svg class="g" viewBox="0 0 200 118" aria-hidden="true">
      <path d="M18 104 A82 82 0 0 1 182 104" fill="none" stroke="var(--track)" stroke-width="15" stroke-linecap="round"/>
      <path id="arc" d="M18 104 A82 82 0 0 1 182 104" fill="none" stroke="var(--rosa)" stroke-width="15" stroke-linecap="round"
            stroke-dasharray="258" stroke-dashoffset="258" style="transition:stroke-dashoffset .3s"/>
      <text x="18" y="117" font-size="9" fill="var(--muted)" font-family="Sora,sans-serif">0</text>
      <text x="100" y="14" font-size="9" fill="var(--muted)" font-family="Sora,sans-serif" text-anchor="middle">50</text>
      <text x="182" y="117" font-size="9" fill="var(--muted)" font-family="Sora,sans-serif" text-anchor="end">100+</text>
    </svg>
    <div class="gv"><b id="big">—</b><span id="biglbl">Listo para medir</span></div>
  </div>

  <button class="run" id="go">Medir mi internet</button>

  <div class="cards">
    <div class="card" id="cdl"><div class="k">Bajada</div><div class="v" id="vdl">—</div><div class="u">Mbps</div></div>
    <div class="card" id="cul"><div class="k">Subida</div><div class="v" id="vul">—</div><div class="u">Mbps</div></div>
    <div class="card" id="cpg"><div class="k">Ping</div><div class="v" id="vpg">—</div><div class="u">ms</div></div>
  </div>

  <div class="verdict" id="verdict"><div class="t"><i id="vdot"></i><span id="vtit"></span></div><p id="vtxt"></p></div>

  <div class="hist" id="hist"></div>
  <p class="note">Mide contra tu propio servidor en la nube. Por wifi el resultado es el de tu wifi, no el del cable.</p>
</div>

<script>
const API = 'https://vm.semillaredes.com/casa';
const $ = id => document.getElementById(id);
const fmt = n => n >= 100 ? Math.round(n) : n >= 10 ? n.toFixed(1) : n.toFixed(2);
const arc = $('arc'), LEN = 258;

function setGauge(mbps){
  const f = Math.min(1, Math.log10(1 + Math.max(0, mbps)) / 2); // 0 → 0, 100 → ~1
  arc.style.strokeDashoffset = LEN * (1 - f);
}
function big(v, label){ $('big').textContent = v; $('biglbl').textContent = label; }
function active(id){ ['cdl','cul','cpg'].forEach(c => $(c).classList.toggle('on', c === id)); }

async function ping(){
  const t = [];
  for (let i = 0; i < 6; i++){
    const t0 = performance.now();
    try { await fetch(`${API}/ping?x=${Math.random()}`, {cache:'no-store'}); } catch(e){ return null; }
    t.push(performance.now() - t0);
  }
  t.sort((a,b) => a-b);
  return t[1];                               // segundo mejor: descarta el primero frío
}

async function download(){
  const STREAMS = 4, MB = 12, t0 = performance.now();
  let bytes = 0, done = false;
  const tick = setInterval(() => {
    if (done) return;
    const s = (performance.now() - t0) / 1000;
    if (s > .3){ const m = bytes * 8 / s / 1e6; big(fmt(m), 'Bajando'); setGauge(m); $('vdl').textContent = fmt(m); }
  }, 120);
  const one = async () => {
    const r = await fetch(`${API}/dl?mb=${MB}&x=${Math.random()}`, {cache:'no-store'});
    const rd = r.body.getReader();
    for(;;){ const {done:d, value} = await rd.read(); if (d) break; bytes += value.length; }
  };
  try { await Promise.all(Array.from({length: STREAMS}, one)); } catch(e){ clearInterval(tick); return null; }
  done = true; clearInterval(tick);
  return bytes * 8 / ((performance.now() - t0) / 1000) / 1e6;
}

async function upload(){
  const STREAMS = 3, SIZE = 4 * 1024 * 1024;
  const blob = new Blob([new Uint8Array(SIZE)]);
  const t0 = performance.now();
  const one = () => fetch(`${API}/ul?x=${Math.random()}`, {method:'POST', body: blob, cache:'no-store'});
  try { await Promise.all(Array.from({length: STREAMS}, one)); } catch(e){ return null; }
  return SIZE * STREAMS * 8 / ((performance.now() - t0) / 1000) / 1e6;
}

function verdict(dl, ul, pg){
  let tit, txt, col;
  if (dl >= 50 && pg < 60){ col = 'var(--ok)'; tit = 'Internet muy bien';
    txt = 'Alcanza de sobra para videollamadas, streaming en 4K y subir archivos pesados.'; }
  else if (dl >= 20 && pg < 100){ col = 'var(--ok)'; tit = 'Internet bien';
    txt = 'Andás cómodo para trabajar, Zoom y Netflix en alta. Subir video grande va a tardar un poco.'; }
  else if (dl >= 8){ col = 'var(--mid)'; tit = 'Internet justo';
    txt = 'Sirve para navegar y una videollamada, pero si hay varios usando a la vez se nota.'; }
  else { col = 'var(--bad)'; tit = 'Internet lento';
    txt = 'Con esta velocidad las videollamadas se cortan. Probá acercarte al router o medir con cable para ver si el problema es el wifi.'; }
  if (pg >= 150) txt += ' El ping está alto: eso hace que todo se sienta demorado aunque la velocidad sea buena.';
  $('vdot').style.background = col; $('vtit').textContent = tit; $('vtxt').textContent = txt;
  $('verdict').classList.add('show');
}

function saveRun(dl, ul, pg){
  let h = [];
  try { h = JSON.parse(localStorage.getItem('casa_speed') || '[]'); } catch(e){}
  h.unshift({t: Date.now(), dl, ul, pg});
  h = h.slice(0, 5);
  try { localStorage.setItem('casa_speed', JSON.stringify(h)); } catch(e){}
  drawHist(h);
}
function drawHist(h){
  if (!h || !h.length) return;
  const row = r => `<tr><td>${new Date(r.t).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td>${fmt(r.dl)}</td><td>${fmt(r.ul)}</td><td>${Math.round(r.pg)}</td></tr>`;
  $('hist').innerHTML = `<table><tr><th>Mediciones anteriores</th><th>Baja</th><th>Sube</th><th>Ping</th></tr>${h.map(row).join('')}</table>`;
}
try { drawHist(JSON.parse(localStorage.getItem('casa_speed') || '[]')); } catch(e){}

$('go').onclick = async () => {
  const b = $('go'); b.disabled = true; b.textContent = 'Midiendo…';
  $('verdict').classList.remove('show');
  ['vdl','vul','vpg'].forEach(i => $(i).textContent = '—'); setGauge(0);

  active('cpg'); big('…', 'Midiendo ping');
  const pg = await ping();
  if (pg === null){ big('—', 'Sin conexión'); b.disabled = false; b.textContent = 'Medir mi internet'; return; }
  $('vpg').textContent = Math.round(pg);

  active('cdl'); big('…', 'Bajando');
  const dl = await download();
  if (dl === null){ big('—', 'Falló la bajada'); b.disabled = false; b.textContent = 'Medir mi internet'; return; }
  $('vdl').textContent = fmt(dl); setGauge(dl);

  active('cul'); big(fmt(dl), 'Subiendo');
  const ul = await upload();
  if (ul !== null) $('vul').textContent = fmt(ul);

  active(null); big(fmt(dl), 'Mbps de bajada'); setGauge(dl);
  verdict(dl, ul ?? 0, pg);
  saveRun(dl, ul ?? 0, pg);
  b.disabled = false; b.textContent = 'Medir de nuevo';
};
</script>
</body></html>

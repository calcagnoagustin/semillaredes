<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#e6187a">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Casa">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.json">
<title>Casa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&display=swap">
<style>
:root{--bg:#fff6fa;--fg:#2a1020;--muted:#8a5e74;--rosa:#e6187a;--rosa2:#f4a0c6;--panel:#ffffff;--line:#f1cfe0}
@media (prefers-color-scheme:dark){:root{--bg:#1a0a12;--fg:#fde9f2;--muted:#c48aa6;--panel:#2a1220;--line:#4a2238;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Sora',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-inline:20px;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));gap:28px;text-align:center}
img.logo{width:min(46vw,200px);height:auto;max-width:100%}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
p.sub{margin:0;color:var(--muted);font-size:14px}
nav{display:grid;gap:14px;width:100%;max-width:420px}
a.btn{display:flex;align-items:center;gap:16px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:18px 20px;text-decoration:none;color:var(--fg);font-size:20px;font-weight:700;min-height:84px;text-align:left}
a.btn:active{transform:scale(.98)}
a.btn.primary{background:var(--rosa);border-color:var(--rosa);color:#fff}
a.btn .ic{width:40px;height:40px;flex:none}
a.btn small{display:block;font-size:13px;font-weight:500;opacity:.8;margin-top:2px}
a.btn.primary small{color:#fff}
footer{font-size:12px;color:var(--muted)}
footer a{color:inherit}
</style></head><body>
<img class="logo" src="logo.svg" alt="Casa">
<div><h1>Casa</h1><p class="sub">Luces y cámaras en un solo lugar</p></div>
<nav>
  <a class="btn primary" id="luces" href="http://192.168.1.132:8800/app">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>
    <span>Luces<small id="lucesSub">Buscando la Mac…</small></span>
  </a>
  <a class="btn" id="cam" href="shortcuts://run-shortcut?name=Camaras">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
    <span>Cámaras<small>Abre iCSee</small></span>
  </a>
  <a class="btn" href="internet.html">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
    <span>Internet<small>Velocidad y ping</small></span>
  </a>
</nav>
<footer><a href="luces.html">Control por Bluetooth directo (Chrome)</a></footer>
<script>
(async () => {
  const a = document.getElementById('luces'), sub = document.getElementById('lucesSub');

  // En Chrome de escritorio: Bluetooth directo, sin depender de la Mac como servidor.
  if (navigator.bluetooth && !/iPhone|iPad|Android/i.test(navigator.userAgent)) {
    a.href = 'luces.html'; sub.textContent = 'Bluetooth directo'; return;
  }

  // En el celu: ubicar el puente. Primero el nombre de red (sobrevive cambios de IP),
  // y si no responde, la última dirección que el puente le informó al servidor.
  const probar = async (base) => {
    try {
      const c = new AbortController(); setTimeout(() => c.abort(), 2200);
      const r = await fetch(base + '/status', {signal: c.signal, cache: 'no-store'});
      return r.ok ? base : null;
    } catch (e) { return null; }
  };

  let donde = null;
  try {
    const w = await fetch('https://vm.semillaredes.com/casa/where', {cache:'no-store'}).then(r => r.json());
    const cand = [];
    if (w.host) cand.push('http://' + w.host.toLowerCase() + '.local:' + (w.port || 8800));
    if (w.ip)   cand.push('http://' + w.ip + ':' + (w.port || 8800));
    for (const c of cand) { donde = await probar(c); if (donde) break; }
    if (!donde && w.ip) { donde = 'http://' + w.ip + ':' + (w.port || 8800); sub.textContent = 'La Mac no responde'; }
  } catch (e) {}

  if (donde) {
    a.href = donde + '/app';
    if (sub.textContent === 'Buscando la Mac…') sub.textContent = 'Tira LED · lista';
  } else {
    a.href = 'luces.html';
    sub.textContent = 'Prendé la Mac, o abrí con Bluefy';
  }
})();
</script>
</body></html>

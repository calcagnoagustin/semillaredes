<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Metodo Semilla - Portada</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@400;600;700&display=swap');
  body { margin:0; }
  .page {
    position: relative;
    width: 1080px;
    height: 1350px;
    background: #F2EDE4;
    font-family: Inter, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .kicker {
    position: absolute; left: 80px; top: 150px;
    font-family: Inter, Helvetica, Arial, sans-serif;
    font-size: 22px; font-weight: 700; letter-spacing: 5px;
    text-transform: uppercase; color: #87863A;
  }
  .titulo {
    position: absolute; left: 80px; top: 210px; width: 620px;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 118px; font-weight: 600; line-height: 1.02;
    color: #1A2456;
  }
  .bajada {
    position: absolute; left: 80px; top: 500px; width: 480px;
    font-family: Inter, Helvetica, Arial, sans-serif;
    font-size: 34px; font-weight: 400; line-height: 1.4;
    color: #24242C;
  }
  .pilares {
    position: absolute; left: 80px; top: 700px; width: 430px;
    font-family: Inter, Helvetica, Arial, sans-serif;
    font-size: 30px; font-weight: 600; line-height: 2.1;
    color: #1A2456;
  }
  .p1 { color: #87863A; }
  .p2 { color: #7A1F3A; }
  .p3 { color: #E2767C; }
  .foto {
    position: absolute; right: 0px; bottom: 0px;
    width: 560px; height: auto;
  }
  .logo {
    position: absolute; left: 80px; bottom: 140px;
    width: 260px; height: auto;
  }
</style>
</head>
<body>
<div class="page" data-document-role="page" data-label="Portada">
  <div class="kicker">Estrategia para artistas</div>
  <div class="titulo">El Método Semilla</div>
  <div class="bajada">Tres pilares para que tu proyecto artístico crezca en serio.</div>
  <div class="pilares">
    <span class="p1">01 &nbsp; Negocio</span><br>
    <span class="p2">02 &nbsp; Comunicación</span><br>
    <span class="p3">03 &nbsp; Publicidad</span>
  </div>
  <img class="foto" src="https://raw.githubusercontent.com/calcagnoagustin/semillaredes/main/assets/agus-2026.png" alt="Agus Calcagno">
  <img class="logo" src="https://raw.githubusercontent.com/calcagnoagustin/semillaredes/main/assets/semilla-logo-horizontal.png" alt="Semilla Redes">
</div>
</body>
</html>

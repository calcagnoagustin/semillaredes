<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Semilla Reels</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@400;600;700&display=swap');
body{margin:0}
.page{position:relative;width:1080px;height:1920px;background:#F2EDE4;font-family:Inter,Helvetica,Arial,sans-serif;overflow:hidden}
.navy{background:#1A2456}.oliva{background:#87863A}.vino{background:#7A1F3A}
.k{position:absolute;left:90px;top:300px;font-size:24px;font-weight:700;letter-spacing:5px;text-transform:uppercase}
.t{position:absolute;left:90px;font-family:'Playfair Display',Georgia,serif;font-weight:600}
.b{position:absolute;left:90px;font-size:38px;font-weight:400;line-height:1.45}
.foto{position:absolute;right:0;bottom:0;width:660px;height:auto}
.ilu{position:absolute;width:420px;height:auto}
.logo{position:absolute;left:90px;bottom:260px;width:260px;height:auto}
</style>
</head>
<body>

<div class="page navy" data-document-role="page" data-label="Reel 1 portada">
  <div class="k" style="color:#E2767C">Reel 01</div>
  <div class="t" style="top:390px;width:820px;font-size:110px;line-height:1.05;color:#F2EDE4">El posteo es lo último</div>
  <div class="b" style="top:900px;width:560px;color:#B9B4C4">No lo primero.</div>
  <img class="foto" src="https://raw.githubusercontent.com/calcagnoagustin/semillaredes/main/assets/agus-2026.png" alt="">
  <img class="logo" src="https://raw.githubusercontent.com/calcagnoagustin/semillaredes/main/assets/semilla-logo-horizontal-crema.png" alt="">
</div>

<div class="page" data-document-role="page" data-label="Reel 2 portada">
  <div class="k" style="color:#87863A">Reel 02</div>
  <div class="t" style="top:390px;width:820px;font-size:104px;line-height:1.05;color:#1A2456">Tres preguntas antes de abrir Instagram</div>
  <div class="b" style="top:1020px;width:560px;color:#7A1F3A">Qué vendés. A quién. Por qué pagarían.</div>
  <img class="foto" src="https://raw.githubusercontent.com/calcagnoagustin/semillaredes/main/assets/agus-2026-b.png" alt="">
  <img class="logo" src="https://raw.githubusercontent.com/calcagnoagustin/semillaredes/main/assets/semilla-logo-horizontal.png" alt="">
</div>

<div class="page vino" data-document-role="page" data-label="Reel 3 portada">
  <div class="k" style="color:#E2767C">Reel 03</div>
  <div class="t" style="top:390px;width:820px;font-size:112px;line-height:1.05;color:#F2EDE4">Boostear no es pautar</div>
  <div class="b" style="top:900px;width:600px;color:#E2767C">La diferencia, en cuarenta segundos.</div>
  <img class="ilu" style="top:1120px;right:70px;width:460px" src="https://raw.githubusercontent.com/calcagnoagustin/semillaredes/main/assets/ilu-ondas.png" alt="">
  <img class="logo" src="https://raw.githubusercontent.com/calcagnoagustin/semillaredes/main/assets/semilla-logo-horizontal-crema.png" alt="">
</div>

<div class="page" data-document-role="page" data-label="Placa final reels">
  <div class="k" style="color:#87863A">Cierre para los tres</div>
  <div class="t" style="top:520px;width:840px;font-size:100px;line-height:1.08;color:#1A2456">El árbol ya está en la semilla.</div>
  <div class="b" style="top:1080px;width:600px;color:#7A1F3A">Seguime para ordenar tu proyecto con método.</div>
  <img class="ilu" style="top:1250px;right:80px;width:420px" src="https://raw.githubusercontent.com/calcagnoagustin/semillaredes/main/assets/ilu-semilla-hojas-disco.png" alt="">
  <img class="logo" src="https://raw.githubusercontent.com/calcagnoagustin/semillaredes/main/assets/semilla-logo-horizontal.png" alt="">
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/calcagnoagustin/semillaredes/main/assets/semillita-oliva.png">
<title>Panel Semilla</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--crema:#F2EDE4;--navy:#1A2456;--vino:#7A1F3A;--rosa:#E2767C;--oliva:#87863A;--mute:#B9B4C4;--linea:#2E3970}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:var(--crema);font-family:Inter,system-ui,sans-serif;line-height:1.5;padding:26px 18px 90px}
.wrap{max-width:1040px;margin:0 auto}
.cab{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.cab img{width:150px}
h1{font-family:'Playfair Display',serif;font-size:30px;margin:0}
.lede{color:var(--mute);font-size:14.5px;margin:0 0 22px}

.menu{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.mb{background:#212B60;border:1px solid var(--linea);border-radius:12px;padding:14px 20px;font:inherit;font-size:15px;font-weight:600;color:var(--crema);cursor:pointer;display:flex;align-items:center;gap:9px}
.mb:hover{border-color:var(--oliva)}
.mb.on{background:var(--vino);border-color:var(--vino)}
.mb .n{font-size:12px;color:var(--mute);font-weight:400}
.mb.on .n{color:#F0D8DC}

.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.chip{background:#212B60;border:1px solid var(--linea);border-radius:99px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--mute)}
.chip.on{background:var(--oliva);border-color:var(--oliva);color:#fff;font-weight:600}
input.buscar{flex:1;min-width:180px;border:1px solid var(--linea);background:#1A2456;color:var(--crema);border-radius:10px;padding:10px 13px;font:inherit;font-size:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
.cli{background:#212B60;border:1px solid var(--linea);border-radius:14px;padding:16px 18px;cursor:pointer;transition:border-color .15s}
.cli:hover{border-color:var(--oliva)}
.cli h3{font-family:'Playfair Display',serif;font-size:19px;margin:0 0 3px}
.cli .plan{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:var(--oliva)}
.cli .plan.setup{color:var(--rosa)}
.cli .kpis{display:flex;gap:14px;margin-top:11px;flex-wrap:wrap}
.cli .k{font-size:12.5px;color:var(--mute)}
.cli .k b{display:block;font-family:'Playfair Display',serif;font-size:20px;color:var(--crema);line-height:1.2}
.cli .barra{height:5px;background:var(--linea);border-radius:99px;overflow:hidden;margin-top:11px}
.cli .barra i{display:block;height:100%;background:var(--oliva)}
.cli.vacio{opacity:.55}
.cli .pie{display:flex;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid var(--linea)}
.cli .pie a,.cli .pie button{flex:1;text-align:center;border:0;background:#2E3970;color:var(--crema);font:inherit;font-size:12px;font-weight:600;border-radius:8px;padding:7px 6px;cursor:pointer;text-decoration:none}
.cli .pie a:hover,.cli .pie button:hover{background:var(--oliva)}
.cli .pie .url{font-size:11px;color:var(--mute);padding:7px 0;flex:1.4;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.volver{background:transparent;border:0;color:var(--rosa);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:0;margin-bottom:14px}
.oculto{display:none}
.aviso{background:#212B60;border:1px solid var(--linea);border-radius:12px;padding:18px;color:var(--mute);font-size:14px}
#gate input{border:1px solid var(--linea);background:#1A2456;color:var(--crema);border-radius:10px;padding:11px 13px;font:inherit;max-width:280px}
#gate button{border:0;background:var(--vino);color:#fff;font:inherit;font-weight:600;border-radius:10px;padding:11px 18px;cursor:pointer;margin-left:8px}
iframe.detalle{width:100%;height:78vh;border:1px solid var(--linea);border-radius:14px;background:#fff}
.acc{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.acc button,.acc a{border:0;background:#2E3970;color:var(--crema);font:inherit;font-size:13px;font-weight:600;border-radius:9px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.acc .ok{background:var(--oliva)}
.acc .pri{background:var(--vino);color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="cab">
    <img src="https://raw.githubusercontent.com/calcagnoagustin/semillaredes/main/assets/semilla-logo-horizontal-crema.png" alt="Semilla Redes">
    <h1>Panel Semilla</h1>
  </div>
  <p class="lede">Todo el ecosistema en un solo lugar.</p>

  <div id="gate">
    <input type="password" id="tok" placeholder="Token de admin"><button onclick="entrar()">Entrar</button>
  </div>

  <div id="app" class="oculto">
    <div class="menu" id="menu"></div>
    <div id="vista"></div>
  </div>
</div>

<script>
const API='https://fdrxsjphlvvwwknnrjtx.supabase.co';
const KEY='sb_publishable_kT7McM9Dt7xP44IlFotsLA_8-b8q_17';
const $=id=>document.getElementById(id);
const rpc=(fn,a)=>fetch(`${API}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(a)}).then(r=>r.json());
let admin='', datos={setup:[],suscripcion:[]}, filtro='todos', busca='';

const SECCIONES=[
  {id:'clientes', tit:'Clientes', desc:'Setup y suscripción'},
  {id:'setup', tit:'Briefings', desc:'Respuestas y auditorías'},
  {id:'reportes', tit:'Cargar semana', desc:'Métricas y tareas'},
  {id:'patrones', tit:'Patrones', desc:'Qué se completa'}
];

async function entrar(){
  const t=$('tok').value.trim()||sessionStorage.getItem('sr_admin')||'';
  const r=await rpc('panel_clientes',{p_admin:t});
  if(r.error){ alert('Token incorrecto'); return; }
  admin=t; sessionStorage.setItem('sr_admin',t);
  datos=r;
  $('gate').classList.add('oculto'); $('app').classList.remove('oculto');
  pintarMenu(); verClientes();
}

function pintarMenu(){
  const total=datos.setup.length+datos.suscripcion.length;
  $('menu').innerHTML=`
    <button class="mb on" data-s="clientes">Clientes <span class="n">${total}</span></button>
    <button class="mb" data-s="setup">Briefings <span class="n">${datos.setup.length}</span></button>
    <button class="mb" data-s="reportes">Cargar semana</button>
    <button class="mb" data-s="patrones">Patrones</button>`;
  document.querySelectorAll('.mb').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.mb').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    const s=b.dataset.s;
    if(s==='clientes') verClientes();
    if(s==='setup') abrirPanel('https://landing.semillaredes.com/panel-setup.html');
    if(s==='reportes') abrirPanel('https://landing.semillaredes.com/panel-clientes.html');
    if(s==='patrones') abrirPanel('https://landing.semillaredes.com/panel-setup.html#patrones');
  });
}

function abrirPanel(url){
  $('vista').innerHTML=`<button class="volver" onclick="verClientes()">← Volver a clientes</button>
    <iframe class="detalle" src="${url}"></iframe>`;
}

function tarjeta(c){
  if(c.origen==='setup'){
    const pct=c.kpi_entregables_total?Math.round(c.kpi_entregables_listos/c.kpi_entregables_total*100):0;
    return `<div class="cli ${c.kpi_respuestas?'':'vacio'}" data-slug="${c.slug}" data-origen="setup">
      <div class="plan setup">Setup · Plan ${c.plan}</div>
      <h3>${c.nombre}</h3>
      <div class="kpis">
        <div class="k"><b>${c.kpi_respuestas}</b>respuestas</div>
        <div class="k"><b>${c.kpi_archivos}</b>archivos</div>
        <div class="k"><b>${c.kpi_entregables_listos}/${c.kpi_entregables_total}</b>entregables</div>
      </div>
      <div class="barra"><i style="width:${pct}%"></i></div>
      <div class="pie">
        <span class="url">Briefing</span>
        <a href="https://landing.semillaredes.com/proyecto.html?p=${c.slug}&k=${c.token}" target="_blank" onclick="event.stopPropagation()">Abrir ↗</a>
        <button data-copiar="https://landing.semillaredes.com/proyecto.html?p=${c.slug}&k=${c.token}" onclick="event.stopPropagation()">Copiar</button>
      </div></div>`;
  }
  const m=c.ultimas_metricas||{};
  const dato = m.ig_followers_total!=null ? `<div class="k"><b>${Number(m.ig_followers_total).toLocaleString('es-AR')}</b>seguidores</div>`
    : (m.cal_mensajes!=null||m.ej_mensajes!=null) ? `<div class="k"><b>${Number(m.cal_mensajes||0)+Number(m.ej_mensajes||0)}</b>mensajes</div>` : '';
  return `<div class="cli ${c.kpi_semanas?'':'vacio'}" data-slug="${c.slug}" data-origen="sub">
    <div class="plan">${c.tipo==='mensajes'?'Pauta':c.tipo==='mixto'?'Mixto':'Suscripción'}</div>
    <h3>${c.nombre}</h3>
    <div class="kpis">
      <div class="k"><b>${c.kpi_semanas}</b>semanas</div>
      ${dato}
      ${c.kpi_tareas_pend?`<div class="k"><b>${c.kpi_tareas_pend}</b>pendientes</div>`:''}
    </div>
    ${c.kpi_ultima?`<div class="k" style="margin-top:9px;font-size:12px">Última semana: ${c.kpi_ultima}</div>`:'<div class="k" style="margin-top:9px;font-size:12px">Sin reportes cargados</div>'}
    <div class="pie">
      <span class="url">/${c.slug.replace(/-/g,'')}</span>
      <a href="https://semillaredes.com/${c.slug.replace(/-/g,'')}" target="_blank" onclick="event.stopPropagation()">Abrir ↗</a>
      <button data-copiar="https://semillaredes.com/${c.slug.replace(/-/g,'')}" onclick="event.stopPropagation()">Copiar</button>
    </div>
  </div>`;
}

function verClientes(){
  const todos=[...datos.setup, ...datos.suscripcion]
    .filter(c=>filtro==='todos' || (filtro==='setup'&&c.origen==='setup') || (filtro==='sub'&&c.origen==='sub') || (filtro==='sin'&&!(c.kpi_semanas||c.kpi_respuestas)))
    .filter(c=>!busca || c.nombre.toLowerCase().includes(busca.toLowerCase()))
    .sort((a,b)=>a.nombre.localeCompare(b.nombre));
  $('vista').innerHTML=`
    <div class="filtros">
      <span class="chip ${filtro==='todos'?'on':''}" data-f="todos">Todos</span>
      <span class="chip ${filtro==='sub'?'on':''}" data-f="sub">Suscripción y pauta</span>
      <span class="chip ${filtro==='setup'?'on':''}" data-f="setup">Setup</span>
      <span class="chip ${filtro==='sin'?'on':''}" data-f="sin">Sin datos</span>
      <input class="buscar" id="q" placeholder="Buscar cliente…" value="${busca}">
    </div>
    <div class="grid">${todos.map(tarjeta).join('')||'<p class="aviso">No hay clientes con ese filtro.</p>'}</div>`;
  document.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{filtro=ch.dataset.f;verClientes();});
  $('q').oninput=e=>{busca=e.target.value; const p=e.target.selectionStart; verClientes(); const q=$('q'); q.focus(); q.setSelectionRange(p,p);};
  document.querySelectorAll('.cli').forEach(c=>c.onclick=()=>verCliente(c.dataset.slug,c.dataset.origen));
  document.querySelectorAll('[data-copiar]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    navigator.clipboard.writeText(b.dataset.copiar);
    const t=b.textContent; b.textContent='Copiado ✓'; setTimeout(()=>b.textContent=t,1400);
  });
}

function verCliente(slug,origen){
  const c=(origen==='setup'?datos.setup:datos.suscripcion).find(x=>x.slug===slug);
  if(!c) return;
  const corto=slug.replace(/-/g,'');
  if(origen==='setup'){
    $('vista').innerHTML=`<button class="volver" onclick="verClientes()">← Volver a clientes</button>
      <h2 style="font-family:'Playfair Display',serif;margin:0 0 4px">${c.nombre}</h2>
      <p class="lede">Setup · Plan ${c.plan} · ${c.kpi_respuestas} respuestas · ${c.kpi_archivos} archivos</p>
      <div class="acc">
        <button class="pri" onclick="navigator.clipboard.writeText('https://landing.semillaredes.com/proyecto.html?p=${c.slug}&k=${c.token}');this.textContent='Link copiado ✓'">Copiar link del briefing</button>
        <a class="ok" href="https://landing.semillaredes.com/panel-setup.html" target="_blank">Auditoría IA y entregables</a>
      </div>
      <iframe class="detalle" src="https://landing.semillaredes.com/proyecto.html?p=${c.slug}&k=${c.token}"></iframe>`;
    return;
  }
  $('vista').innerHTML=`<button class="volver" onclick="verClientes()">← Volver a clientes</button>
    <h2 style="font-family:'Playfair Display',serif;margin:0 0 4px">${c.nombre}</h2>
    <p class="lede">${c.tipo==='mensajes'?'Pauta':c.tipo==='mixto'?'Mixto':'Suscripción'} · ${c.kpi_semanas} semanas cargadas${c.kpi_ultima?` · última ${c.kpi_ultima}`:''}</p>
    <div class="acc">
      <button class="pri" onclick="navigator.clipboard.writeText('https://semillaredes.com/${corto}');this.textContent='Link copiado ✓'">Copiar link del cliente</button>
      <a class="ok" href="https://landing.semillaredes.com/panel-clientes.html" target="_blank">Cargar semana / tareas</a>
      <a href="https://semillaredes.com/${corto}" target="_blank">Abrir status</a>
    </div>
    <iframe class="detalle" src="https://landing.semillaredes.com/cliente.html?c=${c.slug}&k=${c.token}"></iframe>`;
}

if(sessionStorage.getItem('sr_admin')) entrar();
</script>
</body>
</html>

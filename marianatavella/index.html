<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1A2456">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Semilla IA">
<link rel="manifest" href="/marianatavella/manifest.json">
<link rel="icon" type="image/png" href="/icono-192.png">
<link rel="apple-touch-icon" href="/icono-180.png">
<title>Mariana Tavella · Semilla IA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#F2EDE4;overflow:hidden;font-family:Inter,system-ui,sans-serif}
.barra{display:flex;gap:8px;padding:11px 14px calc(11px + env(safe-area-inset-top));background:#1A2456;position:sticky;top:0;z-index:5}
.barra button{flex:1;border:0;background:#2E3970;color:#B9B4C4;font:inherit;font-size:14.5px;font-weight:600;border-radius:10px;padding:11px 8px;cursor:pointer}
.barra button.on{background:#F2EDE4;color:#1A2456}
.marco{height:calc(100% - 62px)}
iframe{border:0;width:100%;height:100%;display:block}
#instalar{position:fixed;left:14px;right:14px;bottom:14px;background:#1A2456;color:#F2EDE4;border-radius:14px;padding:15px 18px;display:none;align-items:center;gap:12px;box-shadow:0 8px 28px rgba(0,0,0,.25);z-index:99}
#instalar img{width:42px;height:42px;border-radius:10px;flex:none}
#instalar .tx{flex:1;font-size:14px;line-height:1.4}
#instalar .tx b{display:block;font-size:15px;margin-bottom:2px}
#instalar button{border:0;background:#7A1F3A;color:#fff;font:inherit;font-weight:600;font-size:14px;border-radius:9px;padding:10px 15px;cursor:pointer}
#instalar .x{background:transparent;color:#8A8697;padding:6px 4px;font-size:19px}
</style>
</head>
<body>
<div class="barra" id="barra"></div>
<div class="marco"><iframe id="marco" title="Mariana Tavella"></iframe></div>

<div id="instalar">
  <img src="/icono-192.png" alt="">
  <span class="tx"><b>Tenelo a mano</b><span id="msj">Agregalo a tu pantalla de inicio y entrá con un toque.</span></span>
  <button id="btn">Agregar</button>
  <button class="x" id="cerrar">×</button>
</div>

<script>
const PROYECTOS = [{"nombre": "Mavela", "slug": "mavela", "token": "e3f43339a257"}, {"nombre": "Animales del Rock", "slug": "animales-del-rock", "token": "6b90bb8dfbf2"}];
try{ localStorage.setItem('sr_cliente_slug','marianatavella'); }catch(e){}

const marco=document.getElementById('marco');
let actual = 0;
try{ const g=localStorage.getItem('sr_tab_marianatavella'); if(g!==null) actual=Number(g)||0; }catch(e){}

function pintarBarra(){
  document.getElementById('barra').innerHTML = PROYECTOS.map((p,i)=>
    `<button class="${i===actual?'on':''}" data-i="${i}">${p.nombre}</button>`).join('');
  document.querySelectorAll('.barra button').forEach(b=>b.onclick=()=>{
    actual=Number(b.dataset.i);
    try{ localStorage.setItem('sr_tab_marianatavella', String(actual)); }catch(e){}
    pintarBarra(); cargar();
  });
}
function cargar(){
  const p=PROYECTOS[actual];
  marco.src = 'https://semillaredes.com/cliente.html?c=' + p.slug + '&k=' + p.token + '&v=' + Date.now();
}
pintarBarra(); cargar();

document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) cargar(); });
window.addEventListener('focus', cargar);

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').then(reg=>{
    reg.update(); setInterval(()=>reg.update(), 3600000);
    reg.addEventListener('updatefound', ()=>{ const n=reg.installing; if(n) n.addEventListener('statechange',()=>{ if(n.state==='activated') cargar(); }); });
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('message', e=>{ if(e.data==='recargar') cargar(); });
}

const caja=document.getElementById('instalar');
const yaInstalada = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
const oculto = localStorage.getItem('sr_install_off');
const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
let evento=null;
function mostrar(){ if(!yaInstalada && !oculto) caja.style.display='flex'; }
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); evento=e; mostrar(); });
if(esIOS && !yaInstalada && !oculto){
  document.getElementById('msj').textContent='Tocá el botón Compartir de Safari y elegí "Agregar a pantalla de inicio".';
  document.getElementById('btn').style.display='none';
  setTimeout(mostrar, 2500);
}
document.getElementById('btn').onclick=async()=>{ if(!evento) return; evento.prompt(); await evento.userChoice; evento=null; caja.style.display='none'; };
document.getElementById('cerrar').onclick=()=>{ caja.style.display='none'; localStorage.setItem('sr_install_off','1'); };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/calcagnoagustin/semillaredes/main/assets/semillita-oliva.png">
<title>Panel Clientes · Semilla Redes</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--crema:#F2EDE4;--navy:#1A2456;--vino:#7A1F3A;--rosa:#E2767C;--oliva:#87863A;--mute:#B9B4C4}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:var(--crema);font-family:Inter,system-ui,sans-serif;line-height:1.5;padding:28px 18px 90px}
.wrap{max-width:960px;margin:0 auto}
h1{font-family:'Playfair Display',serif;font-size:32px;margin:0 0 2px}
.lede{color:var(--mute);font-size:14.5px;margin:0 0 22px}
.card{background:#212B60;border:1px solid #2E3970;border-radius:14px;padding:20px;margin:14px 0}
.card h2{font-family:'Playfair Display',serif;font-size:22px;margin:0 0 2px}
.meta{font-size:12.5px;color:var(--mute)}
h3{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--oliva);margin:20px 0 8px}
label{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mute);display:block;margin-bottom:4px}
input,select,textarea{border:1px solid #2E3970;background:#1A2456;color:var(--crema);border-radius:9px;padding:10px 12px;font:inherit;font-size:14px;width:100%}
textarea{min-height:170px;font-family:ui-monospace,monospace;font-size:12.5px;line-height:1.6}
button{border:0;background:var(--vino);color:#fff;font:inherit;font-size:13.5px;font-weight:600;border-radius:9px;padding:10px 16px;cursor:pointer}
button.sec{background:#2E3970}button.ok{background:var(--oliva)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tabs{display:flex;gap:6px;margin:0 0 18px;border-bottom:1px solid #2E3970;flex-wrap:wrap}
.tab{padding:10px 15px;font-size:14px;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--crema);border-bottom-color:var(--rosa)}
.plat{font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--rosa);margin:16px 0 6px;font-weight:700}
.fila{display:grid;grid-template-columns:1fr 170px;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid #2E3970;font-size:14px}
.fila .t{min-width:0}
.fila select,.fila input{width:100%;max-width:none;font-size:13px;padding:8px 10px}
.fila.activo{grid-template-columns:minmax(0,240px) 1fr}
@media(max-width:640px){.fila,.fila.activo{grid-template-columns:1fr;gap:7px;padding:13px 0}}
.agregar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:4px}
.agregar input{margin:0}
@media(max-width:640px){.agregar{grid-template-columns:1fr}}
.ok-msg{color:var(--oliva);font-size:13px;margin-top:8px}
.oculto{display:none}
details{margin-top:10px}
summary{cursor:pointer;font-size:13.5px;color:var(--mute);padding:6px 0}
summary::marker{color:var(--oliva)}
.x{border:0;background:transparent;color:#5A6497;font-size:18px;cursor:pointer;padding:0 6px;line-height:1}
.x:hover{color:var(--rosa)}
.nota-i{background:#1A2456;border-left:2px solid var(--oliva);border-radius:0 9px 9px 0;padding:10px 13px;margin:8px 0;font-size:13.5px;position:relative}
.nota-i.cliente{border-left-color:var(--rosa)}
.nota-i .q{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--oliva);font-weight:700}
.nota-i.cliente .q{color:var(--rosa)}
.nota-i .x{position:absolute;top:6px;right:6px}
.hito-i{display:grid;grid-template-columns:1fr 90px 30px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #2E3970;font-size:13.5px}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid #2E3970}
th:first-child,td:first-child{text-align:left}
td.acciones{text-align:right;width:44px}
.borrar{background:transparent;border:1px solid #3B2440;color:#E2767C;border-radius:7px;padding:4px 9px;font-size:12px;cursor:pointer;font-weight:600}
.borrar:hover{background:#7A1F3A;border-color:#7A1F3A;color:#fff}
th{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--oliva)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Panel Clientes</h1>
  <p class="lede">Carga de métricas semanales, tareas y activos.</p>

  <div id="gate">
    <label>Token de admin</label>
    <input type="password" id="tok" style="max-width:280px;display:inline-block"> <button onclick="entrar()">Entrar</button>
  </div>

  <div id="app" class="oculto">
    <div class="tabs" id="tabs"></div>
    <div id="vista"></div>
  </div>
</div>

<script>
const API='https://fdrxsjphlvvwwknnrjtx.supabase.co';
const KEY='sb_publishable_kT7McM9Dt7xP44IlFotsLA_8-b8q_17';
const $=id=>document.getElementById(id);
const rpc=(fn,a)=>fetch(`${API}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(a)}).then(r=>r.json());
let admin='', clientes=[], sel=null;

const CAMPOS={
 'Instagram':[['ig_followers_total','Seguidores'],['ig_followers_nuevos','Nuevos'],['ig_visitas','Visitas'],['ig_inversion','Inversión USD'],['ig_inversion_diaria','Inv. diaria'],['ig_costo_follower','Costo x seguidor']],
 'Spotify':[['sp_monthly','Oyentes mensuales'],['sp_listeners','Listeners'],['sp_streams','Streams'],['sp_stream_listener','Streams x listener'],['sp_guardados','Guardados'],['sp_playlists','Playlists'],['sp_followers','Seguidores'],['sp_meta_visitas','Visitas desde Meta'],['sp_inversion','Inversión USD'],['sp_costo_stream','Costo x stream']],
 'YouTube':[['yt_subs','Suscriptores'],['yt_subs_nuevos','Nuevos'],['yt_views','Visualizaciones'],['yt_horas','Horas vistas'],['yt_inversion','Inversión USD'],['yt_costo_view','Costo x view']]
};

async function entrar(){
  const t=$('tok').value.trim()||sessionStorage.getItem('sr_admin')||'';
  const r=await rpc('sub_admin',{p_admin:t});
  if(r.error){ alert('Token incorrecto'); return; }
  admin=t; sessionStorage.setItem('sr_admin',t);
  clientes=r.clientes||[]; sel=sel||(clientes[0]||{}).slug;
  $('gate').classList.add('oculto'); $('app').classList.remove('oculto');
  pintarTabs(); pintar();
}
function pintarTabs(){
  $('tabs').innerHTML=clientes.map(c=>`<div class="tab ${c.slug===sel?'on':''}" data-s="${c.slug}">${c.nombre}</div>`).join('')+`<div class="tab" data-s="__nuevo">+ Nuevo</div>`;
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{sel=t.dataset.s;pintarTabs();pintar();});
}

function notasHTML(c,seccion,expandido){
  const N=(c.notas||[]).filter(n=>(n.seccion||'general')===seccion);
  const lista=N.map(n=>`<div class="nota-i ${n.autor==='cliente'?'cliente':''}"><div class="q">${n.autor==='cliente'?c.nombre:'Vos'} · ${new Date(n.fecha).toLocaleDateString('es-AR',{day:'numeric',month:'short'})}</div>${n.texto}<button class="x" data-del-nota="${n.id}">×</button></div>`).join('');
  const form=`<div class="agregar" style="margin-top:10px"><input class="n_txt" data-sec="${seccion}" placeholder="Dejar una nota…"><button class="sec" data-add-nota="${seccion}">Anotar</button></div>`;
  if(expandido) return lista+form;
  return `<details><summary>Notas de esta sección${N.length?` (${N.length})`:''}</summary>${lista}${form}</details>`;
}
function parsear(txt){
  const d={}, L=txt.split('\n').map(x=>x.trim()).filter(Boolean);
  const num=s=>{const m=(s||'').replace(/\./g,'').replace(',','.').match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):null;};
  let seccion='ig';
  L.forEach(l=>{
    const bajo=l.toLowerCase();
    if(bajo.startsWith('spotify')){seccion='sp';return;}
    if(bajo.startsWith('youtube')){seccion='yt';return;}
    if(bajo.startsWith('instagram')){seccion='ig';return;}
    const f=l.match(/^(\d{1,2}\/\d{1,2}).*?(\d{1,2}\/\d{1,2})/);
    if(f && bajo.includes('/')&&!bajo.includes(':')){d.__desde=f[1];d.__hasta=f[2];return;}
    const p=l.split(':'); if(p.length<2) return;
    const k=p[0].trim().toLowerCase(), v=num(p.slice(1).join(':'));
    if(v==null) return;
    const M={
      'followers': seccion==='ig'?(d.ig_followers_total==null?'ig_followers_total':'ig_followers_nuevos'):'sp_followers',
      'visitas': seccion==='ig'?'ig_visitas':'sp_meta_visitas',
      'meta visitas':'sp_meta_visitas',
      'inversión': seccion+'_inversion', 'inversion': seccion+'_inversion',
      'costo por follower':'ig_costo_follower','inversión diaria':'ig_inversion_diaria','inversion diaria':'ig_inversion_diaria',
      'listeners':'sp_listeners','monthly':'sp_monthly','streams':'sp_streams','stream/listener':'sp_stream_listener',
      'guardados':'sp_guardados','playlists':'sp_playlists','costo por stream':'sp_costo_stream',
      'suscriptores':'yt_subs','views':'yt_views','visualizaciones':'yt_views','horas':'yt_horas','costo por view':'yt_costo_view'
    };
    const campo=M[k]; if(campo) d[campo]=v;
  });
  return d;
}

function pintar(){
  const v=$('vista');
  if(sel==='__nuevo'){
    v.innerHTML=`<div class="card"><h2>Nuevo cliente</h2>
      <label>Nombre</label><input id="n_nom" placeholder="Lu Glass">
      <div class="acc"><button onclick="crearCliente()">Crear</button></div><div id="n_out"></div></div>`;
    return;
  }
  const c=clientes.find(x=>x.slug===sel); if(!c){v.innerHTML='';return;}
  const ult=(c.reportes||[])[0];
  let h=`<div class="card"><h2>${c.nombre}</h2>
    <div class="meta">landing.semillaredes.com/cliente.html?c=${c.slug}&k=${c.token}</div>
    <div class="acc"><button class="sec" id="cp">Copiar link</button><button class="sec" id="wa">Mandar por WhatsApp</button></div></div>`;

  h+=`<div class="card"><h2>Cargar la semana</h2>
    <p class="meta">Pegá el reporte tal cual lo escribís y se completa solo. O cargá los campos a mano.</p>
    <h3>Pegar reporte</h3>
    <textarea id="pegar" placeholder="26/08 al 02/09:&#10;Followers: 6,623&#10;Visitas: 965&#10;..."></textarea>
    <div class="acc"><button class="ok" onclick="autocompletar()">Leer y completar campos</button></div>
    <h3>Período</h3>
    <div class="grid"><div><label>Desde</label><input type="date" id="f_desde"></div><div><label>Hasta</label><input type="date" id="f_hasta"></div></div>`;
  Object.entries(CAMPOS).forEach(([plat,cs])=>{
    h+=`<div class="plat">${plat}</div><div class="grid">`;
    cs.forEach(([k,l])=>{ h+=`<div><label>${l}</label><input type="text" inputmode="decimal" id="m_${k}" value="${ult&&ult.metricas[k]!=null?'':''}"></div>`; });
    h+=`</div>`;
  });
  h+=`<div class="acc"><button onclick="guardarReporte()">Guardar semana</button></div><div id="g_out"></div></div>`;

  if((c.reportes||[]).length){
    h+=`<div class="card"><h2>Semanas cargadas</h2><details><summary>Ver las ${c.reportes.length} semanas</summary><table><tr><th>Semana</th><th>IG</th><th>SP oyentes</th><th>YT subs</th><th>Inversión</th><th></th></tr>
      ${c.reportes.map(r=>{const m=r.metricas;return `<tr><td>${r.desde} a ${r.hasta}</td><td>${m.ig_followers_total??'—'}</td><td>${m.sp_monthly??'—'}</td><td>${m.yt_subs??'—'}</td><td>${((m.ig_inversion||0)+(m.sp_inversion||0)+(m.yt_inversion||0)).toFixed(2)}</td>
      <td class="acciones"><button class="borrar" data-del="${r.desde}|${r.hasta}" title="Borrar esta semana">Borrar</button></td></tr>`}).join('')}
    </table></details></div>`;
  }

  h+=`<div class="card"><h2>Tareas</h2>
    ${(c.tareas||[]).map(t=>`<div class="fila" style="grid-template-columns:1fr 170px 30px"><span class="t">${t.titulo}${t.creada_por==='cliente'?' <span style="color:var(--rosa);font-size:11px">· la pidió el cliente</span>':''}</span>
      <select data-tid="${t.id}"><option value="pendiente"${t.estado==='pendiente'?' selected':''}>Pendiente</option><option value="en_curso"${t.estado==='en_curso'?' selected':''}>En curso</option><option value="hecha"${t.estado==='hecha'?' selected':''}>Hecha</option></select>
      <button class="x" data-del-tarea="${t.id}" title="Borrar tarea">×</button></div>`).join('')||'<p class="meta">Sin tareas.</p>'}
    <h3>Agregar</h3><div class="agregar"><input id="t_tit" placeholder="Título de la tarea"><button class="sec" onclick="nuevaTarea()">Agregar</button></div>
    ${notasHTML(c,'tareas')}</div>`;

  h+=`<div class="card"><h2>Hitos</h2><p class="meta">Metas que ve el cliente con su barra de avance.</p>
    ${(c.hitos||[]).map(x=>`<div class="hito-i"><span>${x.titulo||x.metrica}</span><span style="text-align:right">${x.objetivo}</span><button class="x" data-del-hito="${x.id}">×</button></div>`).join('')||'<p class="meta">Sin hitos.</p>'}
    <h3>Agregar</h3>
    <div class="grid"><select id="h_met">
      <option value="ig_followers_total|instagram">Seguidores en Instagram</option>
      <option value="sp_monthly|spotify">Oyentes mensuales en Spotify</option>
      <option value="sp_followers|spotify">Seguidores en Spotify</option>
      <option value="sp_streams|spotify">Streams en la semana</option>
      <option value="yt_subs|youtube">Suscriptores en YouTube</option>
      <option value="yt_views|youtube">Visualizaciones en YouTube</option>
    </select><input id="h_obj" placeholder="Objetivo (número)" inputmode="decimal"><input id="h_tit" placeholder="Título que ve el cliente"></div>
    <div class="acc"><button class="sec" onclick="nuevoHito()">Agregar hito</button></div></div>`;

  h+=`<div class="card"><h2>Activos</h2>
    ${(c.activos||[]).map(a=>`<div class="fila activo" style="grid-template-columns:minmax(0,200px) 1fr 30px"><span class="t">${a.titulo}</span><input data-aid="${a.id}" value="${a.url||''}" placeholder="Pegá el link acá"><button class="x" data-del-activo="${a.id}" title="Borrar activo">×</button></div>`).join('')||'<p class="meta">Sin activos.</p>'}
    <h3>Agregar</h3><div class="fila activo" style="border:0;padding-top:0"><input id="a_tit" placeholder="Título"><input id="a_url" placeholder="https://..."></div>
    <div class="acc"><button class="sec" onclick="nuevoActivo()">Agregar activo</button></div>
    ${notasHTML(c,'activos')}</div>`;

  h+=`<div class="card"><h2>Notas del proyecto</h2><p class="meta">Lo que anotes acá lo ve el cliente en su página. Ideal para dejarle registro de lo que hiciste con las campañas.</p>
    ${notasHTML(c,'general',true)}</div>`;

  v.innerHTML=h;
  const link=`https://landing.semillaredes.com/cliente.html?c=${c.slug}&k=${c.token}`;
  $('cp').onclick=()=>{navigator.clipboard.writeText(link);$('cp').textContent='Copiado ✓';};
  $('wa').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent('Te dejo el panel de tu proyecto, se actualiza todas las semanas: '+link),'_blank');
  document.querySelectorAll('[data-del-tarea]').forEach(b=>b.onclick=async()=>{ if(!confirm('¿Borrar esta tarea?'))return; const r=await rpc('sub_borrar',{p_admin:admin,p_que:'tarea',p_id:b.dataset.delTarea}); if(r.ok) entrar(); });
  document.querySelectorAll('[data-del-activo]').forEach(b=>b.onclick=async()=>{ if(!confirm('¿Borrar este activo?'))return; const r=await rpc('sub_borrar',{p_admin:admin,p_que:'activo',p_id:b.dataset.delActivo}); if(r.ok) entrar(); });
  document.querySelectorAll('[data-del-nota]').forEach(b=>b.onclick=async()=>{ if(!confirm('¿Borrar esta nota?'))return; const r=await rpc('sub_borrar',{p_admin:admin,p_que:'nota',p_id:b.dataset.delNota}); if(r.ok) entrar(); });
  document.querySelectorAll('[data-del-hito]').forEach(b=>b.onclick=async()=>{ if(!confirm('¿Borrar este hito?'))return; const r=await rpc('sub_borrar',{p_admin:admin,p_que:'hito',p_id:b.dataset.delHito}); if(r.ok) entrar(); });
  document.querySelectorAll('[data-add-nota]').forEach(b=>b.onclick=async()=>{
    const sec=b.dataset.addNota;
    const inp=[...document.querySelectorAll('.n_txt')].find(i=>i.dataset.sec===sec);
    if(!inp||!inp.value.trim())return;
    const r=await rpc('sub_nota_admin',{p_admin:admin,p_slug:sel,p_texto:inp.value.trim(),p_seccion:sec});
    if(r.ok) entrar();
  });
  document.querySelectorAll('button[data-del]').forEach(b=>b.onclick=async()=>{
    const [de,ha]=b.dataset.del.split('|');
    if(!confirm(`¿Borrar la semana del ${de} al ${ha}?\n\nSe pierden todas las métricas de esa semana.`)) return;
    b.disabled=true; b.textContent='…';
    const r=await rpc('sub_reporte_borrar',{p_admin:admin,p_slug:sel,p_desde:de,p_hasta:ha});
    if(r.ok) entrar(); else { alert('No se pudo borrar'); b.disabled=false; b.textContent='Borrar'; }
  });
  document.querySelectorAll('select[data-tid]').forEach(s=>s.onchange=async()=>{
    await rpc('sub_tarea_set',{p_admin:admin,p_id:s.dataset.tid,p_estado:s.value});
    s.style.borderColor='#87863A'; setTimeout(()=>s.style.borderColor='#2E3970',900);
  });
  document.querySelectorAll('input[data-aid]').forEach(i=>i.onblur=async()=>{
    await rpc('sub_activo_url',{p_admin:admin,p_id:i.dataset.aid,p_url:i.value});
    i.style.borderColor='#87863A'; setTimeout(()=>i.style.borderColor='#2E3970',900);
  });
}

function autocompletar(){
  const d=parsear($('pegar').value);
  let n=0;
  Object.entries(d).forEach(([k,v])=>{ const el=$('m_'+k); if(el){el.value=v;n++;} });
  if(d.__desde&&d.__hasta){
    const anio=new Date().getFullYear();
    const conv=s=>{const [dd,mm]=s.split('/');return `${anio}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`;};
    $('f_desde').value=conv(d.__desde); $('f_hasta').value=conv(d.__hasta);
  }
  $('g_out').innerHTML=`<div class="ok-msg">Leí ${n} métricas. Revisá y guardá.</div>`;
}

async function guardarReporte(){
  const desde=$('f_desde').value, hasta=$('f_hasta').value;
  if(!desde||!hasta){ alert('Faltan las fechas'); return; }
  const m={};
  Object.values(CAMPOS).flat().forEach(([k])=>{ const v=$('m_'+k).value.trim().replace(',','.'); if(v!=='') m[k]=parseFloat(v); });
  const r=await rpc('sub_reporte_alta',{p_admin:admin,p_slug:sel,p_desde:desde,p_hasta:hasta,p_metricas:m});
  if(r.ok){ $('g_out').innerHTML='<div class="ok-msg">Guardado ✓</div>'; entrar(); }
  else alert('No se pudo guardar');
}
async function nuevaTarea(){ const t=$('t_tit').value.trim(); if(!t)return; await rpc('sub_tarea_alta',{p_admin:admin,p_slug:sel,p_titulo:t}); entrar(); }
async function nuevoActivo(){ const t=$('a_tit').value.trim(); if(!t)return; await rpc('sub_activo_alta',{p_admin:admin,p_slug:sel,p_titulo:t,p_url:$('a_url').value.trim()}); entrar(); }
async function nuevoHito(){
  const [met,plat]=$('h_met').value.split('|');
  const obj=parseFloat(($('h_obj').value||'').replace(/[^\d.]/g,''));
  if(!obj){ alert('Falta el objetivo'); return; }
  const r=await rpc('sub_hito_alta',{p_admin:admin,p_slug:sel,p_plataforma:plat,p_metrica:met,p_objetivo:obj,p_titulo:$('h_tit').value.trim()||null});
  if(r.ok) entrar();
}
async function crearCliente(){
  const n=$('n_nom').value.trim(); if(!n)return;
  const r=await rpc('sub_cliente_alta',{p_admin:admin,p_nombre:n});
  if(r.ok){ sel=r.slug; entrar(); } else alert('No se pudo crear');
}
if(sessionStorage.getItem('sr_admin')) entrar();
</script>
</body>
</html>

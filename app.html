<style>
:root{--crema:#F6EEE2;--papel:#FBF7F0;--navy:#101A48;--vino:#5F0B24;--oliva:#7A743A;--coral:#F07C70;--rosa:#F6DCD6;--olivaclaro:#E8E3CC;--tinta:#22232E;--mute:#6B6878;--linea:#E4D9C8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--crema);color:var(--tinta);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 30px) 20px 60px;min-height:100vh}
/* logo: marca + SEMILLA REDES | semillaIA */
.lock{display:flex;align-items:center;gap:12px}
.lock .mk{width:44px;height:44px;display:block}
.lock .sr{display:flex;flex-direction:column;justify-content:center;gap:3px}
.lock .sr b{font:400 22px/20px Anton,Impact,sans-serif;color:var(--navy);letter-spacing:.3px}
.lock .sr i{font:300 13px/12px Oswald,sans-serif;font-style:normal;color:var(--navy);letter-spacing:5.4px}
.lock .dv{width:1px;height:36px;background:#BDB4A3;margin:0 4px}
.lock .ia{font:800 23px/1 Inter,sans-serif;color:var(--navy);letter-spacing:-.4px}.lock .ia b,.ia b{color:var(--oliva);font-weight:800}
.cab{display:flex;align-items:center;gap:12px;margin-bottom:30px}
.cab .esp{flex:1}
.cab .sal{border:0;background:none;color:var(--mute);font:500 13.5px/1 Inter,sans-serif;cursor:pointer;padding:8px 0}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:800;color:var(--navy);font-size:34px;line-height:1.1;margin:0 0 10px;letter-spacing:-.3px}
p.bj{font-size:16px;color:#3A3846;margin:0 0 24px}
.g{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;border:1px solid var(--linea);background:#fff;color:var(--tinta);border-radius:12px;height:52px;padding:0 16px;font:600 16px/1 Inter,sans-serif;cursor:pointer}
.g svg{width:20px;height:20px;flex:0 0 20px}
.pri{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;background:var(--navy);color:#fff;border-radius:12px;height:54px;padding:0 20px;font:600 16px/1 Inter,sans-serif;cursor:pointer;margin-top:14px;text-align:center}
.pri .fl{width:20px;height:20px;flex:0 0 20px}
.pri[disabled]{opacity:.55;cursor:default}
.mini{font-size:13.5px;color:var(--mute);margin:16px 0 0;text-align:center}
.mini a{color:var(--navy)}
.lista{display:flex;flex-direction:column;gap:10px}
.pr{display:grid;grid-template-columns:44px 1fr auto;column-gap:14px;align-items:center;width:100%;text-align:left;background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:12px 14px;cursor:pointer;font:inherit;color:inherit}
.pr .av{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#F2EDE4;display:grid;place-items:center;font:700 17px/1 Inter,sans-serif;position:relative;overflow:hidden}
.pr .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pr .n{font-weight:700;color:var(--navy);font-size:16px;line-height:20px}
.pr .o{font-size:13px;color:var(--mute);line-height:18px;margin-top:2px}
.pr .fl{color:var(--oliva);font-size:20px;line-height:1}
.buscar{width:100%;border:1px solid var(--linea);background:#fff;border-radius:12px;padding:12px 14px;font:inherit;margin:0 0 12px}
.sec{font:700 11.5px/1 Inter,sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:var(--oliva);margin:22px 0 10px}
label{display:block;font-weight:600;color:var(--navy);font-size:15px;margin:18px 0 8px}
input.t{width:100%;border:1px solid var(--linea);background:#fff;border-radius:12px;height:52px;padding:0 14px;font:inherit;font-size:16px;color:var(--tinta)}
.campo{position:relative}
.campo svg{position:absolute;left:16px;top:50%;width:20px;height:20px;margin-top:-10px;pointer-events:none}
.campo input.t{padding-left:46px}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.op{border:1px solid var(--linea);background:#fff;border-radius:12px;padding:12px;font:500 15px/1.2 Inter,sans-serif;cursor:pointer;color:var(--tinta);text-align:center}
.op.on{border-color:var(--navy);background:var(--navy);color:#fff}
.o-sep{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:13.5px;line-height:18px;margin:18px 0}.o-sep:before,.o-sep:after{content:"";flex:1;height:1px;background:var(--linea)}
.codigo{letter-spacing:8px;text-align:center;font-weight:600;font-size:22px!important}
.link{border:0;background:none;color:var(--navy);font:600 14px/1 Inter,sans-serif;text-decoration:underline;cursor:pointer;padding:0}
.err{color:var(--vino);font-size:14px;margin-top:12px}
.oculto{display:none}
.cargando{text-align:center;color:var(--mute);padding-top:30vh}

/* ===== PORTADA (pantalla de entrada) ===== */
body.portada .wrap{max-width:none;padding:0}
.pt{position:relative;overflow:hidden;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 26px) 20px 40px}
.pt .lock{position:relative;z-index:3}
.pt .arte{position:absolute;z-index:1;top:78px;right:-36px;width:270px}
.pt .arte img{-webkit-mask-image:radial-gradient(ellipse 56% 50% at 56% 56%,#000 52%,transparent 100%);mask-image:radial-gradient(ellipse 56% 50% at 56% 56%,#000 52%,transparent 100%)}
.pt .arte img{display:block;width:100%;height:auto}
.pt .hero{position:relative;z-index:2;max-width:560px}
.pt h1.big{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:58px;line-height:.98;letter-spacing:-1.5px;color:var(--navy);margin:150px 0 18px}
.pt h1.big em{display:block;font-style:normal;color:var(--vino)}
.pt .lead{font-size:18px;line-height:1.45;color:#2E2F3C;margin:0 0 26px;max-width:470px}
.pt .lead b{font-weight:700;color:var(--navy)}
.feat{list-style:none;margin:0 0 30px;padding:0;display:flex;flex-direction:column;gap:16px}
.feat li{display:grid;grid-template-columns:52px 1fr;column-gap:16px;align-items:center}
.feat .fi{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--rosa)}
.feat .fi.o{background:var(--olivaclaro)}
.feat .fi svg{width:24px;height:24px;display:block}
.feat .tx b{display:block;font-weight:500;font-size:16px;line-height:21px;color:var(--navy)}
.feat .tx small{display:block;font-size:13.5px;line-height:18px;color:var(--mute);margin-top:2px}
.card{position:relative;z-index:2;background:var(--papel);border:1px solid var(--linea);border-radius:24px;padding:30px 24px 24px;box-shadow:0 18px 50px -24px rgba(16,26,72,.28);max-width:460px}
.card .lock{display:none;justify-content:center;margin:0 0 22px}
.card h2{font-family:'Playfair Display',Georgia,serif;font-weight:800;color:var(--navy);font-size:32px;line-height:1.1;letter-spacing:-.5px;margin:0 0 8px;text-align:center}
.card h2 .ia{font-family:Inter,sans-serif;font-weight:800;letter-spacing:-.8px}
.card p.bj{text-align:center;color:#55525E;font-size:15.5px;margin:0 0 22px}
.tel{display:none}
@media (max-width:359px){.card .mini{white-space:normal!important}}
@media (max-width:979px){
  .pt{padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 24px}
  .pt .lock .mk{width:40px;height:40px}
  .pt .arte{top:calc(env(safe-area-inset-top,0px) + 70px);right:-16px;width:212px}
  .pt h1.big{font-size:56px;line-height:.95;letter-spacing:-1.6px;margin:34px 0 22px}
  .pt .lead{font-size:16.5px;line-height:1.42;margin:0 0 18px}
  .feat{gap:10px;margin:0 0 18px}
  .feat li{grid-template-columns:44px 1fr;column-gap:14px}
  .feat .fi{width:44px;height:44px}.feat .fi svg{width:21px;height:21px}
  .feat .tx b{font-weight:600;font-size:15.5px;line-height:20px}
  .feat .tx small{font-size:12.6px;line-height:18px;margin-top:1px;letter-spacing:-.2px}
  .card{padding:18px 14px 14px;border-radius:22px;max-width:none}
  .card h2,.card p.bj{display:none}
  .card .o-sep{margin:14px 0}
  .card .mini{margin-top:12px;font-size:11px;letter-spacing:-.15px;white-space:nowrap}
}
@media (min-width:980px){
  .pt{display:grid;grid-template-columns:minmax(0,1fr) 300px 430px;column-gap:40px;align-items:center;padding:32px 56px 48px;max-width:1440px;margin:0 auto}
  .pt>.lock{position:absolute;top:34px;left:56px}
  .pt .hero{grid-column:1;padding-top:90px}
  .pt h1.big{font-size:84px;margin-top:0}
  .pt .arte{position:relative;grid-column:2;grid-row:1;top:auto;right:auto;width:440px;margin-left:-70px;align-self:start;margin-top:40px;-webkit-mask-image:none;mask-image:none}
  .card .lock{display:flex}
  .tel{display:block;position:absolute;left:30px;top:250px;z-index:2;transform:rotate(-6deg)}
  .pt .card{grid-column:3;grid-row:1}
}
/* teléfono de muestra (solo compu) */
.tel .fr{width:262px;height:480px;border-radius:42px;background:#111;padding:9px;box-shadow:0 30px 60px -20px rgba(16,26,72,.45)}
.tel .sc{width:100%;height:100%;border-radius:34px;background:#F8F3EA;overflow:hidden;position:relative;padding:34px 14px 0}
.tel .nt{position:absolute;top:0;left:50%;width:110px;height:24px;margin-left:-55px;background:#111;border-radius:0 0 16px 16px}
.tel .ho{font:600 20px/1.1 'Playfair Display',serif;color:var(--navy)}
.tel .ss{font-size:11px;line-height:14px;color:var(--mute);margin:4px 0 12px}
.tel .bx{background:#fff;border-radius:14px;padding:10px 12px;margin:0 0 10px;box-shadow:0 1px 0 var(--linea)}
.tel .k{font-size:10px;line-height:12px;color:var(--mute)}
.tel .num{display:flex;align-items:center;gap:10px;margin-top:6px}
.tel .num svg{width:26px;height:26px;flex:0 0 26px}
.tel .num b{font:800 22px/1 Inter,sans-serif;color:var(--navy)}
.tel .num small{display:block;font-size:10px;line-height:12px;color:var(--mute)}
.tel .bars{margin-left:auto;display:flex;align-items:flex-end;gap:3px;height:34px}
.tel .bars i{display:block;width:8px;background:#C9D0A6;border-radius:2px}
.tel .rh{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;line-height:14px;color:var(--navy);font-weight:600;margin:4px 2px 6px}
.tel .rh span{font-weight:500;color:var(--mute);font-size:9.5px}
.tel .rd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.tel .rd div{background:#fff;border-radius:10px;padding:7px 0 6px;text-align:center;font-size:8.5px;line-height:11px;color:var(--mute)}
.tel .rd svg{width:20px;height:20px;display:block;margin:0 auto 3px}
.tel .rd b{display:block;color:var(--navy);font-size:10px}
.tel .pb{height:5px;border-radius:3px;background:#E8E2D4;margin-top:7px;overflow:hidden}.tel .pb i{display:block;height:100%;width:60%;background:#5F6B3A}
.tel .nav{position:absolute;left:0;right:0;bottom:0;height:52px;background:#fff;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;text-align:center;font-size:8px;color:var(--mute)}
.tel .nav span:first-child{color:var(--navy);font-weight:700}
</style>

      <button class="g" id="gg">${G}Continuar con Google</button>
      <div class="o-sep">o con tu mail</div>
      <div class="campo">${IC.mail}<input class="t" id="em" type="email" inputmode="email" autocomplete="email" placeholder="tu@mail.com"></div>
      <button class="pri" id="emb"><span id="embt">Recibir código por mail</span>${IC.flecha}</button>
      ${msg?`<p class="err">${esc(msg)}</p>`:''}
      <p class="mini">Al entrar aceptás las <a href="/terminos.html">condiciones</a> y la <a href="/privacidad.html">política de privacidad</a>.</p>
    </section>
  </div>`;
  $('gg').onclick=async()=>{ $('gg').disabled=true;
    const ret=location.origin+location.pathname+(Q.get('c')&&Q.get('k')?'?c='+encodeURIComponent(Q.get('c'))+'&k='+encodeURIComponent(Q.get('k')):'');
    const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:ret,queryParams:{prompt:'select_account'}}});
    if(error){ $('gg').disabled=false; pantallaLogin('No pudimos abrir Google. Probá de nuevo.'); } };
  const pedir=async()=>{ const em=($('em').value||'').trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(em)){ pantallaLogin('Revisá el mail: parece que le falta algo.'); return; }
    $('emb').disabled=true; $('embt').textContent='Enviando…';
    const {error}=await sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:true}});
    if(error){ pantallaLogin(/rate|seconds/i.test(error.message)?'Ya te mandamos un código hace un momento. Esperá un minuto y probá de nuevo.':'No pudimos mandar el mail. Probá de nuevo en un rato.'); return; }
    pantallaCodigo(em); };
  $('emb').onclick=pedir; $('em').onkeydown=e=>{ if(e.key==='Enter') pedir(); };
}

function pantallaCodigo(em,msg){
  A.innerHTML=cab(false)+`<h1>Revisá tu mail</h1>
    <p class="bj">Te mandamos un código a <b>${esc(em)}</b>. Escribilo acá para entrar. Si no lo ves, buscá en spam o promociones.</p>
    <input class="t codigo" id="cod" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="······">
    <button class="pri" id="cb">Entrar</button>
    ${msg?`<p class="err">${esc(msg)}</p>`:''}
    <p class="mini"><button class="link" id="otro">Usar otro mail</button></p>`;
  const ir=async()=>{ const t=($('cod').value||'').replace(/\D/g,''); if(t.length<6){ pantallaCodigo(em,'El código tiene 6 números.'); return; }
    $('cb').disabled=true; $('cb').textContent='Entrando…';
    const {error}=await sb.auth.verifyOtp({email:em,token:t,type:'email'});
    if(error){ pantallaCodigo(em,'Ese código no es válido o ya venció. Revisá el último mail o pedí uno nuevo.'); return; }
    inicio(); };
  $('cb').onclick=ir; $('cod').oninput=()=>{ if(($('cod').value||'').replace(/\D/g,'').length===6) ir(); };
  $('otro').onclick=()=>pantallaLogin(); setTimeout(()=>$('cod').focus(),50);
}

function pantallaAlta(email,hayOtros){
  let tipo='musica', mon='ARS';
  A.innerHTML=cab(true)+`<h1>Creá tu proyecto</h1>
    <p class="bj">Es tu espacio en SemillaIA. Después conectás tus redes y empezás a ver tus números.</p>
    <label for="nom">¿Cómo se llama tu proyecto?</label><input class="t" id="nom" maxlength="80" placeholder="Tu nombre artístico o el de tu proyecto" autocomplete="off">
    <label>¿Qué hacés?</label><div class="ops" id="tip">
      <button class="op on" data-v="musica">Música</button><button class="op" data-v="arte">Arte visual</button>
      <button class="op" data-v="teatro">Teatro o danza</button><button class="op" data-v="mixto">Otro proyecto cultural</button></div>
    <label>¿En qué moneda trabajás?</label><div class="ops" id="mon">
      <button class="op on" data-v="ARS">Pesos</button><button class="op" data-v="USD">Dólares</button></div>
    <button class="pri" id="crear">Crear mi proyecto</button><p class="err oculto" id="er"></p>
    ${hayOtros?'<p class="mini"><a href="#" id="volv">Volver a mis proyectos</a></p>':''}
    <p class="mini">Entraste como ${esc(email)}</p>`;
  const grupo=(id,cb)=>$(id).querySelectorAll('.op').forEach(b=>b.onclick=()=>{ $(id).querySelectorAll('.op').forEach(x=>x.classList.toggle('on',x===b)); cb(b.dataset.v); });
  grupo('tip',v=>tipo=v); grupo('mon',v=>mon=v);
  $('salir').onclick=salir; const v=$('volv'); if(v) v.onclick=e=>{e.preventDefault(); inicio();};
  $('crear').onclick=async()=>{ const n=$('nom').value.trim(); if(!n){ $('nom').focus(); return; }
    $('crear').disabled=true; $('crear').textContent='Creando…';
    const {data,error}=await sb.rpc('crear_proyecto',{p_nombre:n,p_tipo:tipo,p_moneda:mon});
    if(error||!data||data.error){ $('crear').disabled=false; $('crear').textContent='Crear mi proyecto'; $('er').classList.remove('oculto');
      $('er').textContent=(data&&data.error==='limite')?'Llegaste al máximo de proyectos propios.':'No se pudo crear. Probá de nuevo.'; return; }
    try{ window.SRE_ALTA=1; }catch(e){}
    pantallaBienvenida({slug:data.slug,k:data.k},n); };
}

/* Bienvenida: primer paso después de crear el proyecto. Meta trae Instagram y la cuenta publicitaria;
   el @usuario es la alternativa que anda para cualquiera (Meta está en revisión). */
function pantallaBienvenida(p,nombre,msg){
  const app=location.origin+'/cliente.html?c='+encodeURIComponent(p.slug)+'&k='+encodeURIComponent(p.k)+'&app=1';
  const meta='/oauth-meta.html?c='+encodeURIComponent(p.slug)+'&k='+encodeURIComponent(p.k)+'&volver='+encodeURIComponent(app);
  A.innerHTML=cab(false)+`<h1>¡Listo, ${esc(nombre)}!</h1>
    <p class="bj">Conectá tu Instagram y tu publicidad para que SemillaIA lea tus números solo, todas las semanas. Solo lectura: nunca publicamos ni cambiamos nada.</p>
    <a class="pri" id="mt" href="${meta}" style="text-align:center;text-decoration:none;margin-top:0">Conectar con Meta</a>
    <p class="mini" style="text-align:left;margin-top:10px">Trae tu Instagram profesional y tu cuenta publicitaria. Te pide entrar con tu Facebook.</p>
    <div class="o-sep">o solo tu Instagram</div>
    <input class="t" id="ig" placeholder="@tuusuario" autocomplete="off" autocapitalize="off">
    <button class="g" id="igb" style="margin-top:10px">Conectar mi Instagram</button>
    ${msg?`<p class="err">${esc(msg)}</p>`:''}
    <p class="mini"><button class="link" id="desp">Después</button></p>`;
  $('mt').onclick=()=>{ ls.set('sr_app_ultimo',p.slug); };
  $('desp').onclick=()=>abrir(p);
  const ig=async()=>{ const v=($('ig').value||'').trim(); if(!v){ $('ig').focus(); return; }
    $('igb').disabled=true; $('igb').textContent='Conectando…';
    let r=null; try{ r=await fetch('https://vm.semillaredes.com/web/conexion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({c:p.slug,k:p.k,fuente:'instagram',valor:v})}).then(x=>x.json()); }catch(e){}
    if(r&&r.ok) abrir(p); else pantallaBienvenida(p,nombre,(r&&r.error)||'No pudimos conectar ese Instagram. Probá de nuevo.'); };
  $('igb').onclick=ig; $('ig').onkeydown=e=>{ if(e.key==='Enter') ig(); };
}

function pantallaLista(d){
  const P=d.proyectos||[], mios=P.filter(p=>p.mio), otros=P.filter(p=>!p.mio);
  const fila=p=>`<button class="pr" data-s="${esc(p.slug)}"><span class="av">${esc((p.nombre||'?').trim()[0].toUpperCase())}<img src="/assets/avatars/${esc(p.slug)}.jpg" alt="" onerror="this.remove()"></span><span><span class="n">${esc(p.nombre)}</span><br><span class="o">${ORIGEN[p.origen]||''}${p.interno?' · interno':''}</span></span><span class="fl">›</span></button>`;
  A.innerHTML=cab(true)+`<h1>${d.semilla?'Proyectos':'Tus proyectos'}</h1>
    <p class="bj">${d.semilla?'Entrás como Semilla: ves todos los proyectos y podés conectarles las redes.':'Elegí con cuál querés trabajar.'}</p>
    ${P.length>6?'<input class="buscar" id="bus" placeholder="Buscar proyecto" autocomplete="off">':''}
    ${mios.length&&otros.length?'<div class="sec">Tuyos</div>':''}<div class="lista">${mios.map(fila).join('')}</div>
    ${otros.length?`${mios.length?'<div class="sec">Todos</div>':''}<div class="lista" id="todos">${otros.map(fila).join('')}</div>`:''}
    <button class="pri" id="nuevo" style="background:transparent;color:var(--navy);border:1px solid var(--navy)">Crear otro proyecto</button>
    <p class="mini">Entraste como ${esc(d.email)}</p>`;
  A.querySelectorAll('.pr').forEach(b=>b.onclick=()=>abrir(P.find(p=>p.slug===b.dataset.s)));
  $('nuevo').onclick=()=>pantallaAlta(d.email,true); $('salir').onclick=salir;
  const bus=$('bus'); if(bus) bus.oninput=()=>{ const q=bus.value.toLowerCase(); A.querySelectorAll('.pr').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q)?'':'none'); };
}

async function salir(){ await sb.auth.signOut(); ls.del('sr_semilla'); ls.del('sr_app_ultimo'); location.href='/app.html'; }

async function inicio(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ pantallaLogin(); return; }
  // venía con un link de siempre: lo vinculo a su Gmail
  if(Q.get('c')&&Q.get('k')){ await sb.rpc('vincular_proyecto',{p_slug:Q.get('c'),p_k:Q.get('k')}); history.replaceState(null,'','/app.html'+(Q.get('elegir')?'?elegir=1':'')); }
  const {data:d,error}=await sb.rpc('mis_proyectos');
  if(error||!d||d.error){ pantallaLogin('No pudimos cargar tus proyectos. Probá de nuevo.'); return; }
  if(d.semilla){ ls.set('sr_semilla','1'); ls.set('sr_yo','1'); } else ls.del('sr_semilla');
  const P=d.proyectos||[];
  if(!P.length){ pantallaAlta(d.email,false); return; }
  const ult=ls.get('sr_app_ultimo'), u=P.find(p=>p.slug===ult);
  if(!Q.get('elegir')&&!d.semilla&&P.filter(p=>p.mio).length===1){ abrir(P.find(p=>p.mio)); return; }
  if(!Q.get('elegir')&&u&&!d.semilla){ abrir(u); return; }
  pantallaLista(d);
}
if(Q.get('salir')) salir(); else inicio();
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
<script src="https://semillaredes.com/assets/puente.js?v=2" data-app defer></script>
</body>
